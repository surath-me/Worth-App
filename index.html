<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Worth">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>Worth</title>
<style>
:root{
  /* Dark mode only for now. The light palette is kept below under [data-theme="light"] (nothing sets it yet). */
  --bg:#000000; --card:#1C1C1E; --text:#FFFFFF; --sec:#98989F; --ter:#5C5C61;
  --sep:rgba(84,84,88,.55); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.34);
  --accent:#3CD9CF; --g1:#0EA67A; --g2:#2466E0; --g1a:rgba(54,245,178,.45); --g2a:rgba(58,164,255,.45); --up:#36F5B2; --down:#FF6961; --nav:rgba(0,0,0,.72);
  --scrim:rgba(0,0,0,.5); --behind:#000;
  --spring:cubic-bezier(.32,.72,0,1); --ease:cubic-bezier(.65,0,.35,1);
  color-scheme:dark;
  --grad:linear-gradient(115deg,var(--g1) 0%,#0B82A6 50%,var(--g2) 100%);
  --glow:0 10px 26px -10px var(--g1a),0 8px 28px -10px var(--g2a);
  --glass:rgba(44,44,48,.5); --glass-strong:rgba(58,58,62,.6); --lens:rgba(255,255,255,.14);
  --rim:rgba(255,255,255,.4); --rim2:rgba(255,255,255,.07); --sheet-glass:rgba(24,24,26,.78);
  --gshadow:0 14px 36px -14px rgba(0,0,0,.8);
  --card2:#2C2C2E;
  --bounce:cubic-bezier(.34,1.56,.64,1);
}
:root[data-theme="light"]{
  --bg:#F2F2F7; --card:#FFFFFF; --text:#000000; --sec:#6C6C70; --ter:#AEAEB2;
  --sep:rgba(60,60,67,.16); --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.2);
  --accent:#0BA6A0; --g1:#0A9C73; --g2:#1F5ED6; --g1a:rgba(15,203,140,.5); --g2a:rgba(42,134,255,.45); --up:#0FB57A; --down:#E5484D; --nav:rgba(242,242,247,.78);
  --scrim:rgba(0,0,0,.28);
  --glass:rgba(255,255,255,.58); --glass-strong:rgba(255,255,255,.7); --lens:rgba(255,255,255,.85);
  --rim:rgba(255,255,255,.95); --rim2:rgba(255,255,255,.28); --sheet-glass:rgba(242,242,247,.8);
  --gshadow:0 12px 32px -14px rgba(25,40,70,.3),0 1px 2px rgba(0,0,0,.04);
  --card2:#FFFFFF;
  color-scheme:light;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  font-size:15px;line-height:1.3;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;transition:background-color .5s var(--spring);
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:transparent;transition:background-color .3s}
body.scrolled::before{background:var(--nav);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
body.sheet-open{overflow:hidden;background:var(--behind)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}

#app{position:relative;max-width:560px;margin:0 auto;min-height:100%;background:var(--bg);transform-origin:50% 0;
  transition:transform .55s var(--spring),border-radius .55s var(--spring)}
body.sheet-open #app{transform:scale(.93);border-radius:14px;overflow:hidden}

.aura{position:absolute;inset:0 0 auto;height:720px;pointer-events:none;z-index:0;overflow:hidden;opacity:.85;
  -webkit-mask-image:linear-gradient(#000 40%,transparent 92%);mask-image:linear-gradient(#000 40%,transparent 92%)}
.aura::before,.aura::after{content:"";position:absolute;z-index:1;width:135%;aspect-ratio:1;border-radius:50%;will-change:transform,scale}
.aura-drift{position:absolute;left:0;top:0;width:110%;height:70%;background:radial-gradient(closest-side,rgba(11,130,166,.26),transparent);animation:drift 13s ease-in-out infinite alternate;will-change:transform}
.aura::before{left:-40%;top:-38%;background:radial-gradient(closest-side,var(--g1a),transparent);animation:spinA 19s linear infinite,breathe 8s ease-in-out infinite alternate}
.aura::after{right:-45%;top:-18%;background:radial-gradient(closest-side,var(--g2a),transparent);animation:spinB 24s linear infinite,breathe 10s ease-in-out -4s infinite alternate}
@keyframes spinA{from{transform:rotate(0deg) translateX(24%) rotate(0deg)}to{transform:rotate(360deg) translateX(24%) rotate(-360deg)}}
@keyframes spinB{from{transform:rotate(180deg) translateX(26%) rotate(-180deg)}to{transform:rotate(-180deg) translateX(26%) rotate(180deg)}}
@keyframes breathe{from{scale:1}to{scale:1.22}}
/* the aura is hidden behind the scrim while a sheet is open: pause it so the sheet animation gets the frame budget */
body.sheet-open .aura-drift,body.sheet-open .aura::before,body.sheet-open .aura::after{animation-play-state:paused}
@keyframes drift{from{transform:translate3d(-.9%,0,0)}to{transform:translate3d(-8.2%,19.3%,0)}}
main,.nav{position:relative;z-index:1}
.gtext{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
/* nav */
.nav{position:sticky;z-index:9;top:env(safe-area-inset-top,0px);z-index:9;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;transition:background-color .3s,box-shadow .3s}
body.scrolled .nav{background:var(--nav);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--sep)}
.nav-title{font-weight:600;opacity:0;transform:translateY(6px);transition:opacity .25s,transform .35s var(--spring)}
body.scrolled .nav-title{opacity:1;transform:none}
.nav-actions{display:flex;gap:4px}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--accent);transition:transform .25s var(--spring),background-color .2s}
.icon-btn:active{transform:scale(.86);background:var(--fill)}
.icon-btn svg{width:22px;height:22px}

main{padding:0 16px calc(120px + env(safe-area-inset-bottom,0px))}
h1.large{font-size:28px;font-weight:700;letter-spacing:.01em;margin:2px 4px 14px}

/* hero */
.hero{padding:0 4px}
.hero-label{font-size:13px;color:var(--sec);height:18px;transition:color .2s}
.total{font-size:38px;font-weight:700;letter-spacing:-.025em;line-height:1.08;margin:2px 0 4px;white-space:nowrap;
  transition:filter .45s var(--spring),font-size .3s var(--spring)}
.delta{font-size:13px;font-weight:600;height:20px;display:flex;align-items:center;gap:6px;color:var(--sec)}
.delta .chg{display:inline-flex;align-items:center;gap:3px;transition:color .3s}
.delta .chg.up{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}.delta .chg.up svg{color:var(--g1)} .delta .chg.down{color:var(--down)}
.delta .when{font-weight:400;color:var(--sec)}
.delta svg{width:11px;height:11px;transition:transform .4s var(--spring)}
.delta .down svg{transform:rotate(180deg)}
body.hide .amt{filter:blur(10px)}

/* chart */
.chart-wrap{position:relative;height:210px;margin:14px -16px 0;touch-action:pan-y;user-select:none;-webkit-user-select:none}
#chart{display:block;width:100%;height:100%;overflow:visible}
#chart .line{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transition:stroke .4s}
#chart .area{transition:opacity .8s ease .25s}
#chart .base{stroke:var(--ter);stroke-width:1;stroke-dasharray:2 4}
#chart .lbl{fill:var(--ter);font-size:11px}
#chart .scrub{opacity:0;transition:opacity .15s}
#chart.scrubbing .scrub{opacity:1}
#chart.scrubbing .enddot,#chart.scrubbing .pulse{opacity:0}
#chart .scrub line{stroke:var(--sec);stroke-width:1}
#chart .scrub circle{stroke:var(--card);stroke-width:3;transition:cx .12s var(--spring),cy .12s var(--spring)}
#chart .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s var(--ease) infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.5}70%,100%{transform:scale(3.2);opacity:0}}
.chart-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 40px;font-size:14px;color:var(--sec);pointer-events:none;opacity:0;transition:opacity .4s}
.chart-empty.show{opacity:1}

/* segmented */
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:9px;padding:2px;margin:12px 0 0}
.seg button{position:relative;z-index:1;height:30px;font-size:13px;font-weight:500;border-radius:7px;transition:color .2s}
.seg button[aria-pressed="true"]{font-weight:600}
.seg .thumb{position:absolute;top:2px;bottom:2px;left:2px;border-radius:7px;background:#636366;box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 1px rgba(0,0,0,.08);transition:transform .45s var(--spring)}
:root[data-theme="light"] .seg .thumb{background:var(--card)}

/* cards & lists */
.section-h{display:flex;justify-content:space-between;align-items:baseline;margin:28px 4px 8px}
.section-h h2{font-size:19px;font-weight:700;margin:0}
.section-h button{color:var(--accent);font-size:15px}
.card{background:var(--card);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:60px;position:relative;width:100%;text-align:left;transition:background-color .2s}
.row + .row::before{content:"";position:absolute;top:0;left:64px;right:0;height:.5px;background:var(--sep)}
button.row:active{background:var(--fill)}
.avatar{background-image:linear-gradient(150deg,rgba(255,255,255,.38),rgba(255,255,255,0) 55%,rgba(0,0,0,.08));box-shadow:inset 0 0 0 .5px rgba(255,255,255,.25);flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:600;font-size:16px}
.row .mid{flex:1;min-width:0}
.row .t1{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:13px;color:var(--sec);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .end{text-align:right;flex:none}
.row .end .t1{font-weight:600}
.row.enter{animation:enter .6s var(--spring) both}
@keyframes enter{from{opacity:0;transform:translateY(-10px) scale(.98)}}

.primary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:999px;background:var(--grad);background-size:180% 100%;color:#fff;font-weight:600;font-size:16px;margin-top:16px;box-shadow:var(--glow);text-shadow:0 1px 1px rgba(0,0,0,.12);animation:sheen 6s ease-in-out infinite alternate;transition:transform .3s var(--spring),opacity .2s,box-shadow .3s}
@keyframes sheen{from{background-position:0% 50%}to{background-position:100% 50%}}
.primary:active{transform:scale(.97);opacity:.85}
.primary:disabled{opacity:.35;box-shadow:none}


.nudge{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--spring),margin .5s var(--spring);margin-top:0}
.nudge.show{grid-template-rows:1fr;margin-top:16px}
.nudge > div{overflow:hidden}
.nudge .card{padding:14px 16px;display:flex;gap:12px;align-items:center}
.nudge .dot{width:9px;height:9px;border-radius:50%;background:var(--grad);box-shadow:0 0 10px var(--g1a),0 0 14px var(--g2a);flex:none;animation:dotPulse 2s ease-in-out infinite}
@keyframes dotPulse{50%{transform:scale(.6);opacity:.5}}
.nudge p{margin:0;font-size:14px;color:var(--sec)} .nudge b{color:var(--text);font-weight:600;display:block}

/* allocation */
.alloc{padding:16px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;background:var(--fill)}
.bar span{display:block;height:100%;background-image:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0));flex:0 0 0;transition:flex-basis 1s var(--spring)}
.legend{margin-top:12px}
.legend .li{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:14px}
.legend .sw{width:10px;height:10px;border-radius:3px;flex:none}
.legend .nm{flex:1}
.legend .pc{color:var(--sec);width:48px;text-align:right}
.legend .vl{width:110px;text-align:right;font-weight:500}

.empty-list{padding:28px 20px;text-align:center;color:var(--sec);font-size:14px}
.foot{text-align:center;color:var(--ter);font-size:12px;margin-top:28px}

/* monthly tiles */
.section-h.tight{margin-top:22px}
.section-h.tight h2{font-size:17px}
.section-h button{font-size:14px;font-weight:600}
.tiles{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 10px;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tiles::-webkit-scrollbar{display:none}
.tile{flex:none;width:138px;min-height:96px;scroll-snap-align:start;scroll-margin-left:16px;background:var(--card);border-radius:18px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;border:1.5px solid transparent;transition:transform .35s var(--spring)}
.tile:active{transform:scale(.95)}
.tile .m{font-size:13px;color:var(--sec);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.tile .v{font-size:17px;font-weight:700;letter-spacing:-.015em;margin-top:auto;padding-top:10px;white-space:nowrap}
.tile .c{font-size:13px;margin-top:2px;color:var(--sec);white-space:nowrap}
.tile.sel{background:linear-gradient(var(--card),var(--card)) padding-box,var(--grad) border-box;box-shadow:var(--glow)}
.tile .badge{font-size:11px;font-weight:700;color:#fff;background:var(--grad);border-radius:8px;padding:2px 7px}
.tile.todo{background:transparent;border:1.5px dashed var(--fill2)}
.tile.todo .plus{width:30px;height:30px;border-radius:50%;background:var(--grad);box-shadow:var(--glow);display:grid;place-items:center;color:#fff;margin-top:auto}
.tile.todo .plus svg{width:16px;height:16px}
.tile.todo .c{margin-top:8px;color:var(--text);font-weight:600}
.tile.pop{animation:tilein .6s var(--spring) both}
@keyframes tilein{from{opacity:0;transform:translateX(18px) scale(.96)}}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between;
  padding:26px 16px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,var(--bg) 46%);
  transition:transform .5s var(--spring),opacity .3s}
body.sheet-open .tabbar{transform:translateY(120%);opacity:0;pointer-events:none}
.tabs{position:relative;flex:none;display:grid;grid-template-columns:repeat(2,92px);height:62px;padding:4px;border-radius:31px;background:var(--card);
  box-shadow:0 10px 30px -12px rgba(0,0,0,.3),inset 0 0 0 .5px var(--sep)}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--sec);border-radius:27px;transition:color .3s}
.tab svg{width:24px;height:24px;transition:transform .5s var(--spring)}
.tab[aria-selected="true"]{color:var(--accent)}
.tab[aria-selected="true"] svg{transform:scale(1.1)}
.tab:active svg{transform:scale(.85)}
.tab-ind{position:absolute;top:4px;bottom:4px;left:4px;width:92px;border-radius:27px;background:var(--fill);transition:transform .55s var(--spring)}
.fab{flex:none;width:62px;height:62px;padding:0;justify-content:center;border-radius:50%;background:var(--grad);background-size:180% 100%;color:#fff;font-weight:700;font-size:17px;
  display:flex;align-items:center;gap:7px;box-shadow:var(--glow);text-shadow:0 1px 1px rgba(0,0,0,.12);animation:sheen 6s ease-in-out infinite alternate;transition:transform .35s var(--spring)}
.fab svg{width:26px;height:26px;transition:transform .5s var(--spring)}
.fab:active{transform:scale(.93)} .fab:active svg{transform:rotate(90deg)}


.ghost{height:52px;padding:0 18px 0 14px;border-radius:999px;background:var(--card);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:8px;
  box-shadow:0 6px 18px -10px rgba(0,0,0,.25),inset 0 0 0 .5px var(--sep);transition:transform .3s var(--spring)}
.ghost:active{transform:scale(.96)}
.ghost svg{width:18px;height:18px;flex:none;color:var(--g1)}
/* entry form */
.entry-top{padding:6px 0 4px}
.name-in{display:block;width:100%;border:0;background:none;outline:none;text-align:center;font-size:16px;font-weight:600;padding:14px 16px 0;color:var(--text)}
.name-in::placeholder{color:var(--ter);font-weight:500}
.entry-top .big-amt{padding:6px 16px 16px}
.pick{position:relative;cursor:pointer}
.pick .pl{flex:1}
.pick .pv{color:var(--sec);display:inline-flex;align-items:center;gap:8px;transition:transform .35s var(--spring)}
.pick .pv.bump{animation:bump .4s var(--spring)}
@keyframes bump{40%{transform:scale(1.08)}}
.pick .dot{width:10px;height:10px;border-radius:50%}
.pick .chev{color:var(--ter);font-size:22px;line-height:1;margin-left:2px}
.pick select{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:17px;cursor:pointer;-webkit-appearance:none;appearance:none}
.pick:active{background:var(--fill)}
.field .field-sep{}
.sheet-body > .card + .card{margin-top:16px}
input::-webkit-calendar-picker-indicator{display:none!important;opacity:0}
/* views */
.view{display:none}
.view.active{display:block;animation:viewin .5s var(--spring)}
@keyframes viewin{from{opacity:0;transform:translateY(12px)}}
h1.large.swap{animation:viewin .45s var(--spring)}
#mmode{margin:0 0 14px}
.ghost.wide{width:100%;justify-content:center;margin-top:16px}
.ghost.wide span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.mdetail-empty{padding:40px 20px;text-align:center;color:var(--sec);font-size:14px}
.mhead{margin:10px 4px 0}
/* table */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{border-collapse:separate;border-spacing:0;font-size:14px;min-width:100%}
.tbl th,.tbl td{padding:12px 14px;white-space:nowrap;text-align:right;border-bottom:.5px solid var(--sep);font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
.tbl th{font-size:13px;font-weight:600;color:var(--sec);cursor:pointer}
.tbl th:active{color:var(--accent)}
.tbl .first{position:sticky;left:0;z-index:1;background:var(--card);text-align:left;max-width:140px;overflow:hidden;text-overflow:ellipsis;box-shadow:6px 0 10px -8px rgba(0,0,0,.2)}
.tbl .first small{display:block;font-size:12px;color:var(--sec);font-weight:400}
.tbl .tot td{font-weight:700}
.tbl .na{color:var(--ter)}
.tbl .up{color:var(--up)} .tbl .dn{color:var(--down)}
.tbl-note{font-size:13px;color:var(--sec);margin:10px 16px 0}

/* history */
.row.noav + .row.noav::before{left:16px}
.row .chev{color:var(--ter);font-size:22px;line-height:1;margin-left:-4px;flex:none}
.pos,.row .pos{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:600}
.neg,.row .neg{color:var(--down);font-weight:600}
.more-btn{display:block;margin:10px auto 0;font-size:14px;font-weight:600;padding:6px 12px}
.mnav{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin:4px 0 6px}
.mnav .icon-btn:disabled{opacity:.2;pointer-events:none}
.mnav .icon-btn svg{width:20px;height:20px}
.mhead{text-align:center}
.mhead .total{font-size:33px;margin:0}
.mhead .delta{justify-content:center}
.mview.slide-l{animation:slideL .45s var(--spring)}
.mview.slide-r{animation:slideR .45s var(--spring)}
@keyframes slideL{from{opacity:0;transform:translateX(-28px)}}
@keyframes slideR{from{opacity:0;transform:translateX(28px)}}
.mbar{margin:18px 4px 0}

/* sheet */
#scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .45s var(--spring);z-index:20}
body.sheet-open #scrim{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;background:var(--bg);
  border-radius:14px 14px 0 0;max-height:calc(100% - env(safe-area-inset-top,0px) - 10px);display:flex;flex-direction:column;
  transform:translateY(105%);transition:transform .5s var(--spring);box-shadow:0 -10px 40px rgba(0,0,0,.18);visibility:hidden}
#sheet.open{transform:none;visibility:visible}
#sheet.dragging{transition:none}
.grab{flex:none;padding:6px 16px 0;touch-action:none}
.handle{width:36px;height:5px;border-radius:3px;background:var(--fill2);margin:0 auto 6px}
.sheet-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:44px}
.sheet-bar .ttl{font-weight:600;text-align:center}
.sheet-bar .l{justify-self:start;color:var(--accent)} .sheet-bar .r{justify-self:end;color:var(--accent);font-weight:600;transition:opacity .2s}
.sheet-bar .r:disabled{opacity:.35}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
.lbl-s{font-size:13px;color:var(--sec);margin:22px 16px 7px}
.lbl-s:first-child{margin-top:6px}
.note{font-size:13px;color:var(--sec);margin:8px 16px 0;line-height:1.4}
.field{display:flex;align-items:center;gap:10px;padding:0 16px;min-height:50px;position:relative}
.field + .field::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.field label{flex:none;min-width:84px}

.field input.left{text-align:left}
.field input::placeholder{color:var(--ter)}
.field .cur{color:var(--sec);flex:none}
.big-amt{position:relative;display:block;padding:18px 16px;cursor:text}
.big-amt .disp{display:flex;align-items:baseline;justify-content:center;gap:6px;pointer-events:none;min-height:42px}
.big-amt .sym{font-size:26px;font-weight:600;color:var(--sec)}
.big-amt .digits{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80%}
.big-amt .digits.ph{color:var(--ter)}
.big-amt .digits.tick{animation:tick .3s var(--spring)}
@keyframes tick{40%{transform:scale(1.04)}}
.big-amt .caret{align-self:center;width:2.5px;height:32px;border-radius:2px;background:var(--grad);margin-left:-3px;opacity:0}
.big-amt.focus .caret{animation:blink 1.05s steps(1) infinite}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
.big-amt input{position:absolute;inset:0;width:100%;height:100%;border:0;margin:0;padding:0;background:transparent;outline:none;color:transparent;caret-color:transparent;font-size:16px;text-align:center;-webkit-text-fill-color:transparent;-webkit-user-select:text;user-select:text}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:17px;background:var(--card);font-size:14px;display:inline-flex;align-items:center;gap:7px;transition:background-color .25s,color .25s,transform .3s var(--spring)}
.chip:active{transform:scale(.94)}
.chip .sw{width:9px;height:9px;border-radius:50%}
.chip[aria-pressed="true"]{background:var(--grad);color:#fff;box-shadow:var(--glow)}
.chip[aria-pressed="true"] .sw{box-shadow:0 0 0 2px #fff}
.danger{color:var(--down);width:100%;height:52px;border-radius:999px;background:var(--card);margin-top:22px;font-size:15px;transition:transform .3s var(--spring),background-color .2s}
.danger:active{transform:scale(.97)}
.danger.armed{background:var(--down);color:#fff}
.plain-btn{width:100%;height:50px;color:var(--accent);font-size:15px;text-align:left;padding:0 16px;position:relative}
.plain-btn + .plain-btn::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.plain-btn:active{background:var(--fill)}
textarea.backup{width:100%;min-height:120px;border:0;border-radius:14px;background:var(--card);padding:12px 14px;font-size:13px;font-family:ui-monospace,Menlo,monospace;resize:vertical;margin-top:10px;outline:none}
.upd-row .end input{width:120px;border:0;background:var(--fill);border-radius:9px;padding:8px 10px;text-align:right;font-size:16px;outline:none;font-variant-numeric:tabular-nums;transition:box-shadow .2s}
.upd-row .end input:focus{box-shadow:0 0 0 2px var(--accent)}
.upd-row .end .c{font-size:12px;color:var(--sec);margin-top:3px}
.upd-total{display:flex;justify-content:space-between;align-items:baseline;padding:16px 4px 0}

.upd-total .v{font-size:19px;font-weight:700}
.month-in{border:0;background:var(--fill);border-radius:9px;padding:7px 10px;font-size:16px;color:var(--accent);outline:none;text-align:right;max-width:190px}
.hist-row .del{color:var(--down);font-size:14px;padding:6px 10px;border-radius:8px;transition:background-color .2s,color .2s}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:30;transform:translate(-50%,-140%) scale(.9);opacity:0;
  background:var(--card);color:var(--text);padding:10px 16px 10px 12px;border-radius:22px;font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center;
  box-shadow:0 8px 30px rgba(0,0,0,.16);transition:transform .55s var(--spring),opacity .3s;pointer-events:none;white-space:nowrap}
#toast.show{transform:translate(-50%,0) scale(1);opacity:1}
#toast svg{width:20px;height:20px;color:var(--g1)}

/* ---------- liquid glass ---------- */
.card,.tile:not(.todo),.ghost,.danger{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(175%);backdrop-filter:blur(26px) saturate(175%);box-shadow:var(--gshadow);position:relative}
.tile.sel{background:linear-gradient(var(--card),var(--card)) padding-box,var(--grad) border-box}
.card::after,.tabs::after,.fab::after,.icon-btn::after,.seg .thumb::after,.tile:not(.todo)::after,.ghost::after,#sheet::after,#toast::after,.tab-ind::after,.danger::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;padding:1px;
  background:linear-gradient(150deg,var(--rim),var(--rim2) 28%,transparent 52%,var(--rim2) 78%,var(--rim));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.icon-btn{position:relative;background:var(--glass-strong);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:var(--gshadow);transition:transform .5s var(--bounce),background-color .2s}
.icon-btn:active{transform:scale(.82);background:var(--glass-strong)}
.nav-actions{gap:8px}
/* glass tab bar */
.tabbar{--tw:92px;background:none;pointer-events:none}
.tabbar > *{pointer-events:auto}
.tabbar.min{--tw:64px}
.tabs{grid-template-columns:repeat(2,var(--tw));background:var(--glass-strong);-webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);
  box-shadow:var(--gshadow);transition:grid-template-columns .55s var(--spring),height .55s var(--spring),border-radius .55s var(--spring)}
.tabbar.min .tabs{height:52px;border-radius:26px}
.tab span{max-height:14px;transition:opacity .3s,max-height .45s var(--spring)}
.tabbar.min .tab span{opacity:0;max-height:0}
.tab-ind{width:var(--tw);background:var(--lens);box-shadow:0 4px 14px -6px rgba(0,0,0,.25);transition:transform .6s var(--spring),width .55s var(--spring)}
.fab{position:relative;transition:transform .6s var(--bounce),width .55s var(--spring),height .55s var(--spring);
  box-shadow:var(--glow),inset 0 1px 1px rgba(255,255,255,.5),inset 0 -8px 16px rgba(0,0,0,.2)}
.fab::before{content:"";position:absolute;left:16%;top:7%;width:58%;height:42%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.5),transparent);pointer-events:none}
.fab:active{transform:scale(.84)}
.tabbar.min .fab{width:52px;height:52px}
/* glass segmented */
#app .seg,#sheet .seg{background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:12px;padding:3px}
#app .seg .thumb,#sheet .seg .thumb{top:3px;bottom:3px;left:3px;border-radius:9px;background:var(--lens);box-shadow:0 4px 14px -6px rgba(0,0,0,.3);transition:transform .6s var(--bounce)}
/* glass sheet: grows out of the + button */
#sheet{background:var(--sheet-glass);-webkit-backdrop-filter:blur(34px) saturate(180%);backdrop-filter:blur(34px) saturate(180%);border-radius:28px 28px 0 0;
  transition:transform .62s var(--spring),opacity .35s,border-radius .62s var(--spring),visibility 0s linear .62s}
#sheet.open{transition:transform .62s var(--spring),opacity .25s,border-radius .62s var(--spring),visibility 0s}
#sheet.dragging{transition:none}
#sheet.from-fab{transform-origin:calc(100% - 47px) calc(100% - 40px)}
#sheet.from-fab:not(.open){transform:scale(.1);opacity:0;border-radius:200px}
#toast{background:var(--glass-strong);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%)}
/* macro view transitions */
.view.active{animation:none}
.view.active > *{animation:rise .8s var(--spring) both}
.view.active > *:nth-child(2){animation-delay:.05s}
.view.active > *:nth-child(3){animation-delay:.1s}
.view.active > *:nth-child(4){animation-delay:.15s}
.view.active > *:nth-child(5){animation-delay:.2s}
.view.active > *:nth-child(n+6){animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translate3d(0,32px,0) scale(.96)}}

/* ---------- content cards: solid rounded surfaces; glass stays on floating controls ---------- */
.card,.tile:not(.todo):not(.sel){background:var(--card);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none}
.card::after,.tile:not(.todo)::after{content:none}
.card{border-radius:26px}
.tile{border-radius:22px}
#sheet .card,#sheet .tbl .first{background:var(--card2)}
.alloc{padding:18px 20px}
/* entry rows: round type icon, name and detail left, amount and share right, no dividers */
.card > .row:first-child{margin-top:6px}
.card > .row:last-child{margin-bottom:6px}
.row{gap:14px;padding:12px 20px;min-height:66px}
.row + .row::before{display:none}
.avatar{width:40px;height:40px;border-radius:50%;background-image:none;box-shadow:none}
.avatar svg{width:19px;height:19px}
.row .t1{font-weight:500}
.row .t2{font-size:13px;margin-top:2px}
.row .end .t1{font-weight:500}
.upd-row{gap:12px;padding:10px 16px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
}
</style>

<body>
<div id="app">
  <div class="aura" aria-hidden="true"><i class="aura-drift"></i></div>
  <header class="nav">

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" id="eyeIcon"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>

<script>
(function(){
"use strict";
/* ---------- constants ---------- */
const CURS = {
  EUR:{sym:"€", loc:"en-IE"}, INR:{sym:"₹", loc:"en-IN"}, USD:{sym:"$", loc:"en-US"},
  GBP:{sym:"£", loc:"en-GB"}, CHF:{sym:"CHF", loc:"de-CH"}
};
const CUR_KEYS = Object.keys(CURS);
// units of each currency per 1 EUR (editable in settings)
const DEFAULT_RATES = {EUR:1, INR:110, USD:1.16, GBP:0.87, CHF:0.93};
const TYPES = [
  {k:"bank", n:"Bank", c:"#0A84FF"},
  {k:"stocks", n:"Stocks", c:"#5E5CE6"},
  {k:"etf", n:"ETFs", c:"#14B8A6"},
  {k:"mf", n:"Mutual funds", c:"#FF9F0A"},
  {k:"crypto", n:"Crypto", c:"#BF5AF2"},
  {k:"cash", n:"Cash", c:"#34C759"},
  {k:"other", n:"Other", c:"#8E8E93"}
];
const TYPE = Object.fromEntries(TYPES.map(t=>[t.k,t]));
const TYPE_ICON = {
  bank:'<path d="M3.5 9.5L12 4.5l8.5 5"/><path d="M6 10.5v6.5M10 10.5v6.5M14 10.5v6.5M18 10.5v6.5"/><path d="M4 19.5h16"/>',
  stocks:'<path d="M4 16.5l5-5 4 4 7-7"/><path d="M15 8.5h5v5"/>',
  etf:'<path d="M11 4a8 8 0 1 0 9 9h-9z"/><path d="M14 3.2A8 8 0 0 1 20.8 10H14z"/>',
  mf:'<path d="M12 4l8.5 4.5L12 13 3.5 8.5z"/><path d="M3.5 12.5L12 17l8.5-4.5"/><path d="M3.5 16.5L12 21l8.5-4.5" opacity=".6"/>',
  crypto:'<path d="M12 3l7.8 4.5v9L12 21l-7.8-4.5v-9z"/><path d="M12 8l3.5 4-3.5 4-3.5-4z"/>',
  cash:'<rect x="3" y="6.5" width="18" height="11" rx="2.5"/><circle cx="12" cy="12" r="2.6"/><path d="M6.5 9.8v.01M17.5 14.2v.01"/>',
  other:'<path d="M8 3.5l4 6.5H4z"/><rect x="13" y="13" width="7" height="7" rx="1.6"/><circle cx="7.5" cy="16.5" r="3.5"/>'
};
const avatar = t => `<span class="avatar" style="background-color:${t.c}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${TYPE_ICON[t.k] || TYPE_ICON.other}</svg></span>`;
const PLATFORMS = ["Trade Republic","Groww","Zerodha","Scalable Capital","N26","Revolut","DKB","ING","Sparkasse","Comdirect","HDFC Bank","ICICI Bank","SBI","Kuvera","Coinbase"];
const LS_KEY = "worth.v1", LS_UI = "worth.ui";

/* ---------- state ---------- */
const blank = () => ({v:1, base:"EUR", rates:{...DEFAULT_RATES}, ratesAt:null, accounts:[], snaps:{}, lastCheckin:null, updatedAt:0});
function normalize(s){
  const b = blank();
  if(!s || typeof s!=="object") return b;
  const o = Object.assign(b, s);
  o.rates = Object.assign({...DEFAULT_RATES}, s.rates||{});
  o.accounts = Array.isArray(s.accounts) ? s.accounts : [];
  o.snaps = s.snaps && typeof s.snaps==="object" ? s.snaps : {};
  if(!CURS[o.base]) o.base = "EUR";
  return o;
}
let S = blank();
try{ const raw = localStorage.getItem(LS_KEY); if(raw) S = normalize(JSON.parse(raw)); }catch(e){}
let UI = {range:12, hide:false, tab:"worth", mode:"month", month:null};
try{ Object.assign(UI, JSON.parse(localStorage.getItem(LS_UI)||"{}")); }catch(e){}
const saveUI = () => { try{ localStorage.setItem(LS_UI, JSON.stringify(UI)); }catch(e){} };
const saveLocal = () => { try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} };

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const el = (tag, attrs={}, html) => { const e = document.createElement(tag); for(const k in attrs){ if(k==="class") e.className = attrs[k]; else if(k.startsWith("on")) e[k] = attrs[k]; else e.setAttribute(k, attrs[k]); } if(html!=null) e.innerHTML = html; return e; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const monthKey = (d=new Date()) => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
const mIndex = m => { const [y,mo] = m.split("-").map(Number); return y*12 + mo - 1; };
const mDate = m => { const [y,mo] = m.split("-").map(Number); return new Date(y, mo-1, 1); };
const mLong = m => mDate(m).toLocaleDateString("en-GB",{month:"long", year:"numeric"});
const mShort = m => mDate(m).toLocaleDateString("en-GB",{month:"short", year:"numeric"});
const mOnly = m => mDate(m).toLocaleDateString("en-GB",{month:"long"});

const fmtCache = {};
function fmt(v, cur=S.base, opts={}){
  const abs = Math.abs(v);
  const dec = opts.dec != null ? opts.dec : (abs >= 1000 ? 0 : 2);
  const key = cur + dec;
  if(!fmtCache[key]){
    const o = {minimumFractionDigits:dec, maximumFractionDigits:dec};
    // a currency Worth doesn't list (e.g. from an edited backup): format it by its code instead of crashing
    try{ fmtCache[key] = new Intl.NumberFormat(CURS[cur] ? CURS[cur].loc : "en-IE", {...o, style:"currency", currency:cur}); }
    catch(e){ const nf = new Intl.NumberFormat("en-IE", o); fmtCache[key] = {format: n => nf.format(n) + " " + String(cur || "?")}; }
  }
  return fmtCache[key].format(v);
}
function parseNum(s){
  if(s==null) return NaN;
  s = String(s).replace(/[\s'’]/g,"").replace(/[^\d.,\-]/g,"");
  if(!s) return NaN;
  const hasC = s.includes(","), hasD = s.includes(".");
  if(hasC && hasD){
    if(s.lastIndexOf(",") > s.lastIndexOf(".")) s = s.replace(/\./g,"").replace(",", ".");
    else s = s.replace(/,/g,"");
  } else if(hasC){
    const parts = s.split(",");
    if(parts.length > 2 || parts[parts.length-1].length === 3) s = s.replace(/,/g,"");
    else s = s.replace(",", ".");
  } else if(hasD){
    const parts = s.split(".");
    if(parts.length > 2) s = s.replace(/\./g,"");
  }
  return parseFloat(s);
}
const plain = n => (n==null || isNaN(n)) ? "" : String(Math.round(n*100)/100);

function conv(amount, cur, rates=S.rates, base=S.base){
  const r = rates[cur] || S.rates[cur] || 1;
  const rb = rates[base] || S.rates[base] || 1;
  return amount / r * rb;
}
const liveTotal = () => S.accounts.reduce((t,a) => t + conv(+a.bal||0, a.cur), 0);
function snapTotal(s){
  let t = 0;
  for(const id in s.items){ const it = s.items[id]; t += conv(+it[0]||0, it[1], s.rates || S.rates); }
  return t;
}
function makeSnap(items){ return {items, rates:{...S.rates}}; }
function syncCurrentMonth(){
  const m = monthKey();
  if(!S.accounts.length){ delete S.snaps[m]; return; }
  const items = {};
  S.accounts.forEach(a => items[a.id] = [+a.bal||0, a.cur, a.type, a.name]);
  S.snaps[m] = makeSnap(items);
}
function commit(opts={}){
  if(!opts.keepMonth) syncCurrentMonth();
  S.updatedAt = Date.now();
  saveLocal(); render();
}
function series(){

  const t0 = performance.now();
  const step = now => {
    const p = Math.min(1, (now - t0) / dur);
    const v = from + (to - from) * easeOut(p);
    node._v = v; node.textContent = fmt(v, cur);

/* monotone cubic path */
function smoothPath(P){
  const n = P.length;
  if(n === 1) return `M${P[0][0]},${P[0][1]}`;
  const dx = [], m = [], t = [];
  for(let i=0;i<n-1;i++){ dx[i] = P[i+1][0]-P[i][0]; m[i] = (P[i+1][1]-P[i][1]) / (dx[i]||1); }
  t[0] = m[0]; t[n-1] = m[n-2];
  for(let i=1;i<n-1;i++) t[i] = m[i-1]*m[i] <= 0 ? 0 : (m[i-1]+m[i])/2;
  for(let i=0;i<n-1;i++){
    if(m[i] === 0){ t[i] = 0; t[i+1] = 0; continue; }
    const a = t[i]/m[i], b = t[i+1]/m[i], s = a*a + b*b;
    if(s > 9){ const k = 3/Math.sqrt(s); t[i] = k*a*m[i]; t[i+1] = k*b*m[i]; }
  }
  let d = `M${P[0][0]},${P[0][1]}`;
  for(let i=0;i<n-1;i++){
    const h = dx[i]/3;
    d += ` C${P[i][0]+h},${P[i][1]+t[i]*h} ${P[i+1][0]-h},${P[i+1][1]-t[i+1]*h} ${P[i+1][0]},${P[i+1][1]}`;
  }
  return d;
}

/* scrubbing */
(function(){
  const wrap = $("#chartWrap"); let active = false, lastIdx = -1, startX = 0, startY = 0, decided = false;
  function at(clientX){
    if(chartPts.length < 2) return;
    const r = wrap.getBoundingClientRect(); const x = (clientX - r.left) * ($("#chart").viewBox.baseVal.width / r.width);
    let best = 0, bd = Infinity;
    chartPts.forEach((p,i) => { const d = Math.abs(p.px - x); if(d < bd){ bd = d; best = i; } });
    if(best === lastIdx) return; lastIdx = best;
    const p = chartPts[best];
    const l = $("#sLine"), d = $("#sDot");
    l.setAttribute("x1", p.px); l.setAttribute("x2", p.px); d.setAttribute("cx", p.px); d.setAttribute("cy", p.py);
    const t = $("#total"); cancelAnimationFrame(t._raf); t._v = p.v; t.textContent = fmt(p.v); fitTotal();
    $("#heroLabel").textContent = mLong(p.m);
    if(best === 0) $("#delta").innerHTML = '<span class="when">Start of range</span>';
    else setDelta(p.v, chartPts.slice(0), "since " + mShort(chartPts[0].m));
  }
  function begin(e){
    if(chartPts.length < 2) return;
    active = true; decided = e.pointerType !== "touch"; startX = e.clientX; startY = e.clientY; lastIdx = -1;
    if(decided) start(e);
  }
  function start(e){ scrubbing = true; $("#chart").classList.add("scrubbing"); try{ wrap.setPointerCapture(e.pointerId); }catch(_){} at(e.clientX); }
  wrap.addEventListener("pointerdown", begin);
  wrap.addEventListener("pointermove", e => {
    if(!active) return;
    if(!decided){
      const dx = Math.abs(e.clientX-startX), dy = Math.abs(e.clientY-startY);
      if(dx < 6 && dy < 6) return;
      if(dy > dx){ active = false; return; }
      decided = true; start(e);
    }
    at(e.clientX);
  });
  const end = () => { if(!active) return; active = false; if(!scrubbing) return; scrubbing = false; $("#chart").classList.remove("scrubbing"); renderHero(); };
  wrap.addEventListener("pointerup", end); wrap.addEventListener("pointercancel", end); wrap.addEventListener("lostpointercapture", end);
  wrap.addEventListener("touchmove", e => { if(scrubbing) e.preventDefault(); }, {passive:false});
})();

    let chg = "";
    if(prev){
      if(a.prev && a.prev[1] === a.cur){ const d = a.b - (+a.prev[0] || 0); chg = d === 0 ? '<span class="t2">No change</span>' : `<span class="t2 ${d > 0 ? "pos" : "neg"} amt">${signed(d, a.cur, Math.abs(d) >= 100 ? 0 : 2)}</span>`; }
      else chg = '<span class="t2">New this month</span>';
    }
    const sub = (a.platform || t.n) + (a.cur !== S.base ? `, <span class="amt">≈ ${fmt(a.v, S.base, {dec:0})}</span>` : "");
    const r = el("div", {class:"row"});
    r.innerHTML = `${avatar(t)}
      <span class="mid"><div class="t1">${esc(a.name)}</div><div class="t2">${sub}</div></span>
      <span class="end"><div class="t1 num amt">${fmt(a.b, a.cur)}</div><div class="num">${chg}</div></span>`;
    card.appendChild(r);
  });

  const upd = el("button", {class:"ghost wide"}, `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 9M20 4v5h-5M20 12a8 8 0 0 1-13.7 5.6L4 15M4 20v-5h5"/></svg><span>Update ${mOnly(m)} balances</span>`);
  upd.onclick = () => updateSheet(m);
  const del = el("button", {class:"danger"}, "Remove " + mLong(m));
  armConfirm(del, "Tap again to remove", () => {
    delete S.snaps[m]; if(m === monthKey()) S.lastCheckin = null;
    const gone = mLong(m); UI.month = null; commit({keepMonth:true}); toast("Removed " + gone);
  });

  view.append(head, barEl, el("div", {class:"lbl-s"}, "Balances"), card, upd, del);
  box.appendChild(view);
  requestAnimationFrame(() => animateNum(tv, p.v, S.base, 700));
}
function renderTable(){
  const box = $("#mTable"); box.innerHTML = "";
  const months = Object.keys(S.snaps).sort().reverse();
  if(!months.length){ box.innerHTML = `<div class="card mdetail-empty">Your months appear here once you add an entry.</div>`; return; }
  const ids = []; const seen = new Set();
  [...S.accounts].sort((a,b) => conv(+b.bal||0, b.cur) - conv(+a.bal||0, a.cur)).forEach(a => { ids.push(a.id); seen.add(a.id); });
  months.forEach(m => Object.keys(S.snaps[m].items).forEach(id => { if(!seen.has(id)){ seen.add(id); ids.push(id); } }));
  const info = id => {
    const a = S.accounts.find(x => x.id === id);
    if(a) return {name:a.name, cur:a.cur};
    for(const m of months){ const it = S.snaps[m].items[id]; if(it) return {name: it[3] || "Removed entry", cur: it[1]}; }
    return {name:"Removed entry", cur:S.base};
  };
  const totals = months.map(m => snapTotal(S.snaps[m]));
  let h = `<table class="tbl"><thead><tr><th class="first"></th>${months.map(m => `<th data-m="${m}">${mShort(m)}</th>`).join("")}</tr></thead><tbody>`;
  h += `<tr class="tot"><td class="first">Net worth<small>${S.base}</small></td>${totals.map((v,i) => {
    const nxt = totals[i+1]; const cls = nxt == null ? "" : v > nxt ? "up" : v < nxt ? "dn" : "";
    return `<td class="amt ${cls}">${fmt(v, S.base, {dec:0})}</td>`; }).join("")}</tr>`;
  ids.forEach(id => {
    const inf = info(id);
    h += `<tr><td class="first">${esc(inf.name)}<small>${inf.cur}</small></td>${months.map(m => {
      const it = S.snaps[m].items[id];
      return it ? `<td class="amt">${fmt(+it[0] || 0, it[1], {dec:0})}</td>` : `<td class="na">–</td>`; }).join("")}</tr>`;
  });
  h += `</tbody></table>`;
  const card = el("div", {class:"card tbl-wrap"}, h);
  card.querySelectorAll("th[data-m]").forEach(th => th.onclick = () => { UI.month = th.dataset.m; UI.mode = "month"; saveUI(); renderMonthly(); });
  box.append(card, el("p", {class:"tbl-note"}, "Each entry in its own currency. Tap a month to see its details."));
}

/* ---------- sheet ---------- */
const sheet = $("#sheet");
let onClose = null;
function openSheet(build, opts = {}){
  if(!sheet.classList.contains("open")) sheet.classList.toggle("from-fab", !!opts.fromFab);
  sheet.innerHTML = "";
  const grab = el("div", {class:"grab"}, '<div class="handle"></div>');
  const bar = el("div", {class:"sheet-bar"});
  const body = el("div", {class:"sheet-body"});
  grab.appendChild(bar); sheet.append(grab, body);
  build({bar, body});
  const app = $("#app");
  app.style.transformOrigin = `50% ${window.scrollY + 40}px`;
  document.body.classList.add("sheet-open");
  sheet.getBoundingClientRect();
  requestAnimationFrame(() => sheet.classList.add("open"));
  enableDrag(grab);
}
function closeSheet(){
  sheet.classList.remove("open");
  document.body.classList.remove("sheet-open");
  if(document.activeElement) document.activeElement.blur();
  if(onClose){ const f = onClose; onClose = null; f(); }
}
$("#scrim").onclick = closeSheet;
document.addEventListener("keydown", e => { if(e.key === "Escape" && sheet.classList.contains("open")) closeSheet(); });
function enableDrag(area){
  let y0 = 0, dy = 0, t0 = 0, dragging = false;
  area.addEventListener("pointerdown", e => {
    if(e.target.closest("button")) return;
    dragging = true; y0 = e.clientY; dy = 0; t0 = performance.now(); sheet.classList.add("dragging");
    try{ area.setPointerCapture(e.pointerId); }catch(_){}
  });
  area.addEventListener("pointermove", e => {
    if(!dragging) return;
    dy = e.clientY - y0; const d = dy > 0 ? dy : dy / 6;
    sheet.style.transform = `translateY(${d}px)`;
  });
  const up = () => {
    if(!dragging) return; dragging = false; sheet.classList.remove("dragging"); sheet.style.transform = "";
    const v = dy / Math.max(1, performance.now() - t0);
    if(dy > 120 || v > 0.6) closeSheet();
  };
  area.addEventListener("pointerup", up); area.addEventListener("pointercancel", up);
}
function sheetBar(bar, title, left, right){
  bar.innerHTML = "";
  const l = el("button", {class:"l gtext"}, left || "Cancel"); l.onclick = closeSheet;
  const t = el("div", {class:"ttl"}, esc(title));
  const r = el("button", {class:"r gtext"}, right ? esc(right.label) : "");
  if(right){ r.onclick = right.onClick; } else r.style.visibility = "hidden";
  bar.append(l, t, r);
  return r;
}
function armConfirm(btn, label, action){
  btn.onclick = () => {
    if(btn.classList.contains("armed")){ action(); return; }
    const orig = btn.textContent; btn.classList.add("armed"); btn.textContent = label;
    setTimeout(() => { btn.classList.remove("armed"); btn.textContent = orig; }, 3000);
  };
}

/* toast */
let toastT;
function toast(msg){
  const t = $("#toast"); t.querySelector("span").textContent = msg;
  t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 1900);
}

/* ---------- account sheet ---------- */
function accountSheet(acc, sheetOpts){
  const editing = !!acc;
  const draft = acc ? {...acc} : {id:uid(), name:"", type:"bank", platform:"", cur:S.base, bal:""};
  openSheet(({bar, body}) => {
    const save = sheetBar(bar, editing ? "Edit entry" : "New entry", "Cancel", {label: editing ? "Done" : "Add", onClick: () => {
      const bal = parseNum(balIn.value);
      draft.name = nameIn.value.trim(); draft.platform = platIn.value.trim();
      draft.bal = isNaN(bal) ? 0 : bal;
      if(!draft.name) return;
      if(editing){ const i = S.accounts.findIndex(a => a.id === draft.id); S.accounts[i] = draft; }
      else { S.accounts.push(draft); justAdded = draft.id; }
      closeSheet(); commit();
      toast(editing ? "Saved" : "Entry added");
    }});
    const validate = () => { save.disabled = !nameIn.value.trim(); };

    // name + amount
    const top = el("div", {class:"card entry-top"});
    const nameIn = el("input", {class:"name-in", placeholder:"Name, e.g. Savings", autocomplete:"off", "aria-label":"Name"});
    nameIn.value = draft.name; nameIn.oninput = validate;
    const amt = el("label", {class:"big-amt"});
    const sym = el("span", {class:"sym"});
    const digits = el("span", {class:"digits"});
    const caret = el("span", {class:"caret"});
    const disp = el("span", {class:"disp num"}); disp.append(sym, digits, caret);
    const balIn = el("input", {inputmode:"decimal", "aria-label":"Balance", autocomplete:"off", enterkeyhint:"done"});
    balIn.value = plain(draft.bal === "" ? null : +draft.bal);
    const paintBal = () => { const v = balIn.value; digits.textContent = v || "0"; digits.classList.toggle("ph", !v); };
    balIn.addEventListener("input", () => { paintBal(); digits.classList.remove("tick"); void digits.offsetWidth; digits.classList.add("tick"); });
    balIn.addEventListener("focus", () => amt.classList.add("focus"));
    balIn.addEventListener("blur", () => amt.classList.remove("focus"));
    paintBal();
    amt.append(disp, balIn);
    top.append(nameIn, amt);

    // compact picker rows
    const rows = el("div", {class:"card"});
    const pick = (label, options, value, onChange, decorate) => {
      const f = el("label", {class:"field pick"});
      const lab = el("span", {class:"pl"}, label);
      const val = el("span", {class:"pv"});
      const sel = el("select", {"aria-label":label});
      sel.innerHTML = options.map(o => `<option value="${esc(o.v)}">${esc(o.n)}</option>`).join("");
      sel.value = value;
      const paint = () => { const o = options.find(x => x.v === sel.value); val.innerHTML = (decorate ? decorate(o) : "") + esc(o ? o.n : ""); };
      sel.onchange = () => { onChange(sel.value); paint(); val.classList.remove("bump"); void val.offsetWidth; val.classList.add("bump"); };
      paint();
      f.append(lab, val, el("span", {class:"chev"}, "›"), sel);
      return f;
    };
    const typeRow = pick("Type", TYPES.map(t => ({v:t.k, n:t.n})), draft.type, v => draft.type = v,
      o => `<span class="dot" style="background:${TYPE[o.v].c}"></span>`);
    const curSym = c => CURS[c] ? CURS[c].sym : String(c || "");
    const setSym = () => { sym.textContent = curSym(draft.cur); };
    const curOpts = CUR_KEYS.map(c => ({v:c, n:c + " " + CURS[c].sym}));
    if(draft.cur && !CURS[draft.cur]) curOpts.push({v:draft.cur, n:String(draft.cur)}); // keep an unlisted currency selectable
    const curRow = pick("Currency", curOpts, draft.cur, v => { draft.cur = v; setSym(); });
    setSym();
    const platF = el("div", {class:"field"}, "<label>Platform</label>");
    const platIn = el("input", {placeholder:"Optional", autocomplete:"off", list:"platforms"}); platIn.value = draft.platform || "";
    const dl = el("datalist", {id:"platforms"}, PLATFORMS.map(p => `<option value="${esc(p)}">`).join(""));
    platF.append(platIn, dl);
    rows.append(typeRow, curRow, platF);

    body.append(top, rows);
    if(editing){
      const del = el("button", {class:"danger"}, "Delete entry");
      armConfirm(del, "Tap again to delete", () => {
        S.accounts = S.accounts.filter(a => a.id !== draft.id);
        closeSheet(); commit(); toast("Entry deleted");
      });
      body.appendChild(del);
      body.appendChild(el("p", {class:"note"}, "Past months keep this entry’s balance in your history."));
    }
    validate();
    if(!editing) setTimeout(() => nameIn.focus({preventScroll:true}), 550);
  }, sheetOpts);
}

/* ---------- monthly update sheet ---------- */
function updateSheet(start){
  const cur = monthKey();
  let month = start && start <= cur ? start : cur;
  openSheet(({bar, body}) => {
    let saveBtn;
    const inputs = {};
    const card = el("div", {class:"card"});
    const totalV = el("span", {class:"v num amt"});
    const saveLabel = () => "Save " + mLong(month);
    const recompute = () => {
      let t = 0;
      S.accounts.forEach(a => { const v = parseNum(inputs[a.id].value); if(!isNaN(v)) t += conv(v, a.cur); });
      animateNum(totalV, t, S.base, 400);
    };
    const fill = () => {
      const snap = month !== cur ? S.snaps[month] : null;
      S.accounts.forEach(a => {
        let v = a.bal;
        if(month !== cur) v = snap && snap.items[a.id] ? snap.items[a.id][0] : "";
        inputs[a.id].value = v === "" ? "" : plain(+v);
      });
      saveBtn.textContent = saveLabel(); recompute();
    };
    const doSave = () => {
      if(month === cur){
        S.accounts.forEach(a => { const v = parseNum(inputs[a.id].value); a.bal = isNaN(v) ? 0 : v; });
        S.lastCheckin = cur;
        closeSheet(); commit();
      } else {
        const items = {}, old = S.snaps[month];
        if(old) for(const id in old.items) if(!S.accounts.some(a => a.id === id)) items[id] = old.items[id];
        S.accounts.forEach(a => { const v = parseNum(inputs[a.id].value); if(!isNaN(v)) items[a.id] = [v, a.cur, a.type, a.name]; });
        if(Object.keys(items).length) S.snaps[month] = makeSnap(items); else delete S.snaps[month];
        closeSheet(); commit({keepMonth:true});
      }
      toast("Saved " + mLong(month));
    };
    sheetBar(bar, "Update balances", "Cancel", {label:"Save", onClick: doSave});

    const mCard = el("div", {class:"card"});
    const mf = el("div", {class:"field"}, "<label>Month</label>");
    const mIn = el("input", {type:"month", class:"month-in", max:cur}); mIn.value = month;
    mIn.onchange = () => { if(!mIn.value || mIn.value > cur){ mIn.value = cur; } month = mIn.value; fill(); };
    mf.appendChild(mIn); mCard.appendChild(mf);

    S.accounts.forEach(a => {
      const t = TYPE[a.type] || TYPE.other;
      const r = el("div", {class:"row upd-row"});
      r.innerHTML = `${avatar(t)}
        <span class="mid"><div class="t1">${esc(a.name)}</div><div class="t2">${esc(a.platform || t.n)}</div></span>`;
      const end = el("span", {class:"end"});
      const inp = el("input", {inputmode:"decimal", placeholder:"0", "aria-label":a.name + " balance", autocomplete:"off"});
      inp.oninput = recompute;
      inp.onfocus = () => setTimeout(() => inp.select(), 0);
      inputs[a.id] = inp;
      end.append(inp, el("div", {class:"c"}, a.cur));
      r.appendChild(end); card.appendChild(r);
    });
    const tot = el("div", {class:"upd-total"}, "<span>Total</span>"); tot.appendChild(totalV);
    saveBtn = el("button", {class:"primary"}, saveLabel()); saveBtn.onclick = doSave;
    body.append(mCard, el("p", {class:"note"}, "Pick an earlier month to fill in your history. Leave a field empty to skip that entry."), el("div", {class:"lbl-s"}, "Balances"), card, tot, saveBtn);
    fill();
  });
}

/* ---------- settings sheet ---------- */
function settingsSheet(){
  openSheet(({bar, body}) => {
    sheetBar(bar, "Settings", "Close");
    // base currency
    const seg = el("div", {class:"seg"}); seg.innerHTML = '<span class="thumb"></span>' + CUR_KEYS.map(c => `<button data-c="${c}">${c}</button>`).join("");
    const ratesCard = el("div", {class:"card"});
    const paintSeg = () => {
      const btns = [...seg.querySelectorAll("button")], i = btns.findIndex(b => b.dataset.c === S.base);
      btns.forEach((b,j) => b.setAttribute("aria-pressed", j===i));
      const th = seg.querySelector(".thumb"); th.style.width = `calc((100% - 4px) / ${btns.length})`; th.style.transform = `translateX(${i*100}%)`;
    };
    const paintRates = () => {
      ratesCard.innerHTML = "";
      CUR_KEYS.filter(c => c !== S.base).forEach(c => {
        const f = el("div", {class:"field"}, `<label>1 ${S.base} =</label>`);
        const inp = el("input", {inputmode:"decimal", autocomplete:"off", "aria-label":`${c} per ${S.base}`});
        inp.value = +(S.rates[c] / S.rates[S.base]).toPrecision(6);
        inp.onchange = () => {
          const v = parseNum(inp.value);
          if(!(v > 0)){ inp.value = +(S.rates[c] / S.rates[S.base]).toPrecision(6); return; }
          S.rates[c] = v * S.rates[S.base]; S.ratesAt = Date.now();
          commit(); ratesNote.textContent = rateNoteText();
        };
        f.append(inp, el("span", {class:"cur"}, c));
        ratesCard.appendChild(f);
      });
    };
    seg.querySelectorAll("button").forEach(b => b.onclick = () => {
      S.base = b.dataset.c; paintSeg(); paintRates(); commit({keepMonth:true}); paintHist();
    });
    const rateNoteText = () => S.ratesAt
      ? "Rates last changed " + new Date(S.ratesAt).toLocaleDateString("en-GB",{day:"numeric", month:"long", year:"numeric"}) + ". Each month’s point keeps the rates it was saved with."
      : "These are approximate mid-2026 rates. Adjust them at each check-in; each month’s point keeps the rates it was saved with.";
    const ratesNote = el("p", {class:"note"}, rateNoteText());

    const paintHist = () => {}; /* history lives on the main screen */
    const _unused = () => {
      hist.innerHTML = "";
      const all = series().reverse();
      if(!all.length){ hist.innerHTML = '<div class="empty-list">No months saved yet.</div>'; return; }
      all.forEach(p => {
        const r = el("div", {class:"row hist-row", style:"min-height:50px"});
        r.innerHTML = `<span class="mid"><div class="t1">${mLong(p.m)}</div></span><span class="end"><div class="t1 num amt" style="font-weight:500">${fmt(p.v, S.base, {dec:0})}</div></span>`;
        const d = el("button", {class:"del"}, "Remove");
        armConfirm(d, "Confirm", () => {
          delete S.snaps[p.m];
          if(p.m === monthKey()) S.lastCheckin = null;
          commit({keepMonth:true}); paintHist();
        });
        r.appendChild(d); hist.appendChild(r);
      });
    };

    // backup
    const bk = el("div", {class:"card"});
    const copyB = el("button", {class:"plain-btn"}, '<span class="gtext">Copy backup</span>');
    const restB = el("button", {class:"plain-btn"}, '<span class="gtext">Restore from backup</span>');
    bk.append(copyB, restB);
    const area = el("textarea", {class:"backup", placeholder:"Paste a backup here", style:"display:none"});
    const restoreGo = el("button", {class:"primary", style:"display:none"}, "Restore");
    copyB.onclick = async () => {
      const txt = JSON.stringify(S);
      try{ await navigator.clipboard.writeText(txt); toast("Backup copied"); }
      catch(e){ area.style.display = ""; area.value = txt; area.select(); restoreGo.style.display = "none"; }
    };
    restB.onclick = () => { area.style.display = ""; area.value = ""; restoreGo.style.display = ""; area.focus(); };
    restoreGo.onclick = () => {
      try{ const raw = JSON.parse(area.value); if(!raw || typeof raw!=="object" || Array.isArray(raw) || !Array.isArray(raw.accounts)) throw 0; const d = normalize(raw); S = d; commit({keepMonth:true}); closeSheet(); toast("Backup restored"); }
      catch(e){ area.style.boxShadow = "0 0 0 2px var(--down)"; setTimeout(() => area.style.boxShadow = "", 1200); }
    };

    const erase = el("button", {class:"danger"}, "Erase all data");
    armConfirm(erase, "Tap again to erase everything", () => {
      const keep = S.base; S = blank(); S.base = keep; commit({keepMonth:true}); closeSheet(); toast("All data erased");
    });

    body.append(
      el("div", {class:"lbl-s"}, "Show totals in"), seg,
      el("div", {class:"lbl-s"}, "Exchange rates"), ratesCard, ratesNote,
      el("div", {class:"lbl-s"}, "Backup"), bk, area, restoreGo,
      erase
    );
    paintSeg(); paintRates(); paintHist();
  });
}

document.querySelectorAll(".tab").forEach(t => t.onclick = () => setTab(t.dataset.tab));

$("#btnSettings").onclick = settingsSheet;

$("#total").onclick = () => { UI.hide = !UI.hide; saveUI(); render(false); };
$("#range").querySelectorAll("button").forEach(b => b.onclick = () => {
  UI.range = +b.dataset.r; saveUI(); renderRange(); drawChart(true); renderHero();

new IntersectionObserver(([e]) => document.body.classList.toggle("scrolled", !e.isIntersecting), {rootMargin:"-44px 0px 0px 0px"}).observe($("#largeTitle"));

render(true);
rw = $("#chartWrap").clientWidth;
