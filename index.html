      // only one field looks active at a time: while the name is being edited the amount hides its caret
      name.addEventListener("focus", () => box.classList.add("idle")); name.addEventListener("blur", () => box.classList.remove("idle"));
      const more = el("button", {class:"onb-text"}, `${ic("add")}<span>Add another</span>`);
      more.onclick = () => { const same = st.rows.filter(x => x.t === r.t).length;
        st.rows.splice(st.i + 1, 0, {t:r.t, name:`${KINDS.find(k => k.t === r.t).n} ${same + 1}`, cur:r.cur, bal:""}); r.bal = inp.value; st.i++; go(4); };
      pg.append(el("div", {class:"onb-amtwrap"}, ""), pad, foot(next, more));
      pg.querySelector(".onb-amtwrap").append(box, pill);
      pg.classList.add("bal");
      show(); requestAnimationFrame(fit);
    },
    done(pg){
      pg.classList.add("center", "intro");
      const art = onbArt(), mid = el("div", {class:"onb-mid"});
      pg.append(art);
      mid.append(el("h1", {class:"onb-h onb-a"}, "You’re good to go!"), el("div", {class:"onb-total num amt onb-a"}, fmt(liveTotal(), S.base, {dec:0})), el("p", {class:"onb-sub onb-a"}, "Your net worth today"));
      pg.append(mid); pg.dataset.delay = 1000;
      requestAnimationFrame(() => playArt(art, 100));
      const past = el("button", {class:"onb-text"}, "Add past months");
      past.onclick = () => { closeOnboarding(); setTimeout(() => updateSheet(mShift(1)), 450); };
      pg.append(foot(cta("Continue", () => closeOnboarding()), past));
    }
  };
  const finish = () => {
    st.rows.forEach(r => { const v = parseNum(r.bal); if(isNaN(v)) return;
      S.accounts.push({id:uid(), name:(r.name || "").trim() || KINDS.find(k => k.t === r.t).n, type:r.t, platform:"", cur:r.cur, bal:Math.abs(v)}); });
    S.base = st.cur; S.lastCheckin = monthKey();
    commit(); go(5);
  };
  // page transitions: the new page slides in from the side you're going to, its parts one after another
  const go = (n, dir, mode) => {
    dir = dir || (n >= step ? 1 : -1);
    const prev = page; step = n;
    page = el("div", {class:"onb-pg"}); build[STEPS[n]](page);
    if(mode === "zoom" && prev) stage.insertBefore(page, prev); else stage.appendChild(page);
    back.style.visibility = n === 0 || n === 5 ? "hidden" : "";
    if(mode === "zoom" && !still) top.animate([{opacity:0}, {opacity:1}], {duration:500, delay:200, easing:"ease", fill:"backwards"});
    skip.style.visibility = STEPS[n] === "owe" ? "" : "hidden";
    if(!dots.childElementCount) dots.innerHTML = "<i></i><i></i><i></i><i></i>";
    dots.classList.toggle("off", !(n >= 1 && n <= 4));
    [...dots.children].forEach((d, k) => { d.classList.toggle("on", k + 1 === n); d.classList.toggle("done", k + 1 < n); });
    if(prev){
      if(still) prev.remove();
      else if(mode === "zoom") prev.animate([{opacity:1}, {opacity:0}], {duration:400, easing:"cubic-bezier(.3,0,.2,1)", fill:"forwards"}).onfinish = () => prev.remove();
      else prev.animate([{opacity:1, transform:"none"}, {opacity:0, transform:`translateX(${-36 * dir}px)`}], {duration:260, easing:"cubic-bezier(.4,0,1,1)", fill:"forwards"}).onfinish = () => prev.remove();
    }
    if(!still) page.querySelectorAll(".onb-a").forEach((x, k) => x.animate([{opacity:0, transform:`translateX(${44 * dir}px)`}, {opacity:1, transform:"none"}],
      {duration:+x.dataset.dur || 560, delay:x.dataset.delay ? +x.dataset.delay : (+page.dataset.delay || 140) + k * 70, easing:"cubic-bezier(.2,.8,.2,1)", fill:"backwards"}));
  };
  back.onclick = () => {
    if(STEPS[step] === "bal" && st.i > 0){ st.i--; go(4, -1); }
    else go(Math.max(0, step - 1), -1);
  };
  skip.onclick = () => { st.owe = []; buildRows(); st.i = 0; go(4); };
  const vv = window.visualViewport;
  // The home-screen app on iOS lays the page out in a box shorter than the screen (e.g. 812 of 874pt) yet paints from the
  // top, so a layer pinned to bottom:0 stops short and leaves a black band. There, size the layer to the whole screen.
  const standalone = navigator.standalone || matchMedia("(display-mode: standalone)").matches;
  const fullH = () => standalone && screen.height > window.innerHeight ? screen.height : 0;
  // give the (otherwise empty) page a full screen of height, so iOS lays it out at full height too
  if(standalone) document.body.style.minHeight = screen.height + "px";
  // The layer gets a fixed pixel height, measured once (the whole screen in the home-screen app). iOS briefly shrinks the
  // page and pans the view for a frame while the keyboard comes up; a fixed height and an exact counter-shift keep the
  // layer perfectly still through that.
  let baseH = fullH() || window.innerHeight;
  root.style.bottom = "auto"; root.style.height = baseH + "px";
  const onResize = () => { if(!root.classList.contains("kb") && !(vv && vv.height < baseH - 120)){ baseH = fullH() || window.innerHeight; root.style.height = baseH + "px"; } };
  window.addEventListener("resize", onResize, sig);
  // Keyboard: go into keyboard mode the moment a field is focused (before iOS reports anything), using the last known
  // keyboard height, so the layout rises together with the keyboard; the real height then fine-tunes it. On blur it
  // drops right away, again in step with the keyboard going down.
  let kbH = +(sessionStorage.getItem("worth.kbH") || 0) || Math.round(screen.height * .39);
  const setKb = on => { root.style.setProperty("--kb", kbH + "px"); root.classList.toggle("kb", on); };
  const fitVV = () => { if(!onbOpen || !vv) return;
    root.style.transform = vv.offsetTop ? `translate3d(0,${vv.offsetTop}px,0)` : "";
    const h = Math.round(baseH - vv.height - vv.offsetTop);
    if(h > 120){ kbH = h; try{ sessionStorage.setItem("worth.kbH", h); }catch(e){} setKb(true); }
    else if(!root.contains(document.activeElement) || document.activeElement.tagName !== "INPUT") setKb(false);
  };
  // only a focus that comes from your tap opens a keyboard (iOS ignores programmatic focus), so only that enters keyboard mode
  let lastTap = 0; root.addEventListener("pointerdown", () => { lastTap = Date.now(); }, {capture:true, signal:ac.signal});
  root.addEventListener("focusin", e => { if(e.target.tagName === "INPUT" && e.target.type !== "file" && Date.now() - lastTap < 900 && matchMedia("(pointer: coarse)").matches) setKb(true); }, sig);
  root.addEventListener("focusout", () => setTimeout(() => { const a = document.activeElement; if(!(a && root.contains(a) && a.tagName === "INPUT")) setKb(false); }, 60), sig);
  if(vv){ vv.addEventListener("resize", fitVV, sig); vv.addEventListener("scroll", fitVV, sig); }
  go(0);
  if(!still) root.animate([{opacity:0}, {opacity:1}], {duration:400, easing:"ease"});
}
function closeOnboarding(){
  const root = $("#onb");
  const end = () => { if(root._ac){ root._ac.abort(); root._ac = null; } root.getAnimations().forEach(a => a.cancel()); // the held fade-out would hide the next opening
    root.style.height = root.style.transform = root.style.bottom = ""; root.style.removeProperty("--kb"); document.body.style.minHeight = ""; root.classList.remove("kb"); root.hidden = true; root.innerHTML = ""; onbOpen = false; document.documentElement.classList.remove("onb-open"); document.body.classList.remove("onb-open"); render(true); };
  if(matchMedia("(prefers-reduced-motion: reduce)").matches || !root.animate) return end();
  root.animate([{opacity:1, transform:"none"}, {opacity:0, transform:"scale(1.04)"}], {duration:380, easing:"cubic-bezier(.4,0,.2,1)", fill:"forwards"}).onfinish = end;
}

/* ---------- settings tab ---------- */
const agoText = t => {
  const min = Math.round((Date.now() - t) / 60000);
  if(min < 1) return "just now";
  if(min < 60) return min + " min ago";
  const h = Math.round(min / 60);
  if(h < 24) return h + (h === 1 ? " hour ago" : " hours ago");
  return new Date(t).toLocaleDateString("en-GB", {day:"numeric", month:"long"});
};
function paintRatesInfo(){
  const card = $("#ratesCard"), note = $("#ratesNote");
  if(!card) return;
  card.innerHTML = CUR_KEYS.filter(c => c !== S.base).map(c =>
    `<div class="rate-row"><span>1 ${S.base}</span><span class="num">${(+(S.rates[c] / S.rates[S.base]).toPrecision(6)).toLocaleString("en-GB", {maximumFractionDigits:4})} ${c}</span></div>`).join("");
  note.innerHTML = S.ratesSrc
    ? `Live from ${S.ratesSrc === "er-api" ? "ExchangeRate-API" : "Coinbase"} · ${agoText(S.ratesAt)}`
    : "Approximate until the first live update";
}
function renderSettings(){
  const v = $("#vSettings"); v.innerHTML = "";
  // base currency
  const seg = el("div", {class:"seg"}); seg.innerHTML = '<span class="thumb"></span>' + CUR_KEYS.map(c => `<button data-c="${c}">${c}</button>`).join("");
  seg.querySelectorAll("button").forEach(b => b.onclick = () => {
    S.base = b.dataset.c; paintSeg(seg, CUR_KEYS.indexOf(S.base)); commit({keepMonth:true}); paintRatesInfo();
  });

  // privacy: hiding amounts (also by tapping the total)
  const pv = el("div", {class:"card"});
  const sw = el("button", {class:"sw-row", role:"switch", "aria-checked":String(!!UI.hide)}, `<span>Hide amounts</span><i class="sw"></i>`);
  sw.onclick = () => { UI.hide = !UI.hide; saveUI(); sw.setAttribute("aria-checked", String(UI.hide)); render(false); };
  pv.appendChild(sw);

  // backup: a file you keep in Files or iCloud Drive (data otherwise lives only on this phone); text copy as a fallback
  const bk = el("div", {class:"card"});
  const saveF = el("button", {class:"plain-btn"}, '<span class="gtext">Save to Files</span>');
  const loadF = el("button", {class:"plain-btn"}, '<span class="gtext">Restore from file</span>');
  const copyB = el("button", {class:"plain-btn"}, '<span class="gtext">Copy as text</span>');
  const restB = el("button", {class:"plain-btn"}, '<span class="gtext">Paste backup</span>');
  bk.append(saveF, loadF, copyB, restB);
  const file = el("input", {type:"file", accept:".json,application/json", style:"display:none"});
  const area = el("textarea", {class:"backup", placeholder:"Paste a backup here", style:"display:none"});
  const restoreGo = el("button", {class:"primary", style:"display:none"}, "Restore");
  const bkNote = el("p", {class:"note"});
  const paintBk = () => { bkNote.textContent = "Only on this phone · " + (S.backupAt ? "last backup " + agoText(S.backupAt) : "no backup yet"); };
  const restore = txt => { restoreBackup(txt); setTab("worth"); toast("Backup restored"); };
  const done = () => { S.backupAt = Date.now(); saveLocal(); paintBk(); };
  saveF.onclick = async () => {
    const name = `worth-backup-${new Date().toISOString().slice(0,10)}.json`, txt = JSON.stringify(S, null, 1);
    const f = new File([txt], name, {type:"application/json"});
    // iPhone: the share sheet offers "Save to Files"; elsewhere a download
    if(navigator.canShare && navigator.canShare({files:[f]})){
      try{ await navigator.share({files:[f], title:"Worth backup"}); done(); toast("Backup saved"); return; }
      catch(e){ if(e && e.name === "AbortError") return; } // cancelled by you; any other failure falls back to a download
    }
    const a = el("a", {href:URL.createObjectURL(f), download:name}); document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000); done(); toast("Backup saved");
  };
  loadF.onclick = () => file.click();
  file.onchange = async () => { const f = file.files && file.files[0]; file.value = ""; if(!f) return;
    try{ restore(await f.text()); } catch(e){ toast("That file isn’t a Worth backup"); } };
  copyB.onclick = async () => {
    const txt = JSON.stringify(S);
    try{ await navigator.clipboard.writeText(txt); done(); toast("Backup copied"); }
    catch(e){ area.style.display = ""; area.value = txt; area.select(); restoreGo.style.display = "none"; }
  };
  restB.onclick = () => { area.style.display = ""; area.value = ""; restoreGo.style.display = ""; area.focus(); };
  restoreGo.onclick = () => {
    try{ restore(area.value); }
    catch(e){ area.style.boxShadow = "0 0 0 2px var(--down)"; setTimeout(() => area.style.boxShadow = "", 1200); }
  };
  paintBk();

  const erase = el("button", {class:"danger"}, "Erase all data");
  armConfirm(erase, "Tap again to erase everything", () => {
    const keep = S.base; S = blank(); S.base = keep; commit({keepMonth:true}); fetchRates(true); setTab("worth"); toast("All data erased");
  });

  v.append(
    el("div", {class:"lbl-s"}, "Show totals in"), seg,
    el("div", {class:"lbl-s"}, "Exchange rates"), el("div", {class:"card", id:"ratesCard"}), el("p", {class:"note", id:"ratesNote"}),
    el("div", {class:"lbl-s"}, "Privacy"), pv, el("p", {class:"note"}, "Or tap your net worth."),
    el("div", {class:"lbl-s"}, "Backup"), bk, bkNote, file, area, restoreGo,
    erase
  );

  paintSeg(seg, Math.max(0, CUR_KEYS.indexOf(S.base)));
  paintRatesInfo();
}

/* ---------- live exchange rates ---------- */
// Public, keyless and browser-friendly. Coinbase updates about every minute; ExchangeRate-API (open access) once a day as a fallback.
const RATES_TTL = 30 * 60 * 1000;
let ratesBusy = false;
async function fetchRates(force){
  if(ratesBusy || (!force && S.ratesAt && S.ratesSrc && Date.now() - S.ratesAt < RATES_TTL)) return;
  if(navigator.onLine === false) return;
  ratesBusy = true;
  const get = async url => { const r = await fetch(url, {cache:"no-store"}); if(!r.ok) throw new Error(r.status); return r.json(); };
  let raw = null, src = null;
  try{ raw = (await get("https://api.coinbase.com/v2/exchange-rates?currency=EUR")).data.rates; src = "coinbase"; }
  catch(e){
    try{ const j = await get("https://open.er-api.com/v6/latest/EUR"); if(j.result !== "success") throw 0; raw = j.rates; src = "er-api"; }
    catch(e2){ ratesBusy = false; return; } // offline or both down: keep the last rates
  }
  ratesBusy = false;
  const next = {EUR:1};
  for(const c of CUR_KEYS){ if(c === "EUR") continue; const v = parseFloat(raw && raw[c]); if(!(v > 0)) return; next[c] = v; }
  S.rates = Object.assign({}, S.rates, next); S.ratesAt = Date.now(); S.ratesSrc = src;
  // only the current month takes the new rates; earlier months keep theirs
  if(S.accounts.length) syncCurrentMonth();
  saveLocal();
  // quiet refresh, no re-animation
  if(!scrubbing && !sheet.classList.contains("open")){
    renderHero(); renderBreakdown(); renderAlloc(); renderList();
    if(UI.tab === "worth") drawChart(false);
    if(UI.tab === "monthly") renderMonthly();
  }
  paintRatesInfo();
}

/* ---------- wiring ---------- */
$("#fab").onclick = () => isEmpty() ? openOnboarding() : accountSheet(null, {fromFab:true});
document.querySelectorAll(".tab").forEach(t => t.onclick = () => setTab(t.dataset.tab));
$("#total").onclick = () => { UI.hide = !UI.hide; saveUI(); render(false); };
$("#allocMode").querySelectorAll("button").forEach(b => b.onclick = () => { UI.alloc = b.dataset.m; saveUI(); renderAlloc(); });
$("#range").querySelectorAll("button").forEach(b => b.onclick = () => {
  UI.range = +b.dataset.r; saveUI(); renderRange(); drawChart(true); renderHero();
});
// monthly: arrows, and swipe left/right anywhere on the view
$("#mPrev").onclick = () => stepMonth(-1);
$("#mNext").onclick = () => stepMonth(1);
(function(){
  let x0 = null, y0 = 0;
  const v = $("#vMonthly");
  v.addEventListener("touchstart", e => { if(e.touches.length !== 1){ x0 = null; return; } x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive:true});
  v.addEventListener("touchend", e => {
    if(x0 == null) return;
    const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0; x0 = null;
    if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) stepMonth(dx < 0 ? 1 : -1);
  }, {passive:true});
})();
// a blurred strip behind the status bar once content scrolls under it
addEventListener("scroll", () => document.body.classList.toggle("scrolled", scrollY > 8), {passive:true});
let rw = 0; addEventListener("resize", () => { if(UI.tab !== "worth") return; const w = $("#chartWrap").clientWidth; if(w !== rw){ rw = w; drawChart(false); renderBubbles(); } });
document.addEventListener("visibilitychange", () => { if(!document.hidden){ render(false); fetchRates(); } });

// static icons in the markup: <i data-mi="name"> becomes the svg, other elements get it as content
document.querySelectorAll("[data-mi]").forEach(n => {
  if(n.tagName === "I") n.outerHTML = ic(n.dataset.mi); else n.innerHTML = ic(n.dataset.mi);
});

// Development build only: when there is no data (first launch, or after Erase all data), seed a year of sample data.
// The generator lives in /dev/sample-data.js, which is removed from production builds (see vercel.json).
// add ?fresh to the address to skip it and see the first-run welcome
if(window.WORTH_DEV && !/[?&]fresh\b/.test(location.search) && !S.accounts.length && !Object.keys(S.snaps).length){
  try{ const {makeSample} = await import("/dev/sample-data.js"); S = normalize(makeSample()); saveLocal(); }catch(e){}
}
render(true);
if(UI.tab === "settings") renderSettings();
(function(){
  const sp = $("#splash"), still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  setTimeout(() => {
    if(isEmpty()) openOnboarding();
    sp.classList.add("out"); setTimeout(() => sp.remove(), 650);
  }, still ? 250 : 1500);
})();
rw = $("#chartWrap").clientWidth;
// live exchange rates: on start when older than 30 minutes, then checked every 5 minutes (fetches only when stale)
fetchRates();
setInterval(() => { if(!document.hidden) fetchRates(); }, 5 * 60 * 1000);

/* ---------- offline ---------- */
if("serviceWorker" in navigator) addEventListener("load", () => { navigator.serviceWorker.register("/sw.js").catch(() => {}); });
})();
</script>
