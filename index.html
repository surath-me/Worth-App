<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-visual">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Worth">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>Worth</title>
<script>
/* Development build: on the dev domain (and localhost) use the orange icons and the "Worth Dev" name,
   so the two home screen apps are easy to tell apart. Production keeps the defaults above. */
(function () {
  var DEV_HOSTS = ["worth-app-dev.vercel.app", "localhost", "127.0.0.1"];
  if (DEV_HOSTS.indexOf(location.hostname) < 0) return;
  window.WORTH_DEV = true; /* seeds sample data when the app is empty */
  var set = function (sel, attr, val) { var el = document.querySelector(sel); if (el) el.setAttribute(attr, val); };
  set('meta[name="apple-mobile-web-app-title"]', "content", "Worth Dev");
  set('link[rel="apple-touch-icon"]', "href", "/dev/apple-touch-icon.png");
  set('link[rel="icon"]', "href", "/dev/icon-192.png");
  set('link[rel="manifest"]', "href", "/dev/manifest.webmanifest");
  document.title = "Worth Dev";
})();
</script>
<style>
:root{
  /* Dark mode only for now. The light palette is kept below under [data-theme="light"] (nothing sets it yet). */
  --bg:#000000; --card:#1C1C1E; --text:#FFFFFF; --sec:#98989F; --ter:#5C5C61;
  --sep:rgba(84,84,88,.55); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.34);
  --accent:#3CD9CF; --g1:#0EA67A; --g2:#2466E0; --g1a:rgba(54,245,178,.45); --g2a:rgba(58,164,255,.45); --up:#36F5B2; --down:#FF6961; --nav:rgba(0,0,0,.72);
  --scrim:rgba(0,0,0,.5); --behind:#000;
  --spring:cubic-bezier(.32,.72,0,1); --ease:cubic-bezier(.65,0,.35,1);
  color-scheme:dark;
  --grad:linear-gradient(115deg,var(--g1) 0%,#0B82A6 50%,var(--g2) 100%);
  --glow:0 10px 26px -10px var(--g1a),0 8px 28px -10px var(--g2a);
  --glass:rgba(44,44,48,.5); --glass-strong:rgba(58,58,62,.6); --lens:rgba(255,255,255,.14);
  --rim:rgba(255,255,255,.4); --rim2:rgba(255,255,255,.07); --sheet-glass:rgba(24,24,26,.78);
  --gshadow:0 14px 36px -14px rgba(0,0,0,.8);
  --card2:#2C2C2E;
  --bounce:cubic-bezier(.34,1.56,.64,1);
  --tabind:rgba(0,0,0,.5); --tabbg:rgba(60,60,64,.8);
}
:root[data-theme="light"]{
  --bg:#F2F2F7; --card:#FFFFFF; --text:#000000; --sec:#6C6C70; --ter:#AEAEB2;
  --sep:rgba(60,60,67,.16); --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.2);
  --accent:#0BA6A0; --g1:#0A9C73; --g2:#1F5ED6; --g1a:rgba(15,203,140,.5); --g2a:rgba(42,134,255,.45); --up:#0FB57A; --down:#E5484D; --nav:rgba(242,242,247,.78);
  --scrim:rgba(0,0,0,.28);
  --glass:rgba(255,255,255,.58); --glass-strong:rgba(255,255,255,.7); --lens:rgba(255,255,255,.85);
  --rim:rgba(255,255,255,.95); --rim2:rgba(255,255,255,.28); --sheet-glass:rgba(242,242,247,.8);
  --gshadow:0 12px 32px -14px rgba(25,40,70,.3),0 1px 2px rgba(0,0,0,.04);
  --card2:#FFFFFF;
  --tabind:rgba(0,0,0,.07); --tabbg:rgba(255,255,255,.8);
  color-scheme:light;
}
:root{box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--text)}
/* The page only scrolls vertically: no sideways panning or rubber-banding, and no double-tap (or pinch) zoom.
   touch-action is intersected down the tree, so a descendant cannot opt back in to horizontal panning; only touch events (monthly swipe, chart scrub) still see sideways gestures. */
html,body{overflow-x:hidden;overscroll-behavior-x:none;touch-action:pan-y}
/* no double-tap zoom anywhere: iOS honours that only for touch-action:manipulation (more specific rules like pan-y/none still apply) */
*{touch-action:manipulation}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  font-size:15px;line-height:1.3;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;transition:background-color .5s var(--spring);
}
body::before{content:"";position:fixed;inset:0 0 auto;height:calc(env(safe-area-inset-top,0px) + 14px);z-index:10;pointer-events:none;opacity:0;transition:opacity .3s;-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);-webkit-mask-image:linear-gradient(rgba(0,0,0,.6) 50%,transparent);mask-image:linear-gradient(rgba(0,0,0,.6) 50%,transparent)}
body.scrolled::before{opacity:1}
body.sheet-open{overflow:hidden;background:var(--behind)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
/* no long-press text selection or callout anywhere in the app; fields you type into still select normally */
html{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}

#app{position:relative;max-width:560px;margin:0 auto;min-height:100%;background:var(--bg);transform-origin:50% 0;
  transition:transform .55s var(--spring),border-radius .55s var(--spring)}
body.sheet-open #app{transform:scale(.93);border-radius:14px;overflow:hidden}

.aura{position:absolute;inset:0 0 auto;height:720px;pointer-events:none;z-index:0;overflow:hidden;opacity:.85;
  -webkit-mask-image:linear-gradient(#000 40%,transparent 92%);mask-image:linear-gradient(#000 40%,transparent 92%)}
.aura::before,.aura::after{content:"";position:absolute;z-index:1;width:135%;aspect-ratio:1;border-radius:50%;will-change:transform,scale}
.aura-drift{position:absolute;left:0;top:0;width:110%;height:70%;background:radial-gradient(closest-side,rgba(11,130,166,.26),transparent);animation:drift 13s ease-in-out infinite alternate;will-change:transform}
.aura::before{left:-40%;top:-38%;background:radial-gradient(closest-side,var(--g1a),transparent);animation:spinA 19s linear infinite,breathe 8s ease-in-out infinite alternate}
.aura::after{right:-45%;top:-18%;background:radial-gradient(closest-side,var(--g2a),transparent);animation:spinB 24s linear infinite,breathe 10s ease-in-out -4s infinite alternate}
@keyframes spinA{from{transform:rotate(0deg) translateX(24%) rotate(0deg)}to{transform:rotate(360deg) translateX(24%) rotate(-360deg)}}
@keyframes spinB{from{transform:rotate(180deg) translateX(26%) rotate(-180deg)}to{transform:rotate(-180deg) translateX(26%) rotate(180deg)}}
@keyframes breathe{from{scale:1}to{scale:1.22}}
/* the aura is hidden behind the scrim while a sheet is open: pause it so the sheet animation gets the frame budget */
body.sheet-open .aura-drift,body.sheet-open .aura::before,body.sheet-open .aura::after{animation-play-state:paused}
@keyframes drift{from{transform:translate3d(-.9%,0,0)}to{transform:translate3d(-8.2%,19.3%,0)}}
main{position:relative;z-index:1}
.gtext{color:var(--text)}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--accent);transition:transform .25s var(--spring),background-color .2s}
.icon-btn:active{transform:scale(.86);background:var(--fill)}
.icon-btn svg{width:22px;height:22px}

/* no top bar: the large title sits right under the status bar (html already pads the top safe area); the bottom inset is padded once on html */
/* the aura runs under the status bar to the very top; only the content is pushed below the safe area */
main{padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 108px}
h1.large{font-size:22px;font-weight:700;letter-spacing:.005em;margin:18px 4px 8px}

/* hero */
.hero{padding:0 4px}
.hero-label{position:absolute;left:0;bottom:6px;font-size:13px;color:var(--sec);height:18px;transition:color .2s}
.hero-top{position:relative;height:0}
.eye{width:30px;height:30px;margin:-4px 0 -4px -7px;border-radius:50%;display:grid;place-items:center;color:var(--sec);transition:transform .3s var(--bounce),color .2s}
.eye svg{width:18px;height:18px}
.eye:active{transform:scale(.8);color:var(--text)}
.split{font-size:13px;color:var(--sec);margin-top:4px}
.split b{font-weight:500;color:var(--text)}
.total{font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.08;margin:2px 0 4px;white-space:nowrap;
  transition:filter .45s var(--spring),font-size .3s var(--spring)}
.delta{font-size:15px;font-weight:600;height:22px;display:flex;align-items:center;gap:6px;color:var(--sec)}
.delta .chg{display:inline-flex;align-items:center;gap:3px;transition:color .3s}
.delta .chg.up{color:var(--up)}.delta .chg.up svg{color:var(--up)} .delta .chg.down{color:var(--down)}
.delta .when{font-weight:400;color:var(--sec)}
.insight{font-size:13px;color:var(--sec);min-height:18px;margin-top:3px;transition:opacity .2s}
.insight.off{opacity:0}
.insight b{font-weight:600;color:var(--text)}
.delta svg{width:12px;height:12px;transition:transform .4s var(--spring)}
.delta .down svg{transform:rotate(180deg)}
body.hide .amt{filter:blur(10px)}

/* chart */
.chart-wrap{position:relative;height:210px;margin:14px -16px 0;touch-action:pan-y;user-select:none;-webkit-user-select:none}
#chart{display:block;width:100%;height:100%;overflow:visible}
#chart .line{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transition:stroke .4s}
#chart .area{transition:opacity .8s ease .25s}
#chart .base{stroke:var(--ter);stroke-width:1;stroke-dasharray:2 4}
#chart .lbl{fill:var(--sec);font-size:12px}
#chart .lbl .lv{fill:var(--sec);font-weight:600}
#chart .scrub{opacity:0;transition:opacity .15s}
#chart.scrubbing .scrub{opacity:1}
#chart.scrubbing .enddot,#chart.scrubbing .pulse{opacity:0}
#chart .scrub line{stroke:var(--sec);stroke-width:1}
#chart .scrub circle{stroke:var(--card);stroke-width:3}
.scrub-tip{position:absolute;left:0;top:0;transform:translate(-50%,calc(-100% - 12px));pointer-events:none;opacity:0;white-space:nowrap;
  padding:6px 11px;border-radius:13px;background:var(--glass-strong);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  box-shadow:var(--gshadow);font-size:14px;font-weight:600;text-align:center;line-height:1.2;transition:opacity .15s}
.scrub-tip small{display:block;font-size:11px;font-weight:500;color:var(--sec)}
.chart-wrap.scrubbing .scrub-tip{opacity:1}
#chart .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s var(--ease) infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.5}70%,100%{transform:scale(3.2);opacity:0}}
.chart-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 40px;font-size:14px;color:var(--sec);pointer-events:none;opacity:0;transition:opacity .4s}
.chart-empty.show{opacity:1}

/* segmented */
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:9px;padding:2px;margin:12px 0 0}
.seg button{position:relative;z-index:1;height:30px;font-size:13px;font-weight:500;border-radius:7px;transition:color .2s}
.seg button[aria-pressed="true"]{font-weight:600}
.seg .thumb{position:absolute;top:2px;bottom:2px;left:2px;border-radius:7px;background:#636366;box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 1px rgba(0,0,0,.08);transition:transform .45s var(--spring)}
:root[data-theme="light"] .seg .thumb{background:var(--card)}

/* cards & lists */
.section-h{display:flex;justify-content:space-between;align-items:baseline;margin:28px 4px 8px}
.section-h h2{font-size:19px;font-weight:700;margin:0}
.section-h button{color:var(--accent);font-size:15px}
.card{background:var(--card);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:60px;position:relative;width:100%;text-align:left;transition:background-color .2s}
.row + .row::before{content:"";position:absolute;top:0;left:64px;right:0;height:.5px;background:var(--sep)}
button.row:active{background:var(--fill)}
.avatar{background-image:linear-gradient(150deg,rgba(255,255,255,.38),rgba(255,255,255,0) 55%,rgba(0,0,0,.08));box-shadow:inset 0 0 0 .5px rgba(255,255,255,.25);flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:600;font-size:16px}
.row .mid{flex:1;min-width:0}
.row .t1{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:13px;color:var(--sec);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .end{text-align:right;flex:none}
.row .end .t1{font-weight:600}
.row.enter{animation:enter .6s var(--spring) both}
@keyframes enter{from{opacity:0;transform:translateY(-10px) scale(.98)}}

.primary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:999px;background:var(--grad);background-size:180% 100%;color:#fff;font-weight:600;font-size:16px;margin-top:16px;box-shadow:var(--glow);text-shadow:0 1px 1px rgba(0,0,0,.12);animation:sheen 6s ease-in-out infinite alternate;transition:transform .3s var(--spring),opacity .2s,box-shadow .3s}
@keyframes sheen{from{background-position:0% 50%}to{background-position:100% 50%}}
.primary:active{transform:scale(.97);opacity:.85}
.primary:disabled{opacity:.35;box-shadow:none}


.nudge{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--spring),margin .5s var(--spring);margin-top:0}
.nudge.show{grid-template-rows:1fr;margin-top:16px}
.nudge > div{overflow:hidden}
.nudge .card{padding:14px 16px;display:flex;gap:12px;align-items:center}
.nudge .dot{width:9px;height:9px;border-radius:50%;background:var(--grad);box-shadow:0 0 10px var(--g1a),0 0 14px var(--g2a);flex:none;animation:dotPulse 2s ease-in-out infinite}
@keyframes dotPulse{50%{transform:scale(.6);opacity:.5}}
.nudge p{margin:0;font-size:14px;color:var(--sec)} .nudge b{color:var(--text);font-weight:600;display:block}

/* allocation */
.alloc{padding:16px}
.bub-h{display:flex;align-items:center;justify-content:space-between;min-height:30px;margin:-2px 0 4px;font-size:15px;font-weight:600}
.bub-h .t2{font-size:13px;font-weight:400;color:var(--sec);margin:0 auto}
.bub-back{display:flex;align-items:center;gap:2px;margin-left:-6px;font-weight:600;font-size:15px;color:var(--text)}
.bub-back svg{width:22px;height:22px}
/* no clipping, so the spring overshoot never cuts a bubble's edge; only a grid that scrolls sideways clips */
.bub{--bub-move:.9s;position:relative;height:320px;margin:0 -8px;overflow:visible;border-radius:18px}
.bub.pan{overflow:hidden}
.bub.lvl{touch-action:pan-y}
.bub .bb{touch-action:none}

.bub.lvl.pan{cursor:grab}
.bub.live .bb:not(.gone){transition:opacity .2s ease;transition-delay:0ms!important}
.bub-leg{margin-top:6px}
.bub-ring{position:absolute;border-radius:50%;border:2px solid;pointer-events:none;z-index:5}
.bb.popping .bt{opacity:0;transition:opacity .12s}
.pv .pgrp{color:var(--sec);font-weight:400;margin-left:6px}
.pv .pgrp::before{content:"in ";}
/* Apple-style secondary button: full width, soft grey fill, not shouting */
.bub-add{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:46px;margin:12px 0 4px;border-radius:14px;
  background:var(--fill);color:var(--text);font-size:15px;font-weight:600;transition:transform .25s var(--spring),background-color .2s}
.bub-add svg{width:20px;height:20px;opacity:.9} .bub-add:active{transform:scale(.97);background:var(--fill2,var(--fill))}
.bubcard{padding:14px 16px 12px;overflow:visible}
.bub-leg .bl{display:flex;align-items:center;gap:10px;width:100%;padding:6px 0;font-size:14px;text-align:left;color:var(--text)}
.bub-leg .sw{width:10px;height:10px;border-radius:50%;flex:none}
.bub-leg .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bub-leg .pc{color:var(--sec);width:44px;text-align:right}
.bub-leg .vl{width:104px;text-align:right;font-weight:500}
.bub-leg .tot,.legend .tot{display:flex;align-items:center;gap:10px;margin-top:6px;padding:10px 0 4px;border-top:.5px solid var(--sep);font-size:14px;font-weight:600}
.bub-leg .tot .nm,.legend .tot .nm{flex:1} .bub-leg .tot .vl,.legend .tot .vl{text-align:right}
.bb{position:absolute;left:0;top:0;border-radius:50%;padding:0;will-change:transform,opacity;transform-origin:50% 50%;
  transition:transform var(--bub-move) var(--bounce),opacity .35s ease}
.bb.gone{opacity:0;pointer-events:none;transition:transform .5s cubic-bezier(.4,0,.2,1),opacity .3s ease}
.bb .bt{display:flex;flex-direction:column;align-items:center;gap:1px;max-width:100%;transition:opacity .35s ease}
.bb.pre .bt{opacity:0;transition-duration:.15s}
/* leaving bubbles: the label fades out gently while the bubble shrinks away, instead of vanishing at once */
.bb.gone .bt{opacity:0;transition:opacity .35s ease}
.bf{position:absolute;inset:0;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;overflow:hidden;padding:0 6px;
  color:#fff;text-align:center;line-height:1.15;text-shadow:0 1px 2px rgba(0,0,0,.35),0 0 8px rgba(0,0,0,.12);
  background:radial-gradient(circle at 32% 24%,rgba(255,255,255,.3),rgba(255,255,255,0) 55%),linear-gradient(140deg,var(--ba,var(--bc)) 10%,var(--bb,var(--bc)) 90%);
  box-shadow:inset 0 -6px 14px rgba(0,0,0,.18);
  animation:bfloat 6s ease-in-out infinite;animation-delay:var(--fd);transition:scale .3s var(--bounce)}
.bub{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.bb .bf{transition:scale .5s cubic-bezier(.3,.7,.2,1)}
.bb.press .bf{scale:.9;transition:scale .55s cubic-bezier(.3,0,.2,1)}
.bb.lifted{z-index:5}
.bb.lifted .bf{scale:1.14;box-shadow:inset 0 -6px 14px rgba(0,0,0,.18),0 22px 40px -14px rgba(0,0,0,.65);transition:scale .45s var(--bounce),box-shadow .3s}
.bub .bb.dragging{transition:none!important}

.bn{font-size:13px;font-weight:600;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;-webkit-hyphens:auto;hyphens:auto}
.bv{font-size:12px;font-weight:600;opacity:.95;white-space:nowrap}
.bi svg{width:18px;height:18px;fill:#fff;opacity:.9}
.bb.sm .bi{display:none}
.bb.xs .bn{display:none} .bb.xxs .bv{display:none}
@keyframes bfloat{0%,100%{translate:0 0}25%{translate:1.5px -3px}50%{translate:-1px 2px}75%{translate:-2px -1.5px}}
@media (prefers-reduced-motion: reduce){.bf{animation:none}}
.donut-wrap{position:relative;width:170px;height:170px;margin:4px auto 8px}
#donut{width:100%;height:100%;transform:rotate(-90deg)}
#donut circle{fill:none;stroke-width:14}
#donut .dbg{stroke:var(--fill)}
#donut .dseg{transition:stroke-dasharray 1s var(--spring)}
.donut-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.donut-c .num{font-size:20px;font-weight:700;letter-spacing:-.02em}
.donut-c .t2{font-size:12px;color:var(--sec)}
.more{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .5s var(--spring),visibility 0s .5s}
.more.open{grid-template-rows:1fr;visibility:visible;transition:grid-template-rows .5s var(--spring),visibility 0s}
.more-in{overflow:hidden;min-height:0}
.seeall{display:flex;align-items:center;justify-content:center;gap:2px;width:100%;padding:12px 0 14px;color:var(--text);font-size:14px;font-weight:600}
.section-h .edit-btn{color:var(--text);margin:-8px -6px -8px 0}
.edit-btn{width:38px;height:38px;display:grid;place-items:center;color:var(--text);transition:transform .25s var(--spring),opacity .2s}
.section-h .edit-btn svg,.edit-btn svg{width:24px;height:24px} .edit-btn:active{transform:scale(.85);opacity:.7}
.alloc .seg{margin:0 0 14px}
.abars .ab{padding:7px 0}
.abars .ab-h{display:flex;align-items:center;gap:10px;font-size:14px}
.abars .ab-h .nm{flex:1} .abars .ab-h .pc{color:var(--sec)} .abars .ab-h .vl{font-weight:500;width:90px;text-align:right}
.abars .ab-t{height:8px;border-radius:4px;background:var(--fill);margin-top:7px;overflow:hidden}
.abars .ab-t i{display:block;height:100%;border-radius:4px;width:0;transition:width 1s var(--spring)}
.seeall svg{width:20px;height:20px;transition:transform .4s var(--spring)} .seeall.open svg{transform:rotate(180deg)}
.legend{margin-top:12px}
.legend .li{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:14px}
.legend .sw{width:10px;height:10px;border-radius:3px;flex:none}
.legend .nm{flex:1}
.legend .pc{color:var(--sec);width:48px;text-align:right}
.legend .vl{width:110px;text-align:right;font-weight:500}

.empty-list{padding:28px 20px;text-align:center;color:var(--sec);font-size:14px}
.foot{text-align:center;color:var(--ter);font-size:12px;margin-top:28px}

.section-h button{font-size:14px;font-weight:600}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between;
  padding:26px 16px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,var(--bg) 46%);
  transition:transform .5s var(--spring),opacity .3s}
body.sheet-open .tabbar{transform:translateY(120%);opacity:0;pointer-events:none}
.tabs{position:relative;flex:none;display:grid;grid-template-columns:repeat(3,84px);height:62px;padding:4px;border-radius:31px;background:var(--card);
  box-shadow:0 10px 30px -12px rgba(0,0,0,.3),inset 0 0 0 .5px var(--sep)}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--text);border-radius:27px;transition:color .3s}
.tab svg{width:24px;height:24px;transition:transform .5s var(--spring)}
.tab[aria-selected="true"]{color:var(--accent)}
.tab.due::after{content:"";position:absolute;top:7px;left:calc(50% + 9px);width:8px;height:8px;border-radius:50%;background:var(--g1);box-shadow:0 0 0 2px var(--tabbg),0 0 8px var(--g1a)}
.tab[aria-selected="true"] svg{transform:scale(1.1)}
.tab:active svg{transform:scale(.85)}
.tab-ind{position:absolute;top:4px;bottom:4px;left:4px;width:92px;border-radius:27px;background:var(--fill);transition:transform .55s var(--spring)}
.fab{flex:none;width:62px;height:62px;padding:0;justify-content:center;border-radius:50%;background:var(--grad);background-size:180% 100%;color:#fff;font-weight:700;font-size:17px;
  display:flex;align-items:center;gap:7px;box-shadow:var(--glow);text-shadow:0 1px 1px rgba(0,0,0,.12);animation:sheen 6s ease-in-out infinite alternate;transition:transform .35s var(--spring)}
.fab svg{width:26px;height:26px;transition:transform .5s var(--spring)}
.fab:active{transform:scale(.93)} .fab:active svg{transform:rotate(90deg)}


.ghost{height:52px;padding:0 18px 0 14px;border-radius:999px;background:var(--card);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:8px;
  box-shadow:0 6px 18px -10px rgba(0,0,0,.25),inset 0 0 0 .5px var(--sep);transition:transform .3s var(--spring)}
.ghost:active{transform:scale(.96)}
.ghost svg{width:18px;height:18px;flex:none;color:var(--text);fill:currentColor}
/* entry form */
.entry-top{padding:6px 0 4px}
.name-in{display:block;width:100%;border:0;background:none;outline:none;text-align:center;font-size:16px;font-weight:600;padding:14px 16px 0;color:var(--text)}
.name-in::placeholder{color:var(--ter);font-weight:500}
.entry-top .big-amt{padding:6px 16px 16px}
.pick{position:relative;cursor:pointer}
.pick .pl{flex:1}
.pick .pv{color:var(--sec);display:inline-flex;align-items:center;gap:8px;transition:transform .35s var(--spring)}
.pick .pv.bump{animation:bump .4s var(--spring)}
@keyframes bump{40%{transform:scale(1.08)}}
.pick .dot{width:10px;height:10px;border-radius:50%}
.pick .chev{color:var(--ter);font-size:22px;line-height:1;margin-left:2px}
.pick select{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:17px;cursor:pointer;-webkit-appearance:none;appearance:none}
.pick:active{background:var(--fill)}
.field .field-sep{}
.sheet-body > .card + .card{margin-top:16px}
input::-webkit-calendar-picker-indicator{display:none!important;opacity:0}
/* views */
.view{display:none}
.view.active{display:block;animation:viewin .5s var(--spring)}
@keyframes viewin{from{opacity:0;transform:translateY(12px)}}
h1.large.swap{animation:viewin .45s var(--spring)}
.ghost.wide{width:100%;justify-content:center;margin-top:16px}
.ghost.wide span{color:var(--text)}
.mdetail-empty{padding:34px 24px;text-align:center;color:var(--sec);font-size:14px;line-height:1.45}
.mhead{margin:6px 4px 0}
/* monthly: one month at a time */
#vMonthly{touch-action:pan-y}
.mnav .ttl{text-align:center;font-size:17px;font-weight:600}
.quiet{display:block;margin:26px auto 0;color:var(--down);font-size:14px;font-weight:500;padding:9px 16px;border-radius:999px;transition:background-color .2s,color .2s}
.quiet.armed{background:var(--down);color:#fff}
.link{color:var(--text);font-size:13px;font-weight:600;padding:4px 0;white-space:nowrap}
.carry{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:8px 16px 0;font-size:13px;color:var(--sec);line-height:1.4}
.add-row{color:var(--accent);font-weight:500}
.add-row .avatar{background:var(--fill)!important;color:var(--accent)}
/* settings tab */
.rate-row{display:flex;justify-content:space-between;align-items:center;padding:0 20px;min-height:48px;font-size:15px}
.rate-row span:first-child{color:var(--sec)}
.rate-row span:last-child{font-weight:500}
#vSettings .lbl-s:first-child{margin-top:0}

/* history */
.row.noav + .row.noav::before{left:16px}
.row .chev{color:var(--ter);font-size:22px;line-height:1;margin-left:-4px;flex:none}
.pos,.row .pos{color:var(--up);font-weight:600}
.neg,.row .neg{color:var(--down);font-weight:600}
.fx-row .avatar{background:var(--fill)!important} .fx-row .avatar svg{fill:var(--g1)}
.m-none{padding:18px 16px;color:var(--sec);font-size:14px;text-align:center}
.m-unch{margin-top:2px}
#mDetail .seeall{margin-top:4px}
.more-btn{display:block;margin:10px auto 0;font-size:14px;font-weight:600;padding:6px 12px}
.mnav{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin:4px 0 6px}
.mnav .icon-btn:disabled{opacity:.2;pointer-events:none}
.mnav .icon-btn svg{width:24px;height:24px}
.mhead{text-align:center}
.mhead .total{font-size:33px;margin:0}
.mhead .delta{justify-content:center}
.mview.slide-l{animation:slideL .45s var(--spring)}
.mview.slide-r{animation:slideR .45s var(--spring)}
@keyframes slideL{from{opacity:0;transform:translateX(-28px)}}
@keyframes slideR{from{opacity:0;transform:translateX(28px)}}
.mbar{margin:18px 4px 0}

/* sheet */
#scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .45s var(--spring);z-index:20}
body.sheet-open #scrim{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;background:var(--bg);
  border-radius:14px 14px 0 0;max-height:calc(100% - env(safe-area-inset-top,0px) - 10px);display:flex;flex-direction:column;
  transform:translateY(105%);transition:transform .5s var(--spring);box-shadow:0 -10px 40px rgba(0,0,0,.18);visibility:hidden}
#sheet.open{transform:none;visibility:visible}
#sheet.dragging{transition:none}
.grab{flex:none;padding:6px 16px 0;touch-action:none}
.handle{width:36px;height:5px;border-radius:3px;background:var(--fill2);margin:0 auto 6px}
.sheet-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:44px}
.sheet-bar .ttl{font-weight:600;text-align:center}
.sheet-bar .l{justify-self:start;color:var(--text)} .sheet-bar .r{justify-self:end;color:var(--text);font-weight:600;transition:opacity .2s}
.sheet-bar .r:disabled{opacity:.35}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
.lbl-s{font-size:13px;color:var(--sec);margin:22px 16px 7px}
.lbl-s:first-child{margin-top:6px}
.note{font-size:13px;color:var(--sec);margin:8px 16px 0;line-height:1.4}
.field{display:flex;align-items:center;gap:10px;padding:0 16px;min-height:50px;position:relative}
.field + .field::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.field label{flex:none;min-width:84px}
/* entry icon: a row with the current icon that opens a grid of icons to pick from */
button.field{width:100%;text-align:left}
.icon-pick .avatar{width:30px;height:30px} .icon-pick .avatar svg{width:18px;height:18px}
.icon-more.open{transition:grid-template-rows .85s var(--spring),visibility 0s} /* the grid is tall, so it opens slower; closing keeps .more's .5s */
.icon-more + .field::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:10px;padding:4px 16px 16px}
.icon-grid button{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--text);transition:background-color .2s,transform .2s cubic-bezier(.2,.8,.2,1)}
.icon-grid button:active{transform:scale(.9)}
.icon-grid button svg{width:21px;height:21px}
.icon-grid button[aria-pressed="true"]{background:var(--ic);color:#fff;box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ic)}
.field input{flex:1;min-width:0;border:0;background:none;font-size:16px;padding:13px 0;outline:none;text-align:right}
.field input.left{text-align:left}
.field input::placeholder{color:var(--ter)}
.field .cur{color:var(--sec);flex:none}
.big-amt{position:relative;display:block;padding:18px 16px;cursor:text}
.big-amt .disp{display:flex;align-items:baseline;justify-content:center;gap:6px;pointer-events:none;min-height:42px}
.big-amt .sym{font-size:26px;font-weight:600;color:var(--sec)}
.big-amt .digits{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80%}
.big-amt .digits.ph{color:var(--ter)}
.big-amt .digits.tick{animation:tick .3s var(--spring)}
@keyframes tick{40%{transform:scale(1.04)}}
.big-amt .caret{align-self:center;width:2.5px;height:32px;border-radius:2px;background:var(--grad);margin-left:-3px;opacity:0}
.big-amt.focus .caret{animation:blink 1.05s steps(1) infinite}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
.big-amt input{position:absolute;inset:0;width:100%;height:100%;border:0;margin:0;padding:0;background:transparent;outline:none;color:transparent;caret-color:transparent;font-size:16px;text-align:center;-webkit-text-fill-color:transparent;-webkit-user-select:text;user-select:text}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:17px;background:var(--card);font-size:14px;display:inline-flex;align-items:center;gap:7px;transition:background-color .25s,color .25s,transform .3s var(--spring)}
.chip:active{transform:scale(.94)}
.chip .sw{width:9px;height:9px;border-radius:50%}
.chip[aria-pressed="true"]{background:var(--grad);color:#fff;box-shadow:var(--glow)}
.chip[aria-pressed="true"] .sw{box-shadow:0 0 0 2px #fff}
.danger{color:var(--down);width:100%;height:52px;border-radius:999px;background:var(--card);margin-top:22px;font-size:15px;transition:transform .3s var(--spring),background-color .2s}
.danger:active{transform:scale(.97)}
.danger.armed{background:var(--down);color:#fff}
.plain-btn{width:100%;height:50px;color:var(--text);font-size:15px;text-align:left;padding:0 16px;position:relative}
.plain-btn + .plain-btn::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.plain-btn:active{background:var(--fill)}
.sw-row{display:flex;align-items:center;justify-content:space-between;width:100%;height:50px;padding:0 16px;font-size:15px;color:var(--text)}
.sw-row .sw{position:relative;width:51px;height:31px;border-radius:16px;background:var(--fill2);transition:background .25s}
.sw-row .sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .35s var(--bounce)}
.sw-row[aria-checked="true"] .sw{background:var(--grad)}
.sw-row[aria-checked="true"] .sw::after{transform:translateX(20px)}
textarea.backup{width:100%;min-height:120px;border:0;border-radius:14px;background:var(--card);padding:12px 14px;font-size:13px;font-family:ui-monospace,Menlo,monospace;resize:vertical;margin-top:10px;outline:none}
.upd-row .end input{width:120px;border:0;background:var(--fill);border-radius:9px;padding:8px 10px;text-align:right;font-size:16px;outline:none;font-variant-numeric:tabular-nums;transition:box-shadow .2s}
.upd-row .end input:focus{box-shadow:0 0 0 2px var(--accent)}
.upd-row .end .c{font-size:12px;color:var(--sec);margin-top:3px}
.upd-total{display:flex;justify-content:space-between;align-items:flex-start;padding:16px 4px 0}
.upd-tr{text-align:right}
.upd-chg{font-size:13px;color:var(--sec);margin-top:2px} .upd-chg .up{color:var(--up);font-weight:600} .upd-chg .down{color:var(--down);font-weight:600}
.upd-prog{height:4px;border-radius:2px;background:var(--fill);margin:10px 16px 10px;overflow:hidden}
.upd-prog i{display:block;height:100%;width:0;background:var(--grad);border-radius:2px;transition:width .45s var(--spring)}
.carry b{font-weight:600;color:var(--text);white-space:nowrap}
.upd-row .t1{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.25}
.upd-row .t2.hint{white-space:normal;line-height:1.3}
.upd-row .hint .up{color:var(--up)} .upd-row .hint .down{color:var(--down)} .upd-row .hint .dep{color:var(--sec)}
.upd-row .end .amt-in{display:flex;align-items:center;gap:3px;width:132px;height:38px;padding:0 10px;border-radius:9px;background:var(--fill);transition:box-shadow .2s}
.upd-row .end .amt-in:focus-within{box-shadow:0 0 0 2px var(--accent)}
.upd-row .end .amt-in .sym{color:var(--sec);font-size:15px;flex:none}
.upd-row .end .amt-in input{flex:1;min-width:0;width:auto;height:100%;padding:0;border:0;background:none;box-shadow:none;color:var(--text);text-align:right;font-size:16px;outline:none;font-variant-numeric:tabular-nums}
.chk{flex:none;width:44px;height:44px;margin:-6px -12px -6px -6px;display:grid;place-items:center}
.chk i{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ter);display:grid;place-items:center;transition:transform .35s var(--bounce),background .2s,border-color .2s}
.chk svg{width:17px;height:17px;fill:#fff;opacity:0;transform:scale(.5);transition:opacity .2s,transform .35s var(--bounce)}
.chk:active i{transform:scale(.85)}
.upd-row.ok .chk i{background:var(--grad);border-color:transparent}
.upd-row.ok .chk svg{opacity:1;transform:none}
.upd-rest{display:block;width:100%;margin:10px 0 0;padding:12px;border-radius:14px;background:var(--fill);color:var(--text);font-size:15px;font-weight:600}
.reveal{text-align:center;padding:14px 0 4px}
body.empty .hero,body.empty #chartWrap,body.empty #range{display:none}
/* launch splash: the icon's curve draws itself, the dot pops, the word fades in, then it all lifts away */
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(120% 80% at 30% 15%,rgba(255,255,255,.18),rgba(255,255,255,0) 60%),linear-gradient(160deg,#34D69E 0%,#11A27C 55%,#0B7F68 100%);transition:opacity .5s ease,transform .6s cubic-bezier(.2,.8,.2,1)}
#splash.out{opacity:0;transform:scale(1.12);pointer-events:none}
/* safety net: if start-up ever fails before the script removes it, the splash still gets out of the way */
#splash{animation:spGone .4s ease 4s forwards}
@keyframes spGone{to{opacity:0;visibility:hidden}}
.sp-in{display:flex;flex-direction:column;align-items:center;gap:14px;animation:spIn .7s cubic-bezier(.2,.8,.2,1) both}
.sp-logo svg{width:124px;height:124px;overflow:visible}
.sp-logo path,.oa-core path{fill:none;stroke:#fff;stroke-width:9;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:0;animation:spDraw .85s cubic-bezier(.65,0,.35,1) .2s forwards}
.sp-logo circle,.oa-core circle{fill:none;stroke:#fff;stroke-width:5;transform-box:fill-box;transform-origin:center;transform:scale(0);animation:spPop .5s cubic-bezier(.34,1.56,.64,1) .95s forwards}
.sp-word{color:#fff;font-size:26px;font-weight:700;letter-spacing:-.01em;opacity:0;animation:spFade .5s ease 1s forwards}
@keyframes spIn{from{transform:scale(.85);opacity:0}}
@keyframes spDraw{0%{opacity:1;stroke-dashoffset:1}100%{opacity:1;stroke-dashoffset:0}}
@keyframes spPop{to{transform:scale(1)}}
@keyframes spFade{to{opacity:1}}
@media (prefers-reduced-motion: reduce){.sp-in{animation:none}.sp-logo path,.oa-core path{animation:none;stroke-dashoffset:0;opacity:1}.sp-logo circle,.oa-core circle{animation:none;transform:none}.sp-word{animation:none;opacity:1}}

/* onboarding */
/* While onboarding is open the app is taken out of the layout, so there's nothing to scroll. Don't pin the body with
   position:fixed: in the iOS home-screen app that shrinks the page box (812 of 874pt) and clips the layer's bottom. */
html.onb-open,body.onb-open{overscroll-behavior:none}
body.onb-open #app,body.onb-open .tabbar,body.onb-open #fab{display:none}
.onb[hidden]{display:none}
.onb{position:fixed;top:0;left:0;right:0;bottom:0;z-index:60;display:flex;flex-direction:column;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 6px) 0 max(env(safe-area-inset-bottom,0px), 16px)}
.onb::before{content:"";position:absolute;inset:0 0 auto;height:420px;pointer-events:none;background:radial-gradient(70% 60% at 25% 0%,var(--g1a),transparent 70%),radial-gradient(60% 50% at 90% 10%,var(--g2a),transparent 70%);opacity:.55}
.onb-top{position:relative;display:flex;align-items:center;justify-content:space-between;height:52px;flex:none;padding:0 20px}
.onb-back{width:44px;height:44px;border-radius:50%;background:var(--card);display:grid;place-items:center;color:var(--text)}
.onb-back svg{width:24px;height:24px;fill:currentColor}
.onb-back:active{transform:scale(.9)}
.onb-skip{min-width:44px;height:44px;font-size:15px;font-weight:600;color:var(--text)}
.onb-dots{display:flex;gap:6px;align-items:center;transition:opacity .3s}
.onb-dots.off{opacity:0}
.onb-dots i{width:7px;height:7px;border-radius:4px;background:var(--fill2);transition:width .55s cubic-bezier(.3,1.35,.5,1),background-color .4s ease}
.onb-dots i.done{background:var(--sec)}
.onb-dots i.on{width:26px;background:var(--g1)}
.onb-stage{position:relative;flex:1;min-height:0}
.onb-pg{position:absolute;inset:0;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;padding:6px 20px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.onb-pg::-webkit-scrollbar{display:none}
.onb-pg.center{text-align:center;align-items:stretch}
.onb-h{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.12;margin:6px 0 8px}
.onb-sub{font-size:15px;color:var(--sec);margin:0 0 20px;line-height:1.4}
.onb-hint{font-size:13px;color:var(--sec);margin:10px 4px 0}
.onb-foot{position:sticky;bottom:0;z-index:3;margin-top:auto;padding:28px 0 0;flex:none;background:linear-gradient(to bottom,transparent,var(--bg) 26px)}
.onb-foot .primary{margin-top:0;height:54px;font-size:16px;box-shadow:0 10px 26px -14px var(--g1a)}
.onb-text{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:48px;margin-top:6px;font-size:15px;font-weight:600;color:var(--text)}
.onb-text svg{width:20px;height:20px;fill:currentColor}
.onb-list{display:flex;flex-direction:column;gap:10px}
.onb-opt,.onb-card{position:relative;background:var(--card);border-radius:20px;box-shadow:inset 0 0 0 2px transparent;text-align:left;color:var(--text);transition:box-shadow .2s,transform .35s var(--bounce),background-color .2s}
.onb-opt:active,.onb-card:active{transform:scale(.96)}
.onb-opt[aria-pressed="true"],.onb-card[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent);background:color-mix(in srgb,var(--card) 88%,var(--accent))}
.onb-opt{display:flex;align-items:center;gap:14px;width:100%;padding:13px 16px;font-size:15px;font-weight:600}
.onb-opt small{display:block;font-size:13px;font-weight:400;color:var(--sec);margin-top:1px}

/* Floating bar, proportions copied from Apple Health's tab bar (measured on a 402pt screenshot):
   pill 274 x 62, tabs on an 86px pitch with 8px of padding at both ends (first icon centre 51px from the edge),
   selected capsule 94 x 55 (wider than the pitch), inset 4px at the sides and 3.5px top and bottom, icon ~22px, label 11px.
   The pill and the 62px + button sit together as one centred group, 10px apart, about 18px above the bottom edge. */

#sheet{background:var(--sheet-glass);-webkit-backdrop-filter:blur(34px) saturate(180%);backdrop-filter:blur(34px) saturate(180%);border-radius:28px 28px 0 0;
  transition:transform .62s var(--spring),opacity .35s,border-radius .62s var(--spring),visibility 0s linear .62s}

/* monotone cubic path */
function smoothPath(P){
  const n = P.length;
  if(n === 1) return `M${P[0][0]},${P[0][1]}`;
  const dx = [], m = [], t = [];
  for(let i=0;i<n-1;i++){ dx[i] = P[i+1][0]-P[i][0]; m[i] = (P[i+1][1]-P[i][1]) / (dx[i]||1); }
  t[0] = m[0]; t[n-1] = m[n-2];
  for(let i=1;i<n-1;i++) t[i] = m[i-1]*m[i] <= 0 ? 0 : (m[i-1]+m[i])/2;
  for(let i=0;i<n-1;i++){
    if(m[i] === 0){ t[i] = 0; t[i+1] = 0; continue; }
    const a = t[i]/m[i], b = t[i+1]/m[i], s = a*a + b*b;
    if(s > 9){ const k = 3/Math.sqrt(s); t[i] = k*a*m[i]; t[i+1] = k*b*m[i]; }
  }
  let d = `M${P[0][0]},${P[0][1]}`;
  for(let i=0;i<n-1;i++){
    const h = dx[i]/3;
    d += ` C${P[i][0]+h},${P[i][1]+t[i]*h} ${P[i+1][0]-h},${P[i+1][1]-t[i+1]*h} ${P[i+1][0]},${P[i+1][1]}`;

}

    const a = P[i]; if(a.x - a.r < 1 || a.y - a.r < 1 || a.x + a.r > W - 1 || a.y + a.r > H - 1) return false;
    for(let j = i+1; j < P.length; j++){ const b = P[j]; if(Math.hypot(a.x - b.x, a.y - b.y) < a.r + b.r + gapFor(2 * Math.min(a.r, b.r))) return false; }
  }

}

  const P = rs.map((r,i) => { if(init && init[i]) return {x:init[i].x, y:init[i].y, r};
    const a = i * 2.39996, d = i ? 18 * Math.sqrt(i) : 0; return {x: cx + Math.cos(a)*d, y: cy + Math.sin(a)*d, r}; });
  for(let it = 0; it < its; it++){
    const pull = init ? .0012 : .035 * (1 - it/its) + .004;
    P.forEach((p, i) => { if(i === fx) return; p.x += (cx - p.x) * pull; p.y += (cy - p.y) * pull; });
    for(let i = 0; i < n; i++) for(let j = i+1; j < n; j++){
      const a = P[i], b = P[j]; let dx = b.x - a.x, dy = b.y - a.y; let d = Math.hypot(dx, dy) || .01;
      const min = a.r + b.r + gapFor(2 * Math.min(a.r, b.r)) + 1;
      if(d < min){ const push = (min - d) / 2, ux = dx/d, uy = dy/d;
        let wa = b.r/(a.r+b.r), wb = a.r/(a.r+b.r);
        if(i === fx){ wa = 0; wb = 1; } else if(j === fx){ wa = 1; wb = 0; }
        a.x -= ux*push*2*wa; a.y -= uy*push*2*wa; b.x += ux*push*2*wb; b.y += uy*push*2*wb; }
    }
    P.forEach(p => { p.x = Math.min(W - p.r - 2, Math.max(p.r + 2, p.x)); p.y = Math.min(H - p.r - 2, Math.max(p.r + 2, p.y)); });

/* press and hold: the bubble sinks slowly; after a moment it lifts and (inside a group) follows your finger.

const reo = {el:null, timer:0, lifted:false, x0:0, y0:0, gx:0, gy:0, i:0};
function bubPress(el, e){
  clearTimeout(reo.timer);

  el.classList.add("press");

function bubLift(){

  box.classList.remove("live"); clearTimeout(hex.liveT);

/* Delete: the bubble pops like a soap bubble - a quick swell, then it bursts to nothing, with a thin ring
   flashing outward from its edge. Runs only when the bubble is on screen; otherwise done() right away. */
function popBubble(key, done){
  const box = $("#bub"), el = box && box.querySelector(`.bb[data-key="${key}"]:not(.gone)`);
  const r = el && el.getBoundingClientRect();
  if(!el || !el.animate || !r.width || r.bottom < 0 || r.top > innerHeight || UI.tab !== "worth" ||
     matchMedia("(prefers-reduced-motion: reduce)").matches){ done(); return; }
  const rad = +el.dataset.r, x = +el.dataset.x, y = +el.dataset.y;
  const at = sc => `translate3d(${x - rad}px,${y - rad}px,0) scale(${sc})`;
  setTimeout(() => {
    el.classList.add("popping"); el.style.zIndex = 6;
    const cs = getComputedStyle(el), col = (cs.getPropertyValue("--bb") || cs.getPropertyValue("--bc")).trim() || "#fff";
    const ring = document.createElement("span"); ring.className = "bub-ring";
    ring.style.cssText = `left:${x - rad}px;top:${y - rad}px;width:${rad*2}px;height:${rad*2}px;border-color:${col}`;
    box.appendChild(ring);
    ring.animate([{transform:"scale(.95)", opacity:.9}, {transform:"scale(1.5)", opacity:0}], {duration:420, delay:100, easing:"cubic-bezier(.2,.8,.2,1)", fill:"both"})
      .onfinish = () => ring.remove();
    const a = el.animate([
      {transform: at(1), opacity:1, offset:0},
      {transform: at(1.14), opacity:1, offset:.35, easing:"cubic-bezier(.5,0,.75,0)"},
      {transform: at(.05), opacity:0, offset:1}
    ], {duration:320, easing:"cubic-bezier(.2,.8,.2,1)", fill:"forwards"});
    a.onfinish = () => { el.remove(); done(); };
  }, 320);
}

// what a bubble shows (name, icon, colours); set when it's made and again on every render, so edits show up
function bubFace(el, x){
  el._x = x; el.classList.toggle("liab", !!x.liab);
  el.style.setProperty("--bc", x.c);
  if(x.g){ el.style.setProperty("--ba", x.g[0]); el.style.setProperty("--bb", x.g[1]); }
  const face = (x.icon || "") + "|" + x.n;
  if(el._face === face) return; el._face = face;
  const bv = el.querySelector(".bv"), v = bv ? bv.textContent : "";
  el.querySelector(".bt").innerHTML = `${x.icon ? `<span class="bi">${ic(x.icon)}</span>` : ""}<span class="bn">${esc(x.n)}</span><span class="bv num amt">${esc(v)}</span>`;
}
function el_bubble(x){
  const el = document.createElement("button");
  el.className = "bb"; el.dataset.key = x.key;
  el.style.setProperty("--fd", (-Math.random() * 6).toFixed(2) + "s");
  el.innerHTML = `<span class="bf"><span class="bt"></span></span>`;
  bubFace(el, x);
  el.addEventListener("pointerdown", e => bubPress(el, e));
  el.addEventListener("contextmenu", e => e.preventDefault());
  el.onclick = () => {
    if(hex.moved){ hex.moved = false; return; }
    const x = el._x; // the latest render's item, so an edited entry opens with its new name
    if(x.group){ bubLevel = x.group; renderBubbles(x.key); }
    else if(x.acc) accountSheet(S.accounts.find(a => a.id === x.acc.id) || x.acc);
  };
  return el;

function renderAlloc(){
  const sec = $("#allocSection");
  const m = UI.month || monthKey(), snap = S.snaps[m];
  const rows = snap ? snapRows(snap) : m === monthKey() ? liveRows() : [];
  const sp = splitGroups(rows), groups = sp.groups.filter(g => g.v > 0);
  sec.style.display = groups.length || sp.debts > 0 ? "" : "none";
  if(!groups.length && !(sp.debts > 0)) return;
  const owned = sp.owned || 1, C = 2 * Math.PI * 46, dn = $("#donut"); let cum = 0;
  const colOf = k => (GROUPS.find(g => g.k === k) || {}).c;
  $("#donutV").textContent = fmt(sp.net, S.base, {dec:0});
  dn.querySelectorAll(".dseg").forEach(c => { if(!GROUPS.some(g => g.k === c.dataset.k && !g.liab)) c.remove(); }); // segments from the old per-type view

      c.setAttribute("cx", 60); c.setAttribute("cy", 60); c.setAttribute("r", 46); c.setAttribute("class", "dseg"); c.style.stroke = colOf(g.k);
      c.style.strokeDasharray = `0 ${C}`; dn.appendChild(c); }
    const v = (groups.find(x => x.k === g.k) || {}).v || 0, frac = v / owned, len = Math.max(0, frac * C - (frac > 0 && frac < 1 ? 2.5 : 0));
    c.style.strokeDashoffset = -cum; cum += frac * C;

  });

  $("#allocPie").style.display = mode === "pie" ? "" : "none";
  const ab = $("#allocBar"); ab.style.display = mode === "bar" ? "" : "none";
  const sorted = groups.slice().sort((a,b) => b.v - a.v), top = sorted.length ? sorted[0].v : 1;
  const pc = v => { const p = v / owned * 100; return (p > 0 && p < 1 ? "<1" : Math.round(p)) + "%"; };
  const nm = g => g.k === "property" && sp.netted ? "Property equity" : g.n;
  const debtRow = sp.debts > 0 ? `<div class="li"><span class="sw" style="background:${GROUPS.find(g => g.liab).c}"></span><span class="nm">Debts</span><span class="pc num"></span><span class="vl num amt">−${fmt(sp.debts, S.base, {dec:0})}</span></div>` : "";
  const totRow = `<div class="tot"><span class="nm">Net worth</span><span class="vl num amt">${sp.net < 0 ? "−" : ""}${fmt(Math.abs(sp.net), S.base, {dec:0})}</span></div>`;
  ab.innerHTML = sorted.map(g => `<div class="ab"><div class="ab-h"><span class="nm">${nm(g)}</span><span class="pc num">${pc(g.v)}</span><span class="vl num amt">${fmt(g.v, S.base, {dec:0})}</span></div><div class="ab-t"><i style="background:${colOf(g.k)}" data-w="${g.v/top*100}"></i></div></div>`).join("")
    + (debtRow || sp.debts ? `<div class="legend">${debtRow}${totRow}</div>` : "");
  if(mode === "bar") requestAnimationFrame(() => requestAnimationFrame(() => ab.querySelectorAll("i").forEach(i => i.style.width = i.dataset.w + "%")));
  $("#legend").innerHTML = sorted.map(g => `
    <div class="li"><span class="sw" style="background:${colOf(g.k)}"></span><span class="nm">${nm(g)}</span>
    <span class="pc num">${pc(g.v)}</span><span class="vl num amt">${fmt(g.v, S.base, {dec:0})}</span></div>`).join("") + debtRow + (sp.debts > 0 ? totRow : "");
}

/* ---------- monthly: one month at a time ---------- */
// every month with a record, plus the current month even before it has one
function monthList(){
  const ms = new Set(Object.keys(S.snaps)); ms.add(monthKey());
  return [...ms].sort();
}
function stepMonth(d){
  const ms = monthList(), i = ms.indexOf(UI.month), j = i + d;
  if(i < 0 || j < 0 || j >= ms.length) return;
  UI.month = ms[j]; renderMonthly(d < 0 ? "l" : "r");
}
const vsLabel = (m, prevM) => (mIndex(m) - mIndex(prevM) === 1) ? mOnly(prevM) : mShort(prevM);
// the latest month before m that has a record
const prevMonth = m => Object.keys(S.snaps).filter(k => k < m).sort().pop() || null;

function renderMonthly(dir){
  if(UI.tab !== "monthly") return;
  const ms = monthList(), cm = monthKey();
  if(!UI.month || !ms.includes(UI.month)) UI.month = cm;
  const m = UI.month, i = ms.indexOf(m);
  renderAlloc();
  $("#mTitle").textContent = mLong(m);
  $("#mPrev").disabled = i <= 0; $("#mNext").disabled = i >= ms.length - 1;

  const box = $("#mDetail"); box.innerHTML = ""; $("#mFoot").innerHTML = "";
  const view = el("div", {class:"mview" + (dir ? " slide-" + dir : "")});
  box.appendChild(view);
  const snap = S.snaps[m];

  if(!S.accounts.length && !Object.keys(S.snaps).length){
    const start = el("button", {class:"primary"}, "Get started"); start.onclick = () => openOnboarding();
    view.append(el("div", {class:"card mdetail-empty"}, "Nothing recorded yet."), start);
    return;
  }
  const pm = prevMonth(m), prevSnap = pm ? S.snaps[pm] : null;
  if(!snap){
    const btn = el("button", {class:"primary"}, "Start " + mOnly(m)); btn.onclick = () => updateSheet(m);
    view.append(el("div", {class:"card mdetail-empty"}, "Not recorded yet."), btn);
    return;
  }

  // total and change
  const v = snapTotal(snap), pv = prevSnap ? snapTotal(prevSnap) : null;
  const head = el("div", {class:"mhead"});
  const tv = el("div", {class:"total num amt"}); tv._v = pv != null ? pv : v * 0.94;
  const dl = el("div", {class:"delta num"});
  if(pv != null){ const d = v - pv, pct = pv ? d / Math.abs(pv) * 100 : 0;
    dl.innerHTML = `<span class="chg ${d >= 0 ? "up" : "down"} amt">${ARROW}${fmt(Math.abs(d), S.base)} (${Math.abs(pct).toFixed(1)}%)</span><span class="when">vs ${vsLabel(m, pm)}</span>`;
  } else dl.innerHTML = '<span class="when">First month on record</span>';
  head.append(tv, dl);
  // one action, right under the total: update this month (highlighted while the current month still waits for its check-in)
  const due = m === cm && S.lastCheckin !== cm;
  const upd = el("button", {class: due ? "primary" : "ghost wide"}, due ? "Check in for " + mOnly(m) : `${ic("sync")}<span>Edit ${mOnly(m)}</span>`);
  upd.onclick = () => updateSheet(m);
  view.append(head, upd);

  // That month's story, not a ledger: what moved (entries whose balance changed in their own currency, plus new and removed
  // ones), biggest effect on net worth first; what exchange rates did to foreign balances that didn't change; the rest folds
  // into "N unchanged". The first month on record just lists everything.
  const rates = snap.rates || S.rates, prates = prevSnap ? (prevSnap.rates || S.rates) : null;
  const items = Object.keys(snap.items).map(id => {
    const it = snap.items[id], acc = S.accounts.find(a => a.id === id), prev = prevSnap && prevSnap.items[id];
    const b = +it[0] || 0, sg = sgn(it[2]), v = conv(b, it[1], rates);
    const same = prev && prev[1] === it[1], pb = same ? +prev[0] || 0 : null;
    const changed = !!prevSnap && (!same || Math.abs(b - pb) >= .005);
    const impact = !prevSnap ? 0 : same ? sg * (v - conv(pb, it[1], rates)) : sg * v - (prev ? sgn(prev[2]) * conv(+prev[0] || 0, prev[1], prates) : 0);
    return {id, b, cur:it[1], type:it[2], v, acc, prev, same, pb, changed, impact,
      name:(acc && acc.name) || it[3] || "Removed entry", platform:acc && acc.platform};
  });
  const rowFor = (a, chg) => {
    const t = TYPE[a.type] || TYPE.other, liab = isLiab(a.type);
    const sub = esc(a.platform || t.n) + (liab ? " · owed" : "") + (a.cur !== S.base && !a.gone ? `, <span class="amt">≈ ${fmt(a.v, S.base, {dec:0})}</span>` : "");
    // tap an entry to edit it (name, type, balance); removed entries stay read-only
    const row = el(a.acc && !a.gone ? "button" : "div", {class:"row"}, `${avatar(t, a.acc ? iconOf(a.acc) : null)}
      <span class="mid"><div class="t1">${esc(a.name)}</div><div class="t2">${sub}</div></span>
      <span class="end"><div class="t1 num amt">${liab ? "−" : ""}${fmt(a.b, a.cur)}</div>${chg ? `<div class="num">${chg}</div>` : ""}</span>`);
    if(a.acc && !a.gone) row.onclick = () => accountSheet(a.acc);
    return row;
  };
  const byValue = (x, y) => (isLiab(x.type) - isLiab(y.type)) || y.v - x.v;
  if(!prevSnap){
    const card = el("div", {class:"card"}); items.sort(byValue).forEach(a => card.appendChild(rowFor(a)));
    view.append(el("div", {class:"lbl-s"}, "Entries"), card);
  } else {
    // entries recorded last month but not this month
    Object.keys(prevSnap.items).filter(id => !snap.items[id]).forEach(id => {
      const it = prevSnap.items[id], acc = S.accounts.find(a => a.id === id);
      items.push({id, b:+it[0] || 0, cur:it[1], type:it[2], v:conv(+it[0] || 0, it[1], prates), acc, gone:true, changed:true,
        impact:-sgn(it[2]) * conv(+it[0] || 0, it[1], prates), name:(acc && acc.name) || it[3] || "Removed entry", platform:acc && acc.platform});
    });
    const moved = items.filter(a => a.changed).sort((x, y) => Math.abs(y.impact) - Math.abs(x.impact));
    const still = items.filter(a => !a.changed).sort(byValue);
    // exchange rates: what the month's rates did to balances that stayed the same in their own currency
    let fx = 0; const fxCurs = new Set();
    // counted on last month's balance for every foreign entry, changed or not, so the rows plus this line add up to the month's change
    items.forEach(a => { if(a.same && a.cur !== S.base){ const d = sgn(a.type) * (conv(a.pb, a.cur, rates) - conv(a.pb, a.cur, prates)); if(Math.abs(d) >= .5){ fx += d; fxCurs.add(a.cur); } } });
    const card = el("div", {class:"card"});
    moved.forEach(a => {
      const liab = isLiab(a.type);
      let chg;
      if(a.gone) chg = `<span class="t2">${a.acc ? "Not recorded" : "Removed"}</span>`;
      else if(!a.same) chg = '<span class="t2">New</span>';
      else { const d = a.b - a.pb, good = liab ? d < 0 : d > 0, dec = {};
        chg = liab ? `<span class="t2 ${good ? "pos" : "neg"} amt">${fmt(Math.abs(d), a.cur, dec)} ${d < 0 ? "paid off" : "more owed"}</span>`
          : `<span class="t2 ${good ? "pos" : "neg"} amt">${signed(d, a.cur)}</span>`; }
      card.appendChild(rowFor(a, chg));
    });
    if(Math.abs(fx) >= 1){
      const r = el("div", {class:"row fx-row"}, `<span class="avatar">${ic("sync")}</span>
        <span class="mid"><div class="t1">Exchange rates</div><div class="t2">${[...fxCurs].join(", ")}</div></span>
        <span class="end"><div class="t1 num amt ${fx > 0 ? "pos" : "neg"}">${signed(fx, S.base, 0)}</div></span>`);
      card.appendChild(r);
    }
    if(!card.childElementCount) card.appendChild(el("div", {class:"m-none"}, "No changes"));
    view.append(el("div", {class:"lbl-s"}, `Since ${esc(vsLabel(m, pm))}`), card);
    if(still.length){
      const more = el("div", {class:"more" + (UI.mUnch ? " open" : "")}), inner = el("div", {class:"more-in"}), sc = el("div", {class:"card m-unch"});
      still.forEach(a => sc.appendChild(rowFor(a))); inner.appendChild(sc); more.appendChild(inner);
      const btn = el("button", {class:"seeall" + (UI.mUnch ? " open" : ""), "aria-expanded":String(!!UI.mUnch)}, `<span>${still.length} ${due ? "to update" : "unchanged"}</span>${ic("expand")}`);
      btn.onclick = () => { UI.mUnch = !UI.mUnch; saveUI(); more.classList.toggle("open", UI.mUnch); btn.classList.toggle("open", UI.mUnch); btn.setAttribute("aria-expanded", String(UI.mUnch)); };
      view.append(btn, more);
    }
  }

  const del = el("button", {class:"quiet"}, "Remove " + mLong(m));
  armConfirm(del, "Tap again to remove", () => {
    delete S.snaps[m]; if(m === cm) S.lastCheckin = null;
    const gone = mLong(m); commit({keepMonth:true}); toast("Removed " + gone);
  });
  $("#mFoot").appendChild(del); // at the very bottom, under Allocation
  requestAnimationFrame(() => animateNum(tv, v, S.base, 700));
}

const sheet = $("#sheet");
let onClose = null;
function openSheet(build, opts = {}){

function closeSheet(){
  sheet.classList.remove("open");
  document.body.classList.remove("sheet-open");
  if(document.activeElement) document.activeElement.blur();
  if(onClose){ const f = onClose; onClose = null; f(); }
}
$("#scrim").onclick = closeSheet;
/* While any tray is up (the bottom sheet, the onboarding's currency tray), the page behind never scrolls. iOS ignores
   overflow:hidden on the body for touch, and a drag on a tray's header, on the scrim, or past the end of a tray's list
   would otherwise scroll the page underneath. So a touch drag may only scroll a list inside the tray, and only while that
   list still has room to go that way; everything else is cancelled. One guard for every tray. */
const TRAYS = "#sheet, .onb-tray";
const trayUp = () => document.body.classList.contains("sheet-open") || !!document.querySelector(".onb-tray");
let trayY = 0;
document.addEventListener("touchstart", e => { if(e.touches.length === 1) trayY = e.touches[0].clientY; }, {passive:true});
document.addEventListener("touchmove", e => {
  if(!trayUp() || e.touches.length !== 1) return;
  const y = e.touches[0].clientY, dy = y - trayY; trayY = y;
  if(!dy) return;
  const tray = e.target.closest && e.target.closest(TRAYS);
  for(let n = e.target; tray && n && n !== tray.parentNode; n = n.parentNode){
    if(n.nodeType !== 1 || n.scrollHeight <= n.clientHeight + 1) continue;
    const oy = getComputedStyle(n).overflowY;
    if(oy !== "auto" && oy !== "scroll") continue;
    if(dy > 0 ? n.scrollTop > 0 : n.scrollTop + n.clientHeight < n.scrollHeight - 1) return; // this list can still scroll
  }
  if(e.cancelable) e.preventDefault();
}, {passive:false});
document.addEventListener("keydown", e => { if(e.key === "Escape" && sheet.classList.contains("open")) closeSheet(); });
function enableDrag(area){
  let y0 = 0, dy = 0, t0 = 0, dragging = false;
  area.addEventListener("pointerdown", e => {
    if(e.target.closest("button")) return;
    dragging = true; y0 = e.clientY; dy = 0; t0 = performance.now(); sheet.classList.add("dragging");
    try{ area.setPointerCapture(e.pointerId); }catch(_){}
  });
  area.addEventListener("pointermove", e => {
    if(!dragging) return;
    dy = e.clientY - y0; const d = dy > 0 ? dy : dy / 6;
    sheet.style.transform = `translateY(${d}px)`;
  });
  const up = () => {
    if(!dragging) return; dragging = false; sheet.classList.remove("dragging"); sheet.style.transform = "";
    const v = dy / Math.max(1, performance.now() - t0);
    if(dy > 120 || v > 0.6) closeSheet();
  };
  area.addEventListener("pointerup", up); area.addEventListener("pointercancel", up);
}
function sheetBar(bar, title, left, right){
  bar.innerHTML = "";
  const l = el("button", {class:"l gtext"}, left || "Cancel"); l.onclick = closeSheet;
  const t = el("div", {class:"ttl"}, esc(title));
  const r = el("button", {class:"r gtext"}, right ? esc(right.label) : "");
  if(right){ r.onclick = right.onClick; } else r.style.visibility = "hidden";
  bar.append(l, t, r);
  return r;
}
function armConfirm(btn, label, action){
  btn.onclick = () => {
    if(btn.classList.contains("armed")){ action(); return; }
    const orig = btn.textContent; btn.classList.add("armed"); btn.textContent = label;
    setTimeout(() => { btn.classList.remove("armed"); btn.textContent = orig; }, 3000);
  };
}

/* ---------- account sheet ---------- */
// sheetOpts.after(draft): return to another sheet (the monthly update) instead of closing
function accountSheet(acc, sheetOpts = {}){
  const editing = !!acc;
  const draft = acc ? {...acc} : {id:uid(), name:"", type:sheetOpts.type || "bank", platform:"", cur:S.base, bal:""};
  openSheet(({bar, body}) => {
    const save = sheetBar(bar, editing ? "Edit entry" : "New entry", "Cancel", {label: editing ? "Done" : "Add", onClick: () => {
      const bal = parseNum(balIn.value);
      draft.name = nameIn.value.trim(); draft.platform = platIn.value.trim();
      draft.bal = isNaN(bal) ? 0 : Math.abs(bal);
      if(TYPE[draft.type] && TYPE[draft.type].dep != null){ const d = parseNum(depIn.value); draft.dep = isNaN(d) ? TYPE[draft.type].dep : d; }
      else delete draft.dep;
      if(!draft.name) return;

    }});

    const curRow = pick("Currency", curOpts, draft.cur, v => { draft.cur = v; setSym(); });

    platF.append(platIn, dl);

    const depNote = el("p", {class:"note"}, "Applied at each new month.");
    const syncDepNote = () => depNote.style.display = depF.style.display;
    typeRow.querySelector("select").addEventListener("change", syncDepNote); syncDepNote();
    body.append(top, rows, depNote);
    if(editing){
      const del = el("button", {class:"danger"}, "Delete entry");
      armConfirm(del, "Tap again to delete", () => {

        popBubble("a:" + draft.id, () => { S.accounts = S.accounts.filter(a => a.id !== draft.id); commit(); });
      });
      body.appendChild(del);

    }
    validate();
    if(!editing) setTimeout(() => nameIn.focus({preventScroll:true}), 550);
  }, sheetOpts);
}

/* ---------- monthly update sheet ---------- */
// What to suggest for entry a in month m when m has no record of it yet: its value from the latest earlier month,
// moved by its yearly value change (depreciation) for the months in between.
function carried(a, m){
  const cm = monthKey();
  let from = null;
  for(const k of Object.keys(S.snaps).sort().reverse()){
    if(k < m && S.snaps[k].items[a.id]){ from = k; break; }
  }
  let v, gap = 0;
  if(m === cm){
    // the current balance already carries last month's value, unless it was edited since; only an untouched value moves by depreciation
    v = +a.bal || 0;
    if(from && v === (+S.snaps[from].items[a.id][0] || 0)) gap = mIndex(m) - mIndex(from);
  }
  else if(from){ v = +S.snaps[from].items[a.id][0] || 0; gap = mIndex(m) - mIndex(from); }
  else {
    // filling in history before the first record: start from the nearest later month (or today's balance), value change undone
    const later = Object.keys(S.snaps).sort().find(k => k > m && S.snaps[k].items[a.id]);
    if(later){ from = later; v = +S.snaps[later].items[a.id][0] || 0; gap = mIndex(m) - mIndex(later); }
    else if(m < cm){ from = cm; v = +a.bal || 0; gap = mIndex(m) - mIndex(cm); }
    else return {v:"", from:null};
  }
  const dep = a.dep != null ? +a.dep : (TYPE[a.type] && TYPE[a.type].dep);
  if(dep && gap !== 0) v = Math.round(v * Math.pow(1 + dep / 100, gap / 12) * 100) / 100;
  return {v, from};
}
// The monthly check-in. A new month starts from the last one: tick what hasn't changed, type what has; a progress bar
// counts the rows you've been through (saving is never blocked). Each row shows its last recorded value and the change.
// Amounts show formatted with the currency symbol and turn plain while you type. After saving, a reveal shows the
// month's total, its change and what moved it. keep: {month, vals, done} to come back after adding an entry.
const symOf = c => CURS[c] ? CURS[c].sym : c;
const nfCache = {};
const fmtIn = (v, c) => (nfCache[c] = nfCache[c] || new Intl.NumberFormat(CURS[c] ? CURS[c].loc : "en-IE", {maximumFractionDigits:2})).format(v);
function lastRecorded(a, m){
  for(const k of Object.keys(S.snaps).sort().reverse()) if(k < m && S.snaps[k].items[a.id]) return {m:k, v:+S.snaps[k].items[a.id][0] || 0};
  return null;
}
const prevKey = m => Object.keys(S.snaps).filter(k => k < m).sort().pop() || null;
function updateSheet(start, keep){
  const cur = monthKey();
  let month = keep ? keep.month : start && start <= cur ? start : cur;
  openSheet(({bar, body}) => {
    const R = {}; // id -> {a, inp, row, hint}
    let done = new Set(keep && keep.done || []), isNew = false, sugg = {};
    const accs = [...S.accounts].sort((a,b) => isLiab(a.type) - isLiab(b.type));
    const totalV = el("span", {class:"v num amt"}), totalD = el("div", {class:"upd-chg num"});
    const status = el("div", {class:"carry"}), prog = el("div", {class:"upd-prog"}, "<i></i>");
    const rest = el("button", {class:"upd-rest"});
    const val = id => parseNum(R[id].inp.value);
    const monthRates = () => month !== cur && S.snaps[month] && S.snaps[month].rates || S.rates;
    const recompute = () => {
      let t = 0; const rates = monthRates();
      accs.forEach(a => { const v = val(a.id); if(!isNaN(v)) t += sgn(a.type) * conv(v, a.cur, rates); });
      totalV.textContent = fmt(t, S.base, {dec:0});
      const pk = prevKey(month);
      if(pk){ const d = t - snapTotal(S.snaps[pk]);
        totalD.innerHTML = Math.abs(d) < .5 ? `Same as ${vsLabel(month, pk)}` : `<span class="${d > 0 ? "up" : "down"} amt">${d > 0 ? "▲" : "▼"} ${fmt(Math.abs(d), S.base, {dec:0})}</span> vs ${vsLabel(month, pk)}`; }
      else totalD.textContent = "";
    };
    const paintProgress = () => {
      prog.style.display = isNew ? "" : "none";
      const n = accs.filter(a => done.has(a.id)).length, left = accs.length - n;
      prog.firstChild.style.width = (accs.length ? n / accs.length * 100 : 0) + "%";
      const st = status.querySelector(".cnt"); if(st) st.textContent = left ? `${n}/${accs.length} checked` : "All checked";
      rest.style.display = isNew && left > 1 && n > 0 ? "" : "none";
      rest.textContent = `Mark rest unchanged`;
    };
    const paintRow = id => {
      const {a, inp, row, hint} = R[id], t = TYPE[a.type] || TYPE.other;
      row.classList.toggle("ok", isNew && done.has(id));
      const last = lastRecorded(a, month), v = val(id);
      const base = esc(a.platform || t.n) + (t.liab ? " · owed" : "");
      if(!last){ hint.innerHTML = base; return; }
      let h = `${mDate(last.m).toLocaleDateString("en-GB", {month:"short"})}: <span class="amt">${fmt(last.v, a.cur)}</span>`;
      if(!isNaN(v) && Math.abs(v - last.v) >= .005){
        const d = v - last.v, good = t.liab ? d < 0 : d > 0;
        h += ` · <span class="${good ? "up" : "down"} amt">${d > 0 ? "+" : "−"}${fmt(Math.abs(d), a.cur)}</span>`;
        if(sugg[id] != null && Math.abs(v - sugg[id]) < .005 && a.dep !== 0) { const dp = a.dep != null ? +a.dep : t.dep; h += ` <span class="dep">(${dp > 0 ? "+" : "−"}${Math.abs(dp)}%/yr)</span>`; }
      }
      hint.innerHTML = h;
    };
    const setVal = (id, v) => { R[id].inp.value = v === "" || v == null || isNaN(v) ? "" : fmtIn(+v, R[id].a.cur); };
    // a recorded month shows its own values; a new month (or the current month before its check-in) starts from the last one
    const fill = (vals, keepDone) => {
      const snap = S.snaps[month];
      isNew = month === cur ? S.lastCheckin !== cur : !snap;
      if(!keepDone) done = new Set();
      sugg = {}; let from = null;
      accs.forEach(a => {
        let v;
        if(!isNew && snap) v = snap.items[a.id] ? snap.items[a.id][0] : (month === cur ? a.bal : "");
        else { const c = carried(a, month); v = c.v; if(c.v !== "") sugg[a.id] = +c.v; if(c.from && (!from || c.from > from)) from = c.from; }
        if(vals && a.id in vals) v = vals[a.id];
        setVal(a.id, v);
      });
      status.innerHTML = "";
      if(!isNew) status.append(el("span", {}, "Saved values"));
      else if(from){
        const clear = el("button", {class:"link"}, "Clear all");
        clear.onclick = () => { accs.forEach(a => setVal(a.id, "")); done = new Set(); status.firstChild.innerHTML = `Blank · <b class="cnt"></b>`; clear.remove(); accs.forEach(a => paintRow(a.id)); paintProgress(); recompute(); };
        status.append(el("span", {}, `From ${esc(mLabel(from))} · <b class="cnt"></b>`), clear);
      } else status.append(el("span", {}, `<b class="cnt"></b>`));
      saveBtn.textContent = "Save " + mLong(month);
      accs.forEach(a => paintRow(a.id)); paintProgress(); recompute();
    };

    const reveal = m => {
      sheetBar(bar, mLong(m), "Close"); bar.querySelector(".r").style.visibility = "hidden";
      body.innerHTML = "";
      const snap = S.snaps[m], total = snap ? snapTotal(snap) : 0, pk = prevKey(m);
      const wrap = el("div", {class:"reveal"});
      wrap.append(el("div", {class:"rv-k"}, `Your ${esc(mOnly(m))}`), el("div", {class:"rv-total num amt"}, fmt(total, S.base, {dec:0})));
      if(pk && snap){
        const pv = snapTotal(S.snaps[pk]), d = total - pv, pct = pv ? d / Math.abs(pv) * 100 : 0;
        wrap.append(el("div", {class:"rv-chg num " + (d >= 0 ? "up" : "down")}, Math.abs(d) < .5 ? `Same as ${esc(vsLabel(m, pk))}` :
          `<span class="amt">${d > 0 ? "▲" : "▼"} ${fmt(Math.abs(d), S.base, {dec:0})}</span> (${Math.abs(pct).toFixed(1)}%) vs ${esc(vsLabel(m, pk))}`));
        // a new high, or a run of up months ending here
        const sr = series(), i = sr.findIndex(p => p.m === m), others = sr.filter(p => p.m !== m);
        let badge = "";
        if(others.length >= 2 && total > Math.max(...others.map(p => p.v)) + .5) badge = "New high";
        else { let run = 0; for(let k = i; k > 0 && sr[k].x - sr[k-1].x === 1 && sr[k].v > sr[k-1].v + .5; k--) run++; if(run >= 3) badge = `${run} months up`; }
        if(badge) wrap.append(el("div", {class:"rv-badge"}, badge));
        // what moved, by the Breakdown groups (gross, so paying down the mortgage shows as debts)
        const a = splitGroups(snapRows(S.snaps[pk]), {gross:true}), b = splitGroups(snapRows(snap), {gross:true});
        const moves = b.groups.map((g, j) => ({n:g.n, c:g.c, d:g.v - a.groups[j].v}));
        moves.push({n:"Debts", c:GROUPS.find(g => g.liab).c, d:a.debts - b.debts, debt:true});
        const mv = moves.filter(x => Math.abs(x.d) >= 1).sort((x, y) => Math.abs(y.d) - Math.abs(x.d)).slice(0, 5);
        if(mv.length){
          const card = el("div", {class:"card rv-moves"});
          card.innerHTML = mv.map(x => `<div class="mv"><span class="sw" style="background:${x.c}"></span><span class="nm">${x.debt ? (x.d > 0 ? "Debts paid" : "Debts added") : esc(x.n)}</span>
            <span class="d num amt ${x.d > 0 ? "up" : "down"}">${x.d > 0 ? "+" : "−"}${fmt(Math.abs(x.d), S.base, {dec:0})}</span></div>`).join("");
          wrap.append(card);
        } else wrap.append(el("div", {class:"rv-line"}, "No change"));
      } else {
        const nk = Object.keys(S.snaps).filter(k => k > m).sort()[0];
        if(nk && snap){ const d = snapTotal(S.snaps[nk]) - total;
          wrap.append(el("div", {class:"rv-chg num " + (d >= 0 ? "up" : "down")}, `<span class="amt">${d >= 0 ? "▲" : "▼"} ${fmt(Math.abs(d), S.base, {dec:0})}</span> to ${esc(mLabel(nk))}`));
        } else wrap.append(el("div", {class:"rv-line"}, "First month recorded"));
      }
      const ok = el("button", {class:"primary"}, "Done"); ok.onclick = closeSheet;
      wrap.append(ok); body.append(wrap);
      const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
      if(!still && wrap.animate) [...wrap.children].forEach((n, k) => n.animate([{opacity:0, transform:"translateY(10px)"}, {opacity:1, transform:"none"}],
        {duration:500, delay:80 + k * 90, easing:"cubic-bezier(.2,.7,.2,1)", fill:"backwards"}));
    };

    const doSave = () => {
      if(month === cur){
        accs.forEach(a => { const v = val(a.id); a.bal = isNaN(v) ? 0 : Math.abs(v); });
        S.lastCheckin = cur;
        commit();
      } else {
        const items = {}, old = S.snaps[month];
        if(old) for(const id in old.items) if(!S.accounts.some(a => a.id === id)) items[id] = old.items[id];
        accs.forEach(a => { const v = val(a.id); if(!isNaN(v)) items[a.id] = [Math.abs(v), a.cur, a.type, a.name]; });
        // a past month keeps the exchange rates it was saved with
        if(Object.keys(items).length) S.snaps[month] = makeSnap(items, old && old.rates); else delete S.snaps[month];
        commit({keepMonth:true});
      }

      if(S.snaps[month]) reveal(month); else { closeSheet(); toast("Saved " + mLong(month)); }
    };
    sheetBar(bar, "Check-in", "Cancel", {label:"Save", onClick: () => doSave()});

    const mCard = el("div", {class:"card"});
    const mf = el("div", {class:"field"}, "<label>Month</label>");
    const mIn = el("input", {type:"month", class:"month-in", max:cur}); mIn.value = month;
    mIn.onchange = () => { if(!mIn.value || mIn.value > cur){ mIn.value = cur; } month = mIn.value; fill(); };
    mf.appendChild(mIn); mCard.appendChild(mf);

    const card = el("div", {class:"card"});
    accs.forEach(a => {
      const t = TYPE[a.type] || TYPE.other;
      const row = el("div", {class:"row upd-row"});
      row.innerHTML = `${avatar(t, iconOf(a))}<span class="mid"><div class="t1">${esc(a.name)}</div><div class="t2 hint"></div></span>`;
      const box = el("label", {class:"amt-in"}, `<span class="sym">${esc(symOf(a.cur))}</span>`);
      const inp = el("input", {inputmode:"decimal", placeholder:"0", "aria-label":a.name + (t.liab ? " amount owed" : " balance"), autocomplete:"off"});
      box.appendChild(inp);
      const chk = el("button", {class:"chk", "aria-label":"Unchanged: " + a.name}, `<i>${ic("check")}</i>`);
      row.append(el("span", {class:"end"}), chk); row.querySelector(".end").appendChild(box);
      R[a.id] = {a, inp, row, hint: row.querySelector(".hint")};
      inp.onfocus = () => { const v = parseNum(inp.value); inp.value = isNaN(v) ? "" : plain(v); setTimeout(() => inp.select(), 0); };
      inp.onblur = () => { setVal(a.id, parseNum(inp.value)); paintRow(a.id); };
      inp.oninput = () => { if(isNew){ done.add(a.id); paintProgress(); } row.classList.toggle("ok", isNew); paintRow(a.id); recompute(); };
      inp.onkeydown = e => { if(e.key === "Enter"){ const i = accs.indexOf(a), nx = accs[i + 1]; nx ? R[nx.id].inp.focus() : inp.blur(); } };
      // tick: unchanged (or the suggested value for things that lose or gain value over time); tap again to untick
      chk.onclick = () => {
        if(done.has(a.id)) done.delete(a.id);
        else { done.add(a.id); if(isNaN(val(a.id)) && sugg[a.id] != null) setVal(a.id, sugg[a.id]); }
        if(navigator.vibrate) navigator.vibrate(8);
        paintRow(a.id); paintProgress(); recompute();
      };
      card.appendChild(row);
    });
    rest.onclick = () => { accs.forEach(a => { if(!done.has(a.id)){ done.add(a.id); if(isNaN(val(a.id)) && sugg[a.id] != null) setVal(a.id, sugg[a.id]); } paintRow(a.id); }); paintProgress(); recompute(); };
    // add a new entry without losing what was typed
    const add = el("button", {class:"row add-row"}, `<span class="avatar">${ic("add")}</span><span class="mid">New entry</span>`);
    add.onclick = () => {

    const tot = el("div", {class:"upd-total"}, "<span>Net worth</span>");
    const tr = el("div", {class:"upd-tr"}); tr.append(totalV, totalD); tot.appendChild(tr);
    const saveBtn = el("button", {class:"primary"}); saveBtn.onclick = () => doSave();
    body.append(mCard,
      el("div", {class:"lbl-s"}, "Balances"), status, prog, card, rest, tot, saveBtn);
    fill(keep && keep.vals, !!keep);
  });
}

/* ---------- first run ---------- */
// With no data at all, the Net worth tab shows a welcome instead of an empty €0 chart. "Get started" opens a short setup:
// pick what you have (and your main currency), enter rough balances, see your starting point, then optionally add a few
