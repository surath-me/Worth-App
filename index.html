<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Worth">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>Worth</title>
<script>
/* Development build: on the dev domain (and localhost) use the orange icons and the "Worth Dev" name,
   so the two home screen apps are easy to tell apart. Production keeps the defaults above. */
(function () {
  var DEV_HOSTS = ["worth-app-dev.vercel.app", "localhost", "127.0.0.1"];
  if (DEV_HOSTS.indexOf(location.hostname) < 0) return;
  window.WORTH_DEV = true; /* seeds sample data when the app is empty */
  var set = function (sel, attr, val) { var el = document.querySelector(sel); if (el) el.setAttribute(attr, val); };
  set('meta[name="apple-mobile-web-app-title"]', "content", "Worth Dev");
  set('link[rel="apple-touch-icon"]', "href", "/dev/apple-touch-icon.png");
  set('link[rel="icon"]', "href", "/dev/icon-192.png");
  set('link[rel="manifest"]', "href", "/dev/manifest.webmanifest");
  document.title = "Worth Dev";
})();
</script>
<style>
:root{
  /* Dark mode only for now. The light palette is kept below under [data-theme="light"] (nothing sets it yet). */
  --bg:#000000; --card:#1C1C1E; --text:#FFFFFF; --sec:#98989F; --ter:#5C5C61;
  --sep:rgba(84,84,88,.55); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.34);
  --accent:#3CD9CF; --g1:#0EA67A; --g2:#2466E0; --g1a:rgba(54,245,178,.45); --g2a:rgba(58,164,255,.45); --up:#36F5B2; --down:#FF6961; --nav:rgba(0,0,0,.72);
  --scrim:rgba(0,0,0,.5); --behind:#000;
  --spring:cubic-bezier(.32,.72,0,1); --ease:cubic-bezier(.65,0,.35,1);
  color-scheme:dark;
  --grad:linear-gradient(115deg,var(--g1) 0%,#0B82A6 50%,var(--g2) 100%);
  --glow:0 10px 26px -10px var(--g1a),0 8px 28px -10px var(--g2a);
  --glass:rgba(44,44,48,.5); --glass-strong:rgba(58,58,62,.6); --lens:rgba(255,255,255,.14);
  --rim:rgba(255,255,255,.4); --rim2:rgba(255,255,255,.07); --sheet-glass:rgba(24,24,26,.78);
  --gshadow:0 14px 36px -14px rgba(0,0,0,.8);
  --card2:#2C2C2E;
  --bounce:cubic-bezier(.34,1.56,.64,1);
  --tabind:rgba(0,0,0,.5); --tabbg:rgba(60,60,64,.8);
}
:root[data-theme="light"]{
  --bg:#F2F2F7; --card:#FFFFFF; --text:#000000; --sec:#6C6C70; --ter:#AEAEB2;
  --sep:rgba(60,60,67,.16); --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.2);
  --accent:#0BA6A0; --g1:#0A9C73; --g2:#1F5ED6; --g1a:rgba(15,203,140,.5); --g2a:rgba(42,134,255,.45); --up:#0FB57A; --down:#E5484D; --nav:rgba(242,242,247,.78);
  --scrim:rgba(0,0,0,.28);
  --glass:rgba(255,255,255,.58); --glass-strong:rgba(255,255,255,.7); --lens:rgba(255,255,255,.85);
  --rim:rgba(255,255,255,.95); --rim2:rgba(255,255,255,.28); --sheet-glass:rgba(242,242,247,.8);
  --gshadow:0 12px 32px -14px rgba(25,40,70,.3),0 1px 2px rgba(0,0,0,.04);
  --card2:#FFFFFF;
  --tabind:rgba(0,0,0,.07); --tabbg:rgba(255,255,255,.8);
  color-scheme:light;
}
:root{box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--text)}
/* The page only scrolls vertically: no sideways panning or rubber-banding, and no double-tap (or pinch) zoom.
   touch-action is intersected down the tree, so a descendant cannot opt back in to horizontal panning; only touch events (monthly swipe, chart scrub) still see sideways gestures. */
html,body{overflow-x:hidden;overscroll-behavior-x:none;touch-action:pan-y}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  font-size:15px;line-height:1.3;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;transition:background-color .5s var(--spring);
}
body::before{content:"";position:fixed;inset:0 0 auto;height:calc(env(safe-area-inset-top,0px) + 14px);z-index:10;pointer-events:none;opacity:0;transition:opacity .3s;-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);-webkit-mask-image:linear-gradient(rgba(0,0,0,.6) 50%,transparent);mask-image:linear-gradient(rgba(0,0,0,.6) 50%,transparent)}
body.scrolled::before{opacity:1}
body.sheet-open{overflow:hidden;background:var(--behind)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}

#app{position:relative;max-width:560px;margin:0 auto;min-height:100%;background:var(--bg);transform-origin:50% 0;
  transition:transform .55s var(--spring),border-radius .55s var(--spring)}
body.sheet-open #app{transform:scale(.93);border-radius:14px;overflow:hidden}

.aura{position:absolute;inset:0 0 auto;height:720px;pointer-events:none;z-index:0;overflow:hidden;opacity:.85;
  -webkit-mask-image:linear-gradient(#000 40%,transparent 92%);mask-image:linear-gradient(#000 40%,transparent 92%)}
.aura::before,.aura::after{content:"";position:absolute;z-index:1;width:135%;aspect-ratio:1;border-radius:50%;will-change:transform,scale}
.aura-drift{position:absolute;left:0;top:0;width:110%;height:70%;background:radial-gradient(closest-side,rgba(11,130,166,.26),transparent);animation:drift 13s ease-in-out infinite alternate;will-change:transform}
.aura::before{left:-40%;top:-38%;background:radial-gradient(closest-side,var(--g1a),transparent);animation:spinA 19s linear infinite,breathe 8s ease-in-out infinite alternate}
.aura::after{right:-45%;top:-18%;background:radial-gradient(closest-side,var(--g2a),transparent);animation:spinB 24s linear infinite,breathe 10s ease-in-out -4s infinite alternate}
@keyframes spinA{from{transform:rotate(0deg) translateX(24%) rotate(0deg)}to{transform:rotate(360deg) translateX(24%) rotate(-360deg)}}
@keyframes spinB{from{transform:rotate(180deg) translateX(26%) rotate(-180deg)}to{transform:rotate(-180deg) translateX(26%) rotate(180deg)}}
@keyframes breathe{from{scale:1}to{scale:1.22}}
/* the aura is hidden behind the scrim while a sheet is open: pause it so the sheet animation gets the frame budget */
body.sheet-open .aura-drift,body.sheet-open .aura::before,body.sheet-open .aura::after{animation-play-state:paused}
@keyframes drift{from{transform:translate3d(-.9%,0,0)}to{transform:translate3d(-8.2%,19.3%,0)}}
main{position:relative;z-index:1}
.gtext{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--accent);transition:transform .25s var(--spring),background-color .2s}
.icon-btn:active{transform:scale(.86);background:var(--fill)}
.icon-btn svg{width:22px;height:22px}

/* no top bar: the large title sits right under the status bar (html already pads the top safe area); the bottom inset is padded once on html */
/* the aura runs under the status bar to the very top; only the content is pushed below the safe area */
main{padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 108px}
h1.large{font-size:22px;font-weight:700;letter-spacing:.005em;margin:18px 4px 8px}

/* hero */
.hero{padding:0 4px}
.hero-label{position:absolute;left:0;bottom:6px;font-size:13px;color:var(--sec);height:18px;transition:color .2s}
.hero-top{position:relative;height:0}
.eye{width:30px;height:30px;margin:-4px 0 -4px -7px;border-radius:50%;display:grid;place-items:center;color:var(--sec);transition:transform .3s var(--bounce),color .2s}
.eye svg{width:18px;height:18px}
.eye:active{transform:scale(.8);color:var(--text)}
.split{font-size:13px;color:var(--sec);margin-top:4px}
.split b{font-weight:500;color:var(--text)}
.total{font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.08;margin:2px 0 4px;white-space:nowrap;
  transition:filter .45s var(--spring),font-size .3s var(--spring)}
.delta{font-size:13px;font-weight:600;height:20px;display:flex;align-items:center;gap:6px;color:var(--sec)}
.delta .chg{display:inline-flex;align-items:center;gap:3px;transition:color .3s}
.delta .chg.up{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}.delta .chg.up svg{color:var(--g1)} .delta .chg.down{color:var(--down)}
.delta .when{font-weight:400;color:var(--sec)}
.delta svg{width:11px;height:11px;transition:transform .4s var(--spring)}
.delta .down svg{transform:rotate(180deg)}
body.hide .amt{filter:blur(10px)}

/* chart */
.chart-wrap{position:relative;height:210px;margin:14px -16px 0;touch-action:pan-y;user-select:none;-webkit-user-select:none}
#chart{display:block;width:100%;height:100%;overflow:visible}
#chart .line{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transition:stroke .4s}
#chart .area{transition:opacity .8s ease .25s}
#chart .base{stroke:var(--ter);stroke-width:1;stroke-dasharray:2 4}
#chart .lbl{fill:var(--ter);font-size:11px}
#chart .scrub{opacity:0;transition:opacity .15s}
#chart.scrubbing .scrub{opacity:1}
#chart.scrubbing .enddot,#chart.scrubbing .pulse{opacity:0}
#chart .scrub line{stroke:var(--sec);stroke-width:1}
#chart .scrub circle{stroke:var(--card);stroke-width:3}
.scrub-tip{position:absolute;left:0;top:0;transform:translate(-50%,calc(-100% - 12px));pointer-events:none;opacity:0;white-space:nowrap;
  padding:6px 11px;border-radius:13px;background:var(--glass-strong);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  box-shadow:var(--gshadow);font-size:14px;font-weight:600;text-align:center;line-height:1.2;transition:opacity .15s}
.scrub-tip small{display:block;font-size:11px;font-weight:500;color:var(--sec)}
.chart-wrap.scrubbing .scrub-tip{opacity:1}
#chart .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s var(--ease) infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.5}70%,100%{transform:scale(3.2);opacity:0}}
.chart-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 40px;font-size:14px;color:var(--sec);pointer-events:none;opacity:0;transition:opacity .4s}
.chart-empty.show{opacity:1}

/* segmented */
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:9px;padding:2px;margin:12px 0 0}
.seg button{position:relative;z-index:1;height:30px;font-size:13px;font-weight:500;border-radius:7px;transition:color .2s}
.seg button[aria-pressed="true"]{font-weight:600}
.seg .thumb{position:absolute;top:2px;bottom:2px;left:2px;border-radius:7px;background:#636366;box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 1px rgba(0,0,0,.08);transition:transform .45s var(--spring)}
:root[data-theme="light"] .seg .thumb{background:var(--card)}

/* cards & lists */
.section-h{display:flex;justify-content:space-between;align-items:baseline;margin:28px 4px 8px}
.section-h h2{font-size:19px;font-weight:700;margin:0}
.section-h button{color:var(--accent);font-size:15px}
.card{background:var(--card);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:60px;position:relative;width:100%;text-align:left;transition:background-color .2s}
.row + .row::before{content:"";position:absolute;top:0;left:64px;right:0;height:.5px;background:var(--sep)}
button.row:active{background:var(--fill)}
.avatar{background-image:linear-gradient(150deg,rgba(255,255,255,.38),rgba(255,255,255,0) 55%,rgba(0,0,0,.08));box-shadow:inset 0 0 0 .5px rgba(255,255,255,.25);flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:600;font-size:16px}
.row .mid{flex:1;min-width:0}
.row .t1{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:13px;color:var(--sec);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .end{text-align:right;flex:none}
.row .end .t1{font-weight:600}
.row.enter{animation:enter .6s var(--spring) both}
@keyframes enter{from{opacity:0;transform:translateY(-10px) scale(.98)}}

.primary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:999px;background:var(--grad);background-size:180% 100%;color:#fff;font-weight:600;font-size:16px;margin-top:16px;box-shadow:var(--glow);text-shadow:0 1px 1px rgba(0,0,0,.12);animation:sheen 6s ease-in-out infinite alternate;transition:transform .3s var(--spring),opacity .2s,box-shadow .3s}
@keyframes sheen{from{background-position:0% 50%}to{background-position:100% 50%}}
.primary:active{transform:scale(.97);opacity:.85}
.primary:disabled{opacity:.35;box-shadow:none}


.nudge{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--spring),margin .5s var(--spring);margin-top:0}
.nudge.show{grid-template-rows:1fr;margin-top:16px}
.nudge > div{overflow:hidden}
.nudge .card{padding:14px 16px;display:flex;gap:12px;align-items:center}
.nudge .dot{width:9px;height:9px;border-radius:50%;background:var(--grad);box-shadow:0 0 10px var(--g1a),0 0 14px var(--g2a);flex:none;animation:dotPulse 2s ease-in-out infinite}
@keyframes dotPulse{50%{transform:scale(.6);opacity:.5}}
.nudge p{margin:0;font-size:14px;color:var(--sec)} .nudge b{color:var(--text);font-weight:600;display:block}

/* allocation */
.alloc{padding:16px}
.bub-h{display:flex;align-items:center;justify-content:space-between;min-height:30px;margin:-2px 0 4px;font-size:15px;font-weight:600}
.bub-h .t2{font-size:13px;font-weight:400;color:var(--sec);margin:0 auto}
.bub-back{display:flex;align-items:center;gap:2px;margin-left:-6px;font-weight:600;font-size:15px;color:var(--text)}
.bub-back svg{width:22px;height:22px}
.bub{position:relative;height:300px;margin:0 -8px;overflow:hidden;border-radius:18px}
.bub.lvl{height:340px;touch-action:pan-y}
.bub.lvl.pan{cursor:grab}
.bub.live .bb:not(.gone){transition:opacity .2s ease;transition-delay:0ms!important}
.bub-leg{margin-top:6px}
.bubcard{padding:14px 16px 12px}
.bub-leg .bl{display:flex;align-items:center;gap:10px;width:100%;padding:6px 0;font-size:14px;text-align:left;color:var(--text)}
.bub-leg .sw{width:10px;height:10px;border-radius:50%;flex:none}
.bub-leg .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bub-leg .pc{color:var(--sec);width:44px;text-align:right}
.bub-leg .vl{width:104px;text-align:right;font-weight:500}
.bb{position:absolute;left:0;top:0;border-radius:50%;padding:0;will-change:transform,opacity;transform-origin:50% 50%;
  transition:transform .7s var(--bounce),opacity .35s ease}
.bb.gone{opacity:0;pointer-events:none;transition:transform .5s cubic-bezier(.4,0,.2,1),opacity .3s ease}
.bb .bt{display:flex;flex-direction:column;align-items:center;gap:1px;max-width:100%;transition:opacity .35s ease}
.bb.pre .bt,.bb.gone .bt{opacity:0;transition-duration:.15s}
.bf{position:absolute;inset:0;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;overflow:hidden;padding:0 6px;
  color:#fff;text-align:center;line-height:1.15;
  background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.38),rgba(255,255,255,0) 58%),var(--bc);
  box-shadow:inset 0 -6px 14px rgba(0,0,0,.18);
  animation:bfloat 6s ease-in-out infinite;animation-delay:var(--fd);transition:scale .3s var(--bounce)}
.bb:active .bf{scale:.92}
.bb.liab .bf{background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.3),rgba(255,255,255,0) 58%),color-mix(in srgb,var(--bc) 82%,#000)}
.bn{font-size:13px;font-weight:600;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;-webkit-hyphens:auto;hyphens:auto}
.bv{font-size:12px;font-weight:500;opacity:.88;white-space:nowrap}
.bi svg{width:18px;height:18px;fill:#fff;opacity:.9}
.bb.sm .bi{display:none}
.bb.xs .bn{display:none} .bb.xxs .bv{display:none}
@keyframes bfloat{0%,100%{translate:0 0}25%{translate:1.5px -3px}50%{translate:-1px 2px}75%{translate:-2px -1.5px}}
@media (prefers-reduced-motion: reduce){.bf{animation:none}}
.donut-wrap{position:relative;width:170px;height:170px;margin:4px auto 8px}
#donut{width:100%;height:100%;transform:rotate(-90deg)}
#donut circle{fill:none;stroke-width:14}
#donut .dbg{stroke:var(--fill)}
#donut .dseg{transition:stroke-dasharray 1s var(--spring)}
.donut-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.donut-c .num{font-size:20px;font-weight:700;letter-spacing:-.02em}
.donut-c .t2{font-size:12px;color:var(--sec)}
.more{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .5s var(--spring),visibility 0s .5s}
.more.open{grid-template-rows:1fr;visibility:visible;transition:grid-template-rows .5s var(--spring),visibility 0s}
.more-in{overflow:hidden;min-height:0}
.seeall{display:flex;align-items:center;justify-content:center;gap:2px;width:100%;padding:12px 0 14px;color:var(--text);font-size:14px;font-weight:600}
.section-h .edit-btn{color:var(--text);margin:-8px -6px -8px 0}
.edit-btn{width:38px;height:38px;display:grid;place-items:center;color:var(--text);transition:transform .25s var(--spring),opacity .2s}
.section-h .edit-btn svg,.edit-btn svg{width:24px;height:24px} .edit-btn:active{transform:scale(.85);opacity:.7}
.alloc .seg{margin:0 0 14px}
.abars .ab{padding:7px 0}
.abars .ab-h{display:flex;align-items:center;gap:10px;font-size:14px}
.abars .ab-h .nm{flex:1} .abars .ab-h .pc{color:var(--sec)} .abars .ab-h .vl{font-weight:500;width:90px;text-align:right}
.abars .ab-t{height:8px;border-radius:4px;background:var(--fill);margin-top:7px;overflow:hidden}
.abars .ab-t i{display:block;height:100%;border-radius:4px;width:0;transition:width 1s var(--spring)}
.seeall svg{width:20px;height:20px;transition:transform .4s var(--spring)} .seeall.open svg{transform:rotate(180deg)}
.legend{margin-top:12px}
.legend .li{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:14px}
.legend .sw{width:10px;height:10px;border-radius:3px;flex:none}
.legend .nm{flex:1}
.legend .pc{color:var(--sec);width:48px;text-align:right}
.legend .vl{width:110px;text-align:right;font-weight:500}

.empty-list{padding:28px 20px;text-align:center;color:var(--sec);font-size:14px}
.foot{text-align:center;color:var(--ter);font-size:12px;margin-top:28px}

.section-h button{font-size:14px;font-weight:600}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between;
  padding:26px 16px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,var(--bg) 46%);
  transition:transform .5s var(--spring),opacity .3s}
body.sheet-open .tabbar{transform:translateY(120%);opacity:0;pointer-events:none}
.tabs{position:relative;flex:none;display:grid;grid-template-columns:repeat(3,84px);height:62px;padding:4px;border-radius:31px;background:var(--card);
  box-shadow:0 10px 30px -12px rgba(0,0,0,.3),inset 0 0 0 .5px var(--sep)}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--text);border-radius:27px;transition:color .3s}
.tab svg{width:24px;height:24px;transition:transform .5s var(--spring)}
.tab[aria-selected="true"]{color:var(--accent)}
.tab[aria-selected="true"] svg{transform:scale(1.1)}
.tab:active svg{transform:scale(.85)}
.tab-ind{position:absolute;top:4px;bottom:4px;left:4px;width:92px;border-radius:27px;background:var(--fill);transition:transform .55s var(--spring)}
.fab{flex:none;width:62px;height:62px;padding:0;justify-content:center;border-radius:50%;background:var(--grad);background-size:180% 100%;color:#fff;font-weight:700;font-size:17px;
  display:flex;align-items:center;gap:7px;box-shadow:var(--glow);text-shadow:0 1px 1px rgba(0,0,0,.12);animation:sheen 6s ease-in-out infinite alternate;transition:transform .35s var(--spring)}
.fab svg{width:26px;height:26px;transition:transform .5s var(--spring)}
.fab:active{transform:scale(.93)} .fab:active svg{transform:rotate(90deg)}

.more-btn{display:block;margin:10px auto 0;font-size:14px;font-weight:600;padding:6px 12px}
.mnav{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin:4px 0 6px}

.mview.slide-l{animation:slideL .45s var(--spring)}

@keyframes slideL{from{opacity:0;transform:translateX(-28px)}}
@keyframes slideR{from{opacity:0;transform:translateX(28px)}}
.mbar{margin:18px 4px 0}

/* sheet */
#scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .45s var(--spring);z-index:20}

#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;background:var(--bg);
  border-radius:14px 14px 0 0;max-height:calc(100% - env(safe-area-inset-top,0px) - 10px);display:flex;flex-direction:column;
  transform:translateY(105%);transition:transform .5s var(--spring);box-shadow:0 -10px 40px rgba(0,0,0,.18);visibility:hidden}

#sheet.dragging{transition:none}
.grab{flex:none;padding:6px 16px 0;touch-action:none}
.handle{width:36px;height:5px;border-radius:3px;background:var(--fill2);margin:0 auto 6px}
.sheet-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:44px}
.sheet-bar .ttl{font-weight:600;text-align:center}
.sheet-bar .l{justify-self:start;color:var(--accent)} .sheet-bar .r{justify-self:end;color:var(--accent);font-weight:600;transition:opacity .2s}
.sheet-bar .r:disabled{opacity:.35}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
.lbl-s{font-size:13px;color:var(--sec);margin:22px 16px 7px}
.lbl-s:first-child{margin-top:6px}

.field + .field::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.field label{flex:none;min-width:84px}
.field input{flex:1;min-width:0;border:0;background:none;font-size:16px;padding:13px 0;outline:none;text-align:right}
.field input.left{text-align:left}
.field input::placeholder{color:var(--ter)}
.field .cur{color:var(--sec);flex:none}
.big-amt{position:relative;display:block;padding:18px 16px;cursor:text}
.big-amt .disp{display:flex;align-items:baseline;justify-content:center;gap:6px;pointer-events:none;min-height:42px}

.chips{display:flex;flex-wrap:wrap;gap:8px}

.chip{flex:none;height:34px;padding:0 14px;border-radius:17px;background:var(--card);font-size:14px;display:inline-flex;align-items:center;gap:7px;transition:background-color .25s,color .25s,transform .3s var(--spring)}
.chip:active{transform:scale(.94)}

.plain-btn{width:100%;height:50px;color:var(--accent);font-size:15px;text-align:left;padding:0 16px;position:relative}

.upd-row .end input{width:120px;border:0;background:var(--fill);border-radius:9px;padding:8px 10px;text-align:right;font-size:16px;outline:none;font-variant-numeric:tabular-nums;transition:box-shadow .2s}
.upd-row .end input:focus{box-shadow:0 0 0 2px var(--accent)}

.upd-total{display:flex;justify-content:space-between;align-items:baseline;padding:16px 4px 0}
.upd-total span:first-child{color:var(--sec)}

.month-in{border:0;background:var(--fill);border-radius:9px;padding:7px 10px;font-size:16px;color:var(--accent);outline:none;text-align:right;max-width:190px}
.hist-row .del{color:var(--down);font-size:14px;padding:6px 10px;border-radius:8px;transition:background-color .2s,color .2s}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:30;transform:translate(-50%,-140%) scale(.9);opacity:0;
  background:var(--card);color:var(--text);padding:10px 16px 10px 12px;border-radius:22px;font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center;
  box-shadow:0 8px 30px rgba(0,0,0,.16);transition:transform .55s var(--spring),opacity .3s;pointer-events:none;white-space:nowrap}
#toast.show{transform:translate(-50%,0) scale(1);opacity:1}
#toast svg{width:20px;height:20px;color:var(--g1)}

/* ---------- liquid glass ---------- */
.card,.ghost,.danger{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(175%);backdrop-filter:blur(26px) saturate(175%);box-shadow:var(--gshadow);position:relative}
.card::after,.tabs::after,.fab::after,.icon-btn::after,.seg .thumb::after,.ghost::after,#sheet::after,#toast::after,.tab-ind::after,.danger::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;padding:1px;
  background:linear-gradient(150deg,var(--rim),var(--rim2) 28%,transparent 52%,var(--rim2) 78%,var(--rim));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.icon-btn{position:relative;background:var(--glass-strong);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:var(--gshadow);transition:transform .5s var(--bounce),background-color .2s}
.icon-btn:active{transform:scale(.82);background:var(--glass-strong)}
/* glass tab bar */
/* Floating bar, proportions copied from Apple Health's tab bar (measured on a 402pt screenshot):
   pill 274 x 62, tabs on an 86px pitch with 8px of padding at both ends (first icon centre 51px from the edge),
   selected capsule 94 x 55 (wider than the pitch), inset 4px at the sides and 3.5px top and bottom, icon ~22px, label 11px.
   The pill and the 62px + button sit together as one centred group, 10px apart, about 18px above the bottom edge. */
.tabbar{--tw:86px;background:none;pointer-events:none;gap:10px;justify-content:center;padding:20px 20px max(10px,calc(env(safe-area-inset-bottom,0px) - 16px))}
.tabbar > *{pointer-events:auto}
.tabs{flex:none;grid-template-columns:repeat(3,var(--tw));height:62px;padding:3.5px 8px;border-radius:31px;background:var(--tabbg);-webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);
  box-shadow:var(--gshadow)}
.tab{border-radius:27.5px;gap:2px}
.tab svg{width:26px;height:26px}
.tab-ind{top:3.5px;bottom:3.5px;left:4px;width:calc(var(--tw) + 8px);border-radius:27.5px;background:var(--tabind);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.06);transition:transform .6s var(--spring)}
/* no coloured glow and no gloss on the + button: a plain gradient circle with a soft dark shadow for depth */
.fab{position:relative;width:62px;height:62px;transition:transform .6s var(--bounce);box-shadow:0 8px 20px -8px rgba(0,0,0,.6)}
.fab:active{transform:scale(.84)}
/* glass segmented */
#app .seg,#sheet .seg{background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:12px;padding:3px}
#app .seg .thumb,#sheet .seg .thumb{top:3px;bottom:3px;left:3px;border-radius:9px;background:var(--lens);box-shadow:0 4px 14px -6px rgba(0,0,0,.3);transition:transform .6s var(--bounce)}
/* glass sheet: grows out of the + button */
#sheet{background:var(--sheet-glass);-webkit-backdrop-filter:blur(34px) saturate(180%);backdrop-filter:blur(34px) saturate(180%);border-radius:28px 28px 0 0;
  transition:transform .62s var(--spring),opacity .35s,border-radius .62s var(--spring),visibility 0s linear .62s}
#sheet.open{transition:transform .62s var(--spring),opacity .25s,border-radius .62s var(--spring),visibility 0s}
#sheet.dragging{transition:none}
#sheet.from-fab{transform-origin:calc(50% + 142px) calc(100% - 49px)}
#sheet.from-fab:not(.open){transform:scale(.1);opacity:0;border-radius:200px}
#toast{background:var(--glass-strong);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%)}
/* macro view transitions */
.view.active{animation:none}
.view.active > *{animation:rise .8s var(--spring) both}
.view.active > *:nth-child(2){animation-delay:.05s}
.view.active > *:nth-child(3){animation-delay:.1s}
.view.active > *:nth-child(4){animation-delay:.15s}
.view.active > *:nth-child(5){animation-delay:.2s}
.view.active > *:nth-child(n+6){animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translate3d(0,32px,0) scale(.96)}}

/* ---------- content cards: solid rounded surfaces; glass stays on floating controls ---------- */
.card{background:var(--card);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none}
.card::after{content:none}
.card{border-radius:26px}
#sheet .card{background:var(--card2)}
.alloc{padding:18px 20px}
/* entry rows: round type icon, name and detail left, amount and share right, no dividers */
.card > .row:first-child{margin-top:6px}
.card > .row:last-child{margin-bottom:6px}
.row{gap:14px;padding:12px 20px;min-height:66px}
.row + .row::before{display:none}
.avatar{width:40px;height:40px;border-radius:50%;background-image:none;box-shadow:none}
.avatar svg{width:22px;height:22px}
svg.mi{fill:currentColor}
.row .t1{font-weight:500}
.row .t2{font-size:13px;margin-top:2px}
.row .end .t1{font-weight:500}
.upd-row{gap:12px;padding:10px 16px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
}

const fmtCache = {};
function fmt(v, cur=S.base, opts={}){
  const abs = Math.abs(v);
  const dec = opts.dec != null ? opts.dec : (abs >= 1000 ? 0 : 2);
  const key = cur + dec;
  if(!fmtCache[key]){
    const o = {minimumFractionDigits:dec, maximumFractionDigits:dec};
    // a currency Worth doesn't list (e.g. from an edited backup): format it by its code instead of crashing
    try{ fmtCache[key] = new Intl.NumberFormat(CURS[cur] ? CURS[cur].loc : "en-IE", {...o, style:"currency", currency:cur}); }
    catch(e){ const nf = new Intl.NumberFormat("en-IE", o); fmtCache[key] = {format: n => nf.format(n) + " " + String(cur || "?")}; }
  }
  return fmtCache[key].format(v);
}
function parseNum(s){
  if(s==null) return NaN;
  s = String(s).replace(/[\s'’]/g,"").replace(/[^\d.,\-]/g,"");
  if(!s) return NaN;
  const hasC = s.includes(","), hasD = s.includes(".");
  if(hasC && hasD){
    if(s.lastIndexOf(",") > s.lastIndexOf(".")) s = s.replace(/\./g,"").replace(",", ".");
    else s = s.replace(/,/g,"");
  } else if(hasC){
    const parts = s.split(",");
    if(parts.length > 2 || parts[parts.length-1].length === 3) s = s.replace(/,/g,"");
    else s = s.replace(",", ".");
  } else if(hasD){
    const parts = s.split(".");
    if(parts.length > 2) s = s.replace(/\./g,"");
  }
  return parseFloat(s);
}
const plain = n => (n==null || isNaN(n)) ? "" : String(Math.round(n*100)/100);

function conv(amount, cur, rates=S.rates, base=S.base){
  const r = rates[cur] || S.rates[cur] || 1;
  const rb = rates[base] || S.rates[base] || 1;
  return amount / r * rb;
}
const liveTotal = () => S.accounts.reduce((t,a) => t + sgn(a.type) * conv(+a.bal||0, a.cur), 0);
const liveDebts = () => S.accounts.reduce((t,a) => t + (isLiab(a.type) ? conv(+a.bal||0, a.cur) : 0), 0);
function snapTotal(s){
  let t = 0;
  for(const id in s.items){ const it = s.items[id]; t += sgn(it[2]) * conv(+it[0]||0, it[1], s.rates || S.rates); }
  return t;
}
function makeSnap(items, rates){ return {items, rates:{...(rates || S.rates)}}; }
function syncCurrentMonth(){
  const m = monthKey();
  if(!S.accounts.length){ delete S.snaps[m]; return; }
  const items = {};
  S.accounts.forEach(a => items[a.id] = [+a.bal||0, a.cur, a.type, a.name]);
  S.snaps[m] = makeSnap(items);
}
function commit(opts={}){
  if(!opts.keepMonth) syncCurrentMonth();
  S.updatedAt = Date.now();
  saveLocal(); render();
}
function series(){
  return Object.keys(S.snaps).sort().map(m => ({m, x:mIndex(m), v:snapTotal(S.snaps[m])}));
}
function rangeSeries(){
  const all = series();
  if(!UI.range) return all;
  const from = mIndex(monthKey()) - UI.range;
  return all.filter(p => p.x >= from);
}

/* ---------- number animation ---------- */
const easeOut = t => 1 - Math.pow(1 - t, 4);
function animateNum(node, to, cur, dur=900){
  const from = node._v != null ? node._v : 0;
  cancelAnimationFrame(node._raf);
  if(matchMedia("(prefers-reduced-motion: reduce)").matches || Math.abs(to-from) < 0.005){ node._v = to; node.textContent = fmt(to, cur); return; }
  const t0 = performance.now();
  const step = now => {
    const p = Math.min(1, (now - t0) / dur);
    const v = from + (to - from) * easeOut(p);
    node._v = v; node.textContent = fmt(v, cur);
    if(p < 1) node._raf = requestAnimationFrame(step); else { node._v = to; node.textContent = fmt(to, cur); }
  };
  node._raf = requestAnimationFrame(step);
}

/* monotone cubic path */
function smoothPath(P){
  const n = P.length;
  if(n === 1) return `M${P[0][0]},${P[0][1]}`;
  const dx = [], m = [], t = [];
  for(let i=0;i<n-1;i++){ dx[i] = P[i+1][0]-P[i][0]; m[i] = (P[i+1][1]-P[i][1]) / (dx[i]||1); }
  t[0] = m[0]; t[n-1] = m[n-2];
  for(let i=1;i<n-1;i++) t[i] = m[i-1]*m[i] <= 0 ? 0 : (m[i-1]+m[i])/2;
  for(let i=0;i<n-1;i++){
    if(m[i] === 0){ t[i] = 0; t[i+1] = 0; continue; }
    const a = t[i]/m[i], b = t[i+1]/m[i], s = a*a + b*b;
    if(s > 9){ const k = 3/Math.sqrt(s); t[i] = k*a*m[i]; t[i+1] = k*b*m[i]; }
  }
  let d = `M${P[0][0]},${P[0][1]}`;
  for(let i=0;i<n-1;i++){
    const h = dx[i]/3;
    d += ` C${P[i][0]+h},${P[i][1]+t[i]*h} ${P[i+1][0]-h},${P[i+1][1]-t[i+1]*h} ${P[i+1][0]},${P[i+1][1]}`;
  }
  return d;
}

    </defs>

    ${P.length>1 ? `<path class="line glowline" d="${line}" stroke="${col}" stroke-width="6" filter="url(#blur)" opacity=".75"/><path class="line" d="${line}" stroke="${col}"/>` : ""}
    <circle class="enddot" cx="${last[0]}" cy="${last[1]}" r="14" fill="url(#dotglow)"/>
    <circle class="pulse" cx="${last[0]}" cy="${last[1]}" r="4.5" style="fill:${c2}"/>
    <circle class="enddot" cx="${last[0]}" cy="${last[1]}" r="4.5" style="fill:${c2}"/>
    <text class="lbl" x="${padX}" y="${H-8}" text-anchor="start">${mShort(pts[0].m)}</text>

/* scrubbing */
(function(){
  const wrap = $("#chartWrap"); let active = false, lastIdx = -1, startX = 0, startY = 0, decided = false;

  // reads the curve's y at that x, and the value, label and total follow it continuously.
  let first_ = true, targetX = 0, targetIdx = 0, curX = 0, raf = 0, lastT = 0, shownIdx = -1, lp = null, lpLen = 0;
  const vb = () => $("#chart").viewBox.baseVal.width;
  function curveY(x){
    let lo = 0, hi = lpLen;
    for(let k = 0; k < 22; k++){ const mid = (lo + hi) / 2; if(lp.getPointAtLength(mid).x < x) lo = mid; else hi = mid; }
    return lp.getPointAtLength(hi).y;
  }
  function paint(){
    const first = chartPts[0], lastP = chartPts[chartPts.length-1];

    const tip = $("#sTip"), W = wrap.clientWidth, sc = W / vb();
    const near = targetIdx, p = chartPts[near];
    if(near !== shownIdx){
      shownIdx = near;
      tip.querySelector("small").textContent = mShort(p.m);
      tip.querySelector(".amt").textContent = fmt(p.v, S.base, {dec:0});
      const tot = $("#total"); cancelAnimationFrame(tot._raf); tot._v = p.v; tot.textContent = fmt(p.v); fitTotal();
      if(!first_) [tip.querySelector(".amt"), tot].forEach(n => n.animate && n.animate([{opacity:.25},{opacity:1}], {duration:220, easing:"ease-out"}));
      first_ = false;
      if(near === 0) $("#delta").innerHTML = '<span class="when">Start of range</span>';

  }

    chartPts.forEach((p,n) => { const dd = Math.abs(p.px - px); if(dd < bd){ bd = dd; best = n; } });
    targetIdx = best; targetX = chartPts[best].px;
    if(jump){
      lp = $("#chart").querySelector(".line:not(.glowline)"); lpLen = lp ? lp.getTotalLength() : 0;

    }
    if(!raf) raf = requestAnimationFrame(tick);
  }
  let hold = 0;

    if(chartPts.length < 2) return;
    active = true; decided = e.pointerType !== "touch"; startX = e.clientX; startY = e.clientY; lastIdx = -1;
    if(decided) start(e);

    else { clearTimeout(hold); hold = setTimeout(() => { if(active && !decided){ decided = true; start(e); } }, 160); }
  }
  function start(e){ clearTimeout(hold); scrubbing = true; $("#chart").classList.add("scrubbing"); wrap.classList.add("scrubbing"); try{ wrap.setPointerCapture(e.pointerId); }catch(_){} $("#sTip").innerHTML = '<span class="amt"></span><small></small>'; at(e.clientX, true); }

})();

const GROUPS = [
  {k:"savings", n:"Savings", types:["bank"], c:"#0A84FF"},

  {k:"inv", n:"Investments", types:["etf","stocks","mf","crypto"], c:"#14B8A6"},
  {k:"property", n:"Property", types:["property"], c:"#C79A3B"},
  {k:"more", n:"More", types:["vehicle","valuables","other"], c:"#64748B"},
  {k:"debt", n:"Debts", types:["mortgage","loan","card"], c:"#E5484D", liab:true}
];
let bubLevel = null;
// inside a group the entries sit on a honeycomb you can drag around (like the Apple Watch app grid):

// Rows are offset like a honeycomb. Only when even a 76px bubble wouldn't fit do they overflow and become draggable.
const HEX_FIT_MIN = 76;
// Every position is a true honeycomb slot (rows rh = cell·√3/2 apart, neighbouring rows offset by cell/2),
// so centres are always at least one cell apart: bubbles are cell − 8px wide, leaving an 8px gap minimum.
function hexLayout(items, W, H){
  const n = items.length, pad = 8, s3 = Math.sqrt(3)/2, out = [];

    if(!best || cell > best.cell) best = {c, rows, cell};
  }
  if(best.cell >= HEX_FIT_MIN){
    // fits: fill row by row, the last (shorter) row placed on the slots closest to the middle
    let {c, rows, cell} = best; cell = Math.min(cell, Math.min(W, H) - pad);
    for(let i = 0; i < n; i++){
      const row = Math.floor(i / c), m = row === rows - 1 ? n - row * c : c;
      const shift = rows > 1 ? (row % 2 ? cell / 4 : -cell / 4) : 0;
      const col = (i - row * c) + Math.round((c - m) / 2 + (m < c && row % 2 ? -.01 : .01));
      out.push({hx: (col - (c - 1) / 2) * cell + shift, hy: (row - (rows - 1) / 2) * cell * s3, r: (cell - 8) / 2});
    }
    return out;
  }

  const R = Math.max(1, Math.floor((H - pad - HEX_FIT_MIN) / (HEX_FIT_MIN * s3)) + 1);
  const cell = (H - pad) / (1 + (R - 1) * s3);
  for(let i = 0; i < n; i++){
    const col = Math.floor(i / R), row = i % R;
    out.push({hx: col * cell + (row % 2 ? cell / 2 : 0), hy: row * cell * s3, r: (cell - 8) / 2});
  }

}

    dl.innerHTML = `<span class="chg ${d >= 0 ? "up" : "down"} amt">${ARROW}${fmt(Math.abs(d), S.base, Math.abs(d) >= 100 ? {dec:0} : {})} (${Math.abs(pct).toFixed(1)}%)</span><span class="when">vs ${vsLabel(m, pm)}</span>`;
  } else dl.innerHTML = '<span class="when">First month on record</span>';
  head.append(tv, dl);
  // one action, right under the total: update this month (highlighted while the current month still waits for its check-in)
  const due = m === cm && S.lastCheckin !== cm;
  const upd = el("button", {class: due ? "primary" : "ghost wide"}, due ? "Update " + mOnly(m) : `${ic("sync")}<span>Update ${mOnly(m)}</span>`);
  upd.onclick = () => updateSheet(m);
  view.append(head, upd);

  // that month's entries: assets, then debts
  const rates = snap.rates || S.rates;
  const items = Object.keys(snap.items).map(id => {
    const it = snap.items[id], acc = S.accounts.find(a => a.id === id);
    return {id, b:+it[0] || 0, cur:it[1], type:it[2], v:conv(+it[0] || 0, it[1], rates),
      name:(acc && acc.name) || it[3] || "Removed entry", platform:acc && acc.platform, prev:prevSnap && prevSnap.items[id]};
  }).sort((a,b) => b.v - a.v);
  const group = (label, list) => {
    if(!list.length) return;
    const card = el("div", {class:"card"});
    list.forEach(a => {
      const t = TYPE[a.type] || TYPE.other, liab = isLiab(a.type);
      let chg = "";
      if(prevSnap){
        if(a.prev && a.prev[1] === a.cur){
          const d = a.b - (+a.prev[0] || 0), good = liab ? d < 0 : d > 0;
          chg = d === 0 ? '<span class="t2">No change</span>' : `<span class="t2 ${good ? "pos" : "neg"} amt">${signed(liab ? -d : d, a.cur, Math.abs(d) >= 100 ? 0 : 2)}</span>`;
        } else chg = '<span class="t2">New</span>';
      }
      const sub = esc(a.platform || t.n) + (a.cur !== S.base ? `, <span class="amt">≈ ${fmt(a.v, S.base, {dec:0})}</span>` : "");
      card.appendChild(el("div", {class:"row"}, `${avatar(t)}
        <span class="mid"><div class="t1">${esc(a.name)}</div><div class="t2">${sub}</div></span>
        <span class="end"><div class="t1 num amt">${liab ? "−" : ""}${fmt(a.b, a.cur)}</div><div class="num">${chg}</div></span>`));
    });
    view.append(el("div", {class:"lbl-s"}, label), card);
  };
  group("Assets", items.filter(a => !isLiab(a.type)));
  group("Debts", items.filter(a => isLiab(a.type)));

  const del = el("button", {class:"quiet"}, "Remove " + mLong(m));
  armConfirm(del, "Tap again to remove", () => {
    delete S.snaps[m]; if(m === cm) S.lastCheckin = null;
    const gone = mLong(m); commit({keepMonth:true}); toast("Removed " + gone);
  });
  view.append(del);
  requestAnimationFrame(() => animateNum(tv, v, S.base, 700));
}

/* ---------- sheet ---------- */
const sheet = $("#sheet");
let onClose = null;
function openSheet(build, opts = {}){
  if(!sheet.classList.contains("open")) sheet.classList.toggle("from-fab", !!opts.fromFab);
  sheet.innerHTML = "";
  const grab = el("div", {class:"grab"}, '<div class="handle"></div>');
  const bar = el("div", {class:"sheet-bar"});
  const body = el("div", {class:"sheet-body"});
  grab.appendChild(bar); sheet.append(grab, body);
  build({bar, body});
  const app = $("#app");
  app.style.transformOrigin = `50% ${window.scrollY + 40}px`;
  document.body.classList.add("sheet-open");
  sheet.getBoundingClientRect();
  requestAnimationFrame(() => sheet.classList.add("open"));
  enableDrag(grab);
}
function closeSheet(){
  sheet.classList.remove("open");
  document.body.classList.remove("sheet-open");
  if(document.activeElement) document.activeElement.blur();
  if(onClose){ const f = onClose; onClose = null; f(); }
}
$("#scrim").onclick = closeSheet;
document.addEventListener("keydown", e => { if(e.key === "Escape" && sheet.classList.contains("open")) closeSheet(); });
function enableDrag(area){
  let y0 = 0, dy = 0, t0 = 0, dragging = false;
  area.addEventListener("pointerdown", e => {
    if(e.target.closest("button")) return;
    dragging = true; y0 = e.clientY; dy = 0; t0 = performance.now(); sheet.classList.add("dragging");
    try{ area.setPointerCapture(e.pointerId); }catch(_){}
  });
  area.addEventListener("pointermove", e => {
    if(!dragging) return;
    dy = e.clientY - y0; const d = dy > 0 ? dy : dy / 6;
    sheet.style.transform = `translateY(${d}px)`;
  });
  const up = () => {
    if(!dragging) return; dragging = false; sheet.classList.remove("dragging"); sheet.style.transform = "";
    const v = dy / Math.max(1, performance.now() - t0);
    if(dy > 120 || v > 0.6) closeSheet();
  };
  area.addEventListener("pointerup", up); area.addEventListener("pointercancel", up);
}
function sheetBar(bar, title, left, right){
  bar.innerHTML = "";
  const l = el("button", {class:"l gtext"}, left || "Cancel"); l.onclick = closeSheet;
  const t = el("div", {class:"ttl"}, esc(title));
  const r = el("button", {class:"r gtext"}, right ? esc(right.label) : "");
  if(right){ r.onclick = right.onClick; } else r.style.visibility = "hidden";
  bar.append(l, t, r);
  return r;
}
function armConfirm(btn, label, action){
  btn.onclick = () => {
    if(btn.classList.contains("armed")){ action(); return; }
    const orig = btn.textContent; btn.classList.add("armed"); btn.textContent = label;
    setTimeout(() => { btn.classList.remove("armed"); btn.textContent = orig; }, 3000);
  };
}

  const t = $("#toast"); t.querySelector("span").textContent = msg;
  t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 1900);
}

// sheetOpts.after(draft): return to another sheet (the monthly update) instead of closing
function accountSheet(acc, sheetOpts = {}){

  openSheet(({bar, body}) => {

      else delete draft.dep;
      if(!draft.name) return;
      if(editing){ const i = S.accounts.findIndex(a => a.id === draft.id); S.accounts[i] = draft; }
      else { S.accounts.push(draft); justAdded = draft.id; }
      if(sheetOpts.after){ commit(); sheetOpts.after(draft); }
      else { closeSheet(); commit(); }
      toast(editing ? "Saved" : "Entry added");
    }});
    if(sheetOpts.after) bar.querySelector(".l").onclick = () => sheetOpts.after(null);

    top.append(nameIn, amt, oweNote);

    // compact picker rows
    const rows = el("div", {class:"card"});
    const pick = (label, options, value, onChange, decorate) => {

      sel.value = value;
      const paint = () => { const o = options.find(x => x.v === sel.value); val.innerHTML = (decorate ? decorate(o) : "") + esc(o ? o.n : ""); };
      sel.onchange = () => { onChange(sel.value); paint(); val.classList.remove("bump"); void val.offsetWidth; val.classList.add("bump"); };
      paint();
      f.append(lab, val, el("span", {class:"chev"}, "›"), sel);
      return f;
    };
    const typeOpts = TYPES.map(t => ({v:t.k, n:t.n, g: t.liab ? "Debts" : "Assets"}));
    if(!TYPE[draft.type]) draft.type = "other";
    const typeRow = pick("Type", typeOpts, draft.type, v => { draft.type = v; paintKind(); },
      o => `<span class="dot" style="background:${TYPE[o.v].c}"></span>`);
    // yearly value change, only for physical assets; prefilled with the type's default
    const depF = el("div", {class:"field"}, "<label>Value change / year</label>");
    const depIn = el("input", {inputmode:"decimal", autocomplete:"off", "aria-label":"Value change per year in percent"});
    depF.append(depIn, el("span", {class:"cur"}, "%"));
    let depType = null;
    const paintKind = () => {
      const t = TYPE[draft.type];
      oweNote.style.display = t.liab ? "" : "none";
      depF.style.display = t.dep != null ? "" : "none";
      if(t.dep != null && depType !== draft.type){
        depIn.value = draft.dep != null && depType === null ? draft.dep : t.dep;
        depType = draft.type;
      }
    };
    const curSym = c => CURS[c] ? CURS[c].sym : String(c || "");
    const setSym = () => { sym.textContent = curSym(draft.cur); };
    const curOpts = CUR_KEYS.map(c => ({v:c, n:c + " " + CURS[c].sym}));
    if(draft.cur && !CURS[draft.cur]) curOpts.push({v:draft.cur, n:String(draft.cur)}); // keep an unlisted currency selectable
    const curRow = pick("Currency", curOpts, draft.cur, v => { draft.cur = v; setSym(); });
    setSym();
    const platF = el("div", {class:"field"}, "<label>Platform</label>");
    const platIn = el("input", {placeholder:"Optional", autocomplete:"off", list:"platforms"}); platIn.value = draft.platform || "";
    const dl = el("datalist", {id:"platforms"}, PLATFORMS.map(p => `<option value="${esc(p)}">`).join(""));
    platF.append(platIn, dl);
    rows.append(typeRow, depF, curRow, platF);
    paintKind();

    const depNote = el("p", {class:"note"}, "Applied when a new month carries this value over, e.g. −15% a year for a car. You can still type the real value at each update.");
    const syncDepNote = () => depNote.style.display = depF.style.display;
    typeRow.querySelector("select").addEventListener("change", syncDepNote); syncDepNote();
    body.append(top, rows, depNote);
    if(editing){
      const del = el("button", {class:"danger"}, "Delete entry");
      armConfirm(del, "Tap again to delete", () => {
        S.accounts = S.accounts.filter(a => a.id !== draft.id);
        closeSheet(); commit(); toast("Entry deleted");
      });
      body.appendChild(del);
      body.appendChild(el("p", {class:"note"}, "Past months keep this entry’s balance in your history."));
    }
    validate();
    if(!editing) setTimeout(() => nameIn.focus({preventScroll:true}), 550);
  }, sheetOpts);
}

/* ---------- monthly update sheet ---------- */
// What to suggest for entry a in month m when m has no record of it yet: its value from the latest earlier month,
// moved by its yearly value change (depreciation) for the months in between.
function carried(a, m){
  const cm = monthKey();
  let from = null;
  for(const k of Object.keys(S.snaps).sort().reverse()){
    if(k < m && S.snaps[k].items[a.id]){ from = k; break; }
  }
  let v, gap = 0;
  if(m === cm){
    // the current balance already carries last month's value, unless it was edited since; only an untouched value moves by depreciation
    v = +a.bal || 0;
    if(from && v === (+S.snaps[from].items[a.id][0] || 0)) gap = mIndex(m) - mIndex(from);
  }
  else if(from){ v = +S.snaps[from].items[a.id][0] || 0; gap = mIndex(m) - mIndex(from); }
  else return {v:"", from:null};
  const dep = a.dep != null ? +a.dep : (TYPE[a.type] && TYPE[a.type].dep);
  if(dep && gap > 0) v = Math.round(v * Math.pow(1 + dep / 100, gap / 12) * 100) / 100;
  return {v, from};
}
// keep: {month, vals} to come back with typed values after adding an entry
function updateSheet(start, keep){
  const cur = monthKey();
  let month = start && start <= cur ? start : cur;
  if(keep) month = keep.month;
  openSheet(({bar, body}) => {
    let saveBtn;
    const inputs = {};
    const card = el("div", {class:"card"});
    const totalV = el("span", {class:"v num amt"});
    const carryNote = el("div", {class:"carry"});
    const saveLabel = () => "Save " + mLong(month);
    const recompute = () => {
      let t = 0;
      S.accounts.forEach(a => { const v = parseNum(inputs[a.id].value); if(!isNaN(v)) t += sgn(a.type) * conv(v, a.cur); });
      animateNum(totalV, t, S.base, 400);
    };
    // a month that is already recorded shows its own values; a new month (or the current month before its check-in) carries the last one over
    const fill = vals => {
      const snap = S.snaps[month];
      const isNew = month === cur ? S.lastCheckin !== cur : !snap;
      let from = null;
      S.accounts.forEach(a => {
        let v;
        if(vals && a.id in vals) v = vals[a.id];
        else if(!isNew && snap) v = snap.items[a.id] ? snap.items[a.id][0] : (month === cur ? a.bal : "");
        else { const c = carried(a, month); v = c.v; if(c.from && (!from || c.from > from)) from = c.from; }
        inputs[a.id].value = v === "" || v == null ? "" : plain(+v);
      });
      carryNote.innerHTML = "";
      if(isNew && from){
        const clear = el("button", {class:"link"}, "Clear all");
        clear.onclick = () => { S.accounts.forEach(a => inputs[a.id].value = ""); carryNote.firstChild.textContent = "Starting from blank."; clear.remove(); recompute(); };
        carryNote.append(el("span", {}, `Carried over from ${mLong(from)}. Change only what’s different.`), clear);
      }
      saveBtn.textContent = saveLabel(); recompute();
    };
    const doSave = () => {
      if(month === cur){
        S.accounts.forEach(a => { const v = parseNum(inputs[a.id].value); a.bal = isNaN(v) ? 0 : Math.abs(v); });
        S.lastCheckin = cur;
        closeSheet(); commit();
      } else {
        const items = {}, old = S.snaps[month];
        if(old) for(const id in old.items) if(!S.accounts.some(a => a.id === id)) items[id] = old.items[id];
        S.accounts.forEach(a => { const v = parseNum(inputs[a.id].value); if(!isNaN(v)) items[a.id] = [Math.abs(v), a.cur, a.type, a.name]; });
        // a past month keeps the exchange rates it was saved with
        if(Object.keys(items).length) S.snaps[month] = makeSnap(items, old && old.rates); else delete S.snaps[month];
        closeSheet(); commit({keepMonth:true});
      }
      UI.month = month;
      toast("Saved " + mLong(month));
    };
    sheetBar(bar, "Update balances", "Cancel", {label:"Save", onClick: doSave});

    const mCard = el("div", {class:"card"});
    const mf = el("div", {class:"field"}, "<label>Month</label>");
    const mIn = el("input", {type:"month", class:"month-in", max:cur}); mIn.value = month;
    mIn.onchange = () => { if(!mIn.value || mIn.value > cur){ mIn.value = cur; } month = mIn.value; fill(); };
    mf.appendChild(mIn); mCard.appendChild(mf);

    [...S.accounts].sort((a,b) => isLiab(a.type) - isLiab(b.type)).forEach(a => {
      const t = TYPE[a.type] || TYPE.other;
      const r = el("div", {class:"row upd-row"});
      r.innerHTML = `${avatar(t)}
        <span class="mid"><div class="t1">${esc(a.name)}</div><div class="t2">${esc(a.platform || t.n)}${t.liab ? " · owed" : ""}</div></span>`;
      const end = el("span", {class:"end"});
      const inp = el("input", {inputmode:"decimal", placeholder:"0", "aria-label":a.name + (t.liab ? " amount owed" : " balance"), autocomplete:"off"});
      inp.oninput = recompute;
      inp.onfocus = () => setTimeout(() => inp.select(), 0);
      inputs[a.id] = inp;
      end.append(inp, el("div", {class:"c"}, a.cur));
      r.appendChild(end); card.appendChild(r);
    });
    // add a new entry without losing what was typed
    const add = el("button", {class:"row add-row"}, `<span class="avatar">${ic("add")}</span><span class="mid">New entry</span>`);
    add.onclick = () => {
      const vals = {}; S.accounts.forEach(a => vals[a.id] = inputs[a.id].value === "" ? "" : parseNum(inputs[a.id].value));
      const m = month;
      accountSheet(null, {after: d => { if(d) vals[d.id] = d.bal; updateSheet(m, {month:m, vals}); }});
    };
    card.appendChild(add);
    const tot = el("div", {class:"upd-total"}, "<span>Net worth</span>"); tot.appendChild(totalV);
    saveBtn = el("button", {class:"primary"}, saveLabel()); saveBtn.onclick = doSave;
    body.append(mCard, el("p", {class:"note"}, "Pick an earlier month to fill in your history. Leave a field empty to skip that entry."),
      el("div", {class:"lbl-s"}, "Balances"), carryNote, card, tot, saveBtn);
    fill(keep && keep.vals);
  });
}

/* ---------- live exchange rates ---------- */
// Public, keyless and browser-friendly. Coinbase updates about every minute; ExchangeRate-API (open access) once a day as a fallback.
const RATES_TTL = 30 * 60 * 1000;
let ratesBusy = false;
async function fetchRates(force){
  if(ratesBusy || (!force && S.ratesAt && S.ratesSrc && Date.now() - S.ratesAt < RATES_TTL)) return;
  if(navigator.onLine === false) return;
  ratesBusy = true;
  const get = async url => { const r = await fetch(url, {cache:"no-store"}); if(!r.ok) throw new Error(r.status); return r.json(); };
  let raw = null, src = null;
  try{ raw = (await get("https://api.coinbase.com/v2/exchange-rates?currency=EUR")).data.rates; src = "coinbase"; }
  catch(e){
    try{ const j = await get("https://open.er-api.com/v6/latest/EUR"); if(j.result !== "success") throw 0; raw = j.rates; src = "er-api"; }
    catch(e2){ ratesBusy = false; return; } // offline or both down: keep the last rates
  }
  ratesBusy = false;
  const next = {EUR:1};
  for(const c of CUR_KEYS){ if(c === "EUR") continue; const v = parseFloat(raw && raw[c]); if(!(v > 0)) return; next[c] = v; }
  S.rates = Object.assign({}, S.rates, next); S.ratesAt = Date.now(); S.ratesSrc = src;
  // only the current month takes the new rates; earlier months keep theirs
  if(S.accounts.length) syncCurrentMonth();
  saveLocal();
  // quiet refresh, no re-animation
  if(!scrubbing && !sheet.classList.contains("open")){
    renderHero(); renderAlloc(); renderList();
    if(UI.tab === "worth") drawChart(false);
    if(UI.tab === "monthly") renderMonthly();
  }
  paintRatesInfo();
}

/* ---------- wiring ---------- */
$("#fab").onclick = () => accountSheet(null, {fromFab:true});
$("#btnUpdate").onclick = () => updateSheet();
document.querySelectorAll(".tab").forEach(t => t.onclick = () => setTab(t.dataset.tab));
$("#total").onclick = () => { UI.hide = !UI.hide; saveUI(); render(false); };
$("#allocMode").querySelectorAll("button").forEach(b => b.onclick = () => { UI.alloc = b.dataset.m; saveUI(); renderAlloc(); });
$("#range").querySelectorAll("button").forEach(b => b.onclick = () => {
  UI.range = +b.dataset.r; saveUI(); renderRange(); drawChart(true); renderHero();
});
// monthly: arrows, and swipe left/right anywhere on the view
$("#mPrev").onclick = () => stepMonth(-1);
$("#mNext").onclick = () => stepMonth(1);
(function(){
  let x0 = null, y0 = 0;
  const v = $("#vMonthly");
  v.addEventListener("touchstart", e => { if(e.touches.length !== 1){ x0 = null; return; } x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive:true});
  v.addEventListener("touchend", e => {
    if(x0 == null) return;
    const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0; x0 = null;
    if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) stepMonth(dx < 0 ? 1 : -1);
  }, {passive:true});
})();
// a blurred strip behind the status bar once content scrolls under it
addEventListener("scroll", () => document.body.classList.toggle("scrolled", scrollY > 8), {passive:true});
let rw = 0; addEventListener("resize", () => { if(UI.tab !== "worth") return; const w = $("#chartWrap").clientWidth; if(w !== rw){ rw = w; drawChart(false); renderBubbles(); } });
document.addEventListener("visibilitychange", () => { if(!document.hidden){ render(false); fetchRates(); } });

// static icons in the markup: <i data-mi="name"> becomes the svg, other elements get it as content
document.querySelectorAll("[data-mi]").forEach(n => {
  if(n.tagName === "I") n.outerHTML = ic(n.dataset.mi); else n.innerHTML = ic(n.dataset.mi);
});

// Development build only: when there is no data (first launch, or after Erase all data), seed a year of sample data.
// The generator lives in /dev/sample-data.js, which is removed from production builds (see vercel.json).
if(window.WORTH_DEV && !S.accounts.length && !Object.keys(S.snaps).length){
  try{ const {makeSample} = await import("/dev/sample-data.js"); S = normalize(makeSample()); saveLocal(); }catch(e){}
}
render(true);
if(UI.tab === "settings") renderSettings();
rw = $("#chartWrap").clientWidth;
// live exchange rates: on start when older than 30 minutes, then checked every 5 minutes (fetches only when stale)
fetchRates();
setInterval(() => { if(!document.hidden) fetchRates(); }, 5 * 60 * 1000);

/* ---------- offline ---------- */
if("serviceWorker" in navigator) addEventListener("load", () => { navigator.serviceWorker.register("/sw.js").catch(() => {}); });
})();
</script>
</body>
</html>
